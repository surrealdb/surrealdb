[package]
name = "surrealdb-embedded"
# The shared body of the embedded JavaScript engines. Each FFI shim
# (`@surrealdb/node`, `@surrealdb/wasm`) is published as an npm package rather
# than a crate, and this has no standalone use, so it is not published either.
publish = false
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Shared embedded SurrealDB engine for the JavaScript FFI shims"

[features]
default = []
kv-mem = ["surrealdb-core/kv-mem"]
kv-surrealkv = ["surrealdb-core/kv-surrealkv"]
# Tracing spans on the engine's functions (see `surrealdb-core`'s feature). A
# host that installs no span subscriber has no use for them.
observability = ["surrealdb-core/observability"]
# The e-graph optimiser (see `surrealdb-core`'s feature). Without it a
# statement is planned from the plan the binder and the loop passes leave,
# which answers the same rows.
egraph = ["surrealdb-core/egraph"]
# The datastore's own maintenance tasks (see `surrealdb-core`'s feature). A
# host that drives that work itself builds without them.
maintenance-tasks = ["surrealdb-core/maintenance-tasks"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
surrealdb-core = { workspace = true, features = [
    "crypto-digest",
    "crypto-password",
    "html-sanitize",
    "cjk-tokenizer",
    "vector-index",
    "fulltext",
    "regex-unicode",
    "collate",
    "geo",
    "scram",
    "text-diff",
    "url",
    "api",
    "files",
    "search",
    "encoding",
    "http",
] }
surrealdb-cnf = { workspace = true }
surrealdb-datastore = { workspace = true }
surrealdb-rpc = { workspace = true }
surrealdb-types = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
web-time = { workspace = true }

# A query stream's execution is driven by a task of its own, so that it is
# finished and its transaction finalised whether or not anyone is still reading.
# The browser drives it on the JavaScript microtask queue; every other target on
# tokio.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
