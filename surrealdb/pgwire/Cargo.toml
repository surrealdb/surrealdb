[package]
name = "surrealdb-pgwire"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "PostgreSQL wire protocol (v3.0) server for SurrealDB"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
surrealdb-catalog = { workspace = true }
surrealdb-core = { workspace = true, features = ["postgres"] }
surrealdb-datastore = { workspace = true }
surrealdb-iam = { workspace = true }
surrealdb-kvs = { workspace = true }
surrealdb-rpc = { workspace = true }
surrealdb-types = { workspace = true }
surrealdb-pgsql = { workspace = true }
surrealdb-sqlplan = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
axum-server = { workspace = true }

[dev-dependencies]
surrealdb-core = { workspace = true, features = ["kv-mem", "vector-index"] }
jsonwebtoken = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
# The TLS tests install the same process-wide provider the server does.
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace = true
