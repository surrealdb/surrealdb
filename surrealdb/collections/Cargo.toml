[package]
name = "surrealdb-collections"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = true
version.workspace = true
description = "Sorted vec-backed map and set types for SurrealDB (internal API)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/surrealdb-collections/"

[features]
# `revision` and `storekey` encodings of `VecMap` and `VecSet`, and the bounded `revision` reads.
revision = ["dep:revision"]
storekey = ["dep:storekey"]
# `serde` for `VecMap`, as a map.
serde = ["dep:serde"]
arbitrary = ["dep:arbitrary"]

[dependencies]
arbitrary = { workspace = true, optional = true }
revision = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
storekey = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "collections"
harness = false
required-features = ["revision", "storekey"]
