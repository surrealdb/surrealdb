[package]
name = "surrealdb-common"
edition.workspace = true
version.workspace = true
authors.workspace = true
publish = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

[features]
sys = ["dep:sysinfo"]
arbitrary = ["dep:arbitrary"]

[dependencies]
hashbrown.workspace = true
futures.workspace = true
chrono = { workspace = true }
surrealdb-types = { workspace = true }
thiserror = { workspace = true }
phf = { workspace = true, features = ["macros", "unicase"] }
rust_decimal = { workspace = true, features = ["maths", "serde-str"] }
unicase.workspace = true
arbitrary = { workspace = true, features = ["derive"], optional = true }
parking_lot.workspace = true
sysinfo = { workspace = true, optional = true }

# The two halves of `crate::time` and `crate::rt`, split by target so this
# crate never adds tokio's `time` feature to a browser build. That does not
# keep the feature out — `surrealdb-datastore` requests it unconditionally and
# cargo unifies — which is exactly why `crate::time` picks the timer rather
# than trusting the feature set. The non-browser wasm targets (WASI) take the
# tokio half.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, default-features = false, features = ["rt", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures.workspace = true
wasmtimer = { workspace = true, default-features = false, features = ["tokio"] }

[dev-dependencies]
hashbrown.workspace = true
tokio = { workspace = true, features = ["rt","time"] }

[lints]
workspace = true
