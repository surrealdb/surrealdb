[package]
name = "surrealdb-kvs-any"
publish = true
readme = "README.md"
documentation = "https://docs.rs/surrealdb-kvs-any/"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Tracing spans on the in-memory backend's functions; see
# `surrealdb-kvs-mem`'s feature of the same name.
observability = ["surrealdb-kvs-mem?/observability"]
kv-mem = ["dep:surrealdb-kvs-mem"]
kv-surrealkv = ["dep:surrealdb-kvs-surrealkv"]

[dependencies]
surrealdb-cnf = { workspace = true }
surrealdb-kvs = { workspace = true }
surrealdb-kvs-mem = { workspace = true, optional = true }
surrealdb-kvs-surrealkv = { workspace = true, optional = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
surrealdb-kvs-test = { workspace = true }
temp-dir = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "kvs"
path = "tests/kvs/main.rs"
harness = false

[lints]
workspace = true
