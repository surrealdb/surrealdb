[package]
name = "surrealdb-cf"
# A wasm-bindgen module for a Cloudflare Durable Object, not a crate: the build
# artefact is useless to a Cargo consumer.
publish = false
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "SurrealDB engine with the bytecode VM, over a sequenced log, for a Cloudflare Durable Object"

# An rlib only: cargo builds every crate type of a dependency, and on wasm32-unknown-emscripten a
# cdylib cannot be linked (workers-rs builds with a static relocation model), so a Rust host there
# could not depend on this crate. The JavaScript host's module is the cdylib of the same crate, built
# on request: `cargo rustc --profile <p> --target wasm32-unknown-unknown -p surrealdb-cf --crate-type
# cdylib` (cf-experiments `scripts/build-surreal.sh`), which writes the same `surrealdb_cf.wasm`.
[lib]
crate-type = ["rlib"]

[features]
default = ["js"]
# The `wasm-bindgen` exports (`Node`, `Connection`, `Frames`, free functions) a JavaScript host
# drives the node with. A Rust host (a workers-rs Worker) depends on this crate with
# `default-features = false` and uses `surrealdb_cf::node` instead; its glue then carries none of
# the exported class names.
js = []

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
surrealdb-cnf = { workspace = true }
surrealdb-core = { workspace = true, features = ["kv-mem"] }
surrealdb-embedded = { workspace = true }
surrealdb-kvs = { workspace = true }
surrealdb-kvs-mem = { workspace = true }
tokio-util = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# shale's tree reader: the folded B+tree in R2 under the nodes' replica tail. The branch whose
# fold takes its timing from web-time.
shale = { path = "../../../shaledb-wt-wasm/crates/shale" }
# shale's tier over R2: sealed segments and the folded tree, read by key.
edge-tier = { path = "../../../cf-experiments/edge-tier" }
# Sections: a commit's write set, sorted and self-indexed (bloom, key range, sparse fences) where it
# is made, read in place wherever it lands. Shared with the relay and the sequencer.
surrealds-section = { path = "../../../surrealds-emcc/crates/surrealds-section" }

# The poll-once helper (`log::now`) lifts Tokio's cooperative budget on the host's event loop.
[target.'cfg(target_os = "emscripten")'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
anyhow = { workspace = true }
surrealdb-rpc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
