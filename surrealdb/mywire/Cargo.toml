[package]
name = "surrealdb-mywire"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "MySQL wire protocol server for SurrealDB"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
surrealdb-core = { workspace = true, features = ["mysql"] }
surrealdb-datastore = { workspace = true }
surrealdb-iam = { workspace = true }
surrealdb-kvs = { workspace = true }
surrealdb-mysql = { workspace = true }
surrealdb-sqlplan = { workspace = true }
surrealdb-rpc = { workspace = true }
surrealdb-types = { workspace = true }

anyhow = { workspace = true }
axum-server = { workspace = true }
rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
bytes = { workspace = true }
rcgen = { workspace = true }
surrealdb-core = { workspace = true, features = ["kv-mem"] }
surrealdb-pgwire = { workspace = true }
tempfile = { workspace = true }
# The TLS tests install the same process-wide provider the server does.
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace = true

