[package]
name = "surrealdb-mywire"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "MySQL wire protocol server for SurrealDB"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
surrealdb-core = { workspace = true, features = ["mysql"] }
surrealdb-mysql = { workspace = true }
surrealdb-sqlplan = { workspace = true }
surrealdb-rpc = { workspace = true }
surrealdb-types = { workspace = true }

anyhow = { workspace = true }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rand = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
surrealdb-core = { workspace = true, features = ["kv-mem"] }

[lints]
workspace = true

