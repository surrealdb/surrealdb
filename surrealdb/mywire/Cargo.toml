[package]
name = "surrealdb-mywire"
publish = false
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "MySQL wire protocol server for SurrealDB"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
surrealdb-core = { workspace = true, features = ["mysql"] }
surrealdb-mysql = { workspace = true }
surrealdb-types = { workspace = true }

anyhow = { workspace = true }
rand = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
surrealdb-core = { workspace = true, features = ["kv-mem"] }

[lints]
workspace = true

