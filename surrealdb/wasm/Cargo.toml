[package]
name = "surrealdb-wasm"
# Distributed as the `@surrealdb/wasm-native` npm package, not as a crate: the
# build artefact is a wasm-bindgen module that is useless to a Cargo consumer.
publish = false
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Embedded SurrealDB engine for browsers, as WebAssembly"

[features]
# Empty, and it has to stay that way: `kv-surrealkv` reaches the origin private
# file system on wasm targets, so a default that named a backend would break every
# native build that resolves this crate's features.
default = []
kv-mem = ["surrealdb-embedded/kv-mem"]
kv-surrealkv = ["surrealdb-embedded/kv-surrealkv", "dep:surrealdb-kvs-surrealkv"]
# Reports panics to the browser console. Off in a release build, where the
# hook's message strings are dead weight.
debug = []

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
surrealdb-embedded = { workspace = true, features = ["observability", "egraph", "maintenance-tasks"] }
# Only for asking whether the browser keeps the origin's storage.
surrealdb-kvs-surrealkv = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
# Also reached by the `#[wasm_bindgen]` macro's expansion of every `async fn`.
wasm-bindgen-futures = { workspace = true }
wasm-streams = { workspace = true }

[lints]
workspace = true
