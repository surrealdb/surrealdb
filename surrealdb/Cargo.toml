[package]
name = "surrealdb"
publish = true
readme = "CARGO.md"
documentation = "https://docs.rs/surrealdb/"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

[features]
# Public features
default = ["protocol-ws", "rustls", "parse"]
# Tuning features for the embedded engine. They forward unconditionally, so
# selecting one brings the engine (and with it the database core) into the
# build even without a `kv-*` backend, as they always have.
allocator = ["surrealdb-engine-local/allocator"]
parse = ["dep:surrealdb-syn"]
protocol-http = ["dep:reqwest", "surrealdb-types/reqwest"]
protocol-ws = ["dep:tokio-tungstenite", "tokio/time"]
# Native only: tonic does not build for wasm32.
protocol-grpc = [
    "dep:tonic",
    "tonic?/gzip",
    "tonic?/zstd",
    "dep:surrealdb-protocol",
    "surrealdb-types/proto",
    "tokio/time",
]
# The `kv-*` features select a storage backend for the embedded engine. The
# engine crate is the only route from the SDK to the database core.
kv-mem = ["dep:surrealdb-engine-local", "surrealdb-engine-local/kv-mem", "dep:surrealdb-kvs", "tokio/time"]
kv-indxdb = ["dep:surrealdb-engine-local", "surrealdb-engine-local/kv-indxdb"]
kv-rocksdb = ["dep:surrealdb-engine-local", "surrealdb-engine-local/kv-rocksdb", "dep:surrealdb-kvs", "tokio/time"]
kv-tikv = ["dep:surrealdb-engine-local", "surrealdb-engine-local/kv-tikv", "tokio/time"]
kv-surrealkv = ["dep:surrealdb-engine-local", "surrealdb-engine-local/kv-surrealkv", "dep:surrealdb-kvs", "tokio/time"]
scripting = ["surrealdb-engine-local/scripting"]
http = ["surrealdb-engine-local/http"]
native-tls = [
    "dep:native-tls",
    "reqwest?/native-tls",
    "tokio-tungstenite?/native-tls",
]
rustls = [
    "dep:rustls",
    "reqwest?/default-tls",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
    "tonic?/tls-webpki-roots",
    "tonic?/tls-aws-lc",
]
ml = ["surrealdb-engine-local/ml"]
jwks = ["surrealdb-engine-local/jwks"]
arbitrary = ["surrealdb-engine-local/arbitrary"]
allocation-tracking = ["surrealdb-engine-local/allocation-tracking"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = [
    "protocol-ws",
    "protocol-http",
    "protocol-grpc",
    "kv-mem",
    "kv-rocksdb",
    "rustls",
    "native-tls",
    "http",
    "scripting",
    "parse",
]
targets = []

[dependencies]
# workspace internal dependencies
surrealdb-engine-api = { workspace = true }
surrealdb-engine-local = { workspace = true, default-features = false, optional = true }
surrealdb-iam = { workspace = true }
surrealdb-kvs = { workspace = true, optional = true }
surrealdb-rpc = { workspace = true }
surrealdb-syn = { workspace = true, optional = true }
surrealdb-types = { workspace = true, features = ["convert"] }
surrealdb-types-derive = { workspace = true, features = ["sdk-path"] }

# Other crates (anyhow used for import stream compat with core's execute_import)
anyhow.workspace = true
boxcar.workspace = true
async-channel.workspace = true
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true
indexmap = { workspace = true, features = ["serde"] }
path-clean.workspace = true
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
url.workspace = true

# Optional crates
native-tls = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = [
    "json",
    "multipart",
    "stream",
], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys = "0.3"
rustls = { workspace = true, optional = true, features = ["ring"] }
rustls-pki-types = { version = "1.14.0", features = ["web"] }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
tokio = { workspace = true, default-features = false, features = [
    "rt",
    "sync",
] }
tokio-tungstenite-wasm.workspace = true
uuid = { workspace = true, features = ["serde", "js", "v4", "v7"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures.workspace = true
wasmtimer = { workspace = true, default-features = false, features = ["tokio"] }
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustls = { workspace = true, optional = true, features = ["aws_lc_rs"] }
surrealdb-protocol = { workspace = true, optional = true, features = ["rpc"] }
tokio = { workspace = true, default-features = false, features = [
    "macros",
    "io-util",
    "io-std",
    "fs",
    "rt-multi-thread",
    "time",
    "sync",
] }
tokio-tungstenite = { workspace = true, optional = true, features = ["url"] }
tonic = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
ciborium.workspace = true
surrealdb-cnf = { workspace = true }
surrealdb-syn = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
env_logger.workspace = true
flate2.workspace = true
parking_lot.workspace = true
web-time.workspace = true
rand.workspace = true
rayon.workspace = true
regex.workspace = true
rstest.workspace = true
serial_test.workspace = true
temp-dir.workspace = true
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ulid = { workspace = true, features = ["serde"] }
wiremock.workspace = true

[package.metadata.cargo-machete]
# Unused in our source; only needed so the derive is built with sdk-path
# for macro output (::surrealdb::types). Not exposed on surrealdb-types.
ignored = ["surrealdb-types-derive"]

[lints]
workspace = true

[lib]
name = "surrealdb" # Needed for the nightly crate as we will be renaming it
bench = false

[[bench]]
name = "sdb"
harness = false

[[bench]]
name = "array_uniq"
harness = false

[[bench]]
name = "array_complement"
harness = false

[[bench]]
name = "array_difference"
harness = false

[[bench]]
name = "array_intersect"
harness = false
