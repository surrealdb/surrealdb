[package]
name = "surrealdb-syn"
publish = true
readme = "README.md"
documentation = "https://docs.rs/surrealdb-syn/"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Tracing spans on this crate's functions (`#[instrument]`). Off, the
# functions run without a span wrapper; log events are not affected. Turned on
# by `surrealdb-core`'s `observability` feature.
observability = []

[dependencies]
common = { workspace = true }
surrealdb-cnf = { workspace = true }
surrealdb-iam = { workspace = true }
surrealdb-parser-next = { workspace = true }
surrealdb-parser-next-lower = { workspace = true }
surrealdb-sql = { workspace = true }
surrealdb-strand = { workspace = true }
surrealdb-types = { workspace = true }

bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
geo-types = { workspace = true }
phf = { workspace = true, features = ["macros", "unicase"] }
rust_decimal = { workspace = true, features = ["maths", "serde-str"] }
thiserror = { workspace = true }
tracing = { workspace = true }
unicase.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Tests run against the Unicode regex engine whatever the build selects.
surrealdb-types = { workspace = true, features = ["regex-unicode"] }
rstest = { workspace = true }

[lints]
workspace = true
