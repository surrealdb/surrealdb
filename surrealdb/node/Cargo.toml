[package]
name = "surrealdb-node"
# Distributed as the `@surrealdb/node` npm package, not as a crate: the build
# artefact is a NAPI addon (`cdylib`) that is useless to a Cargo consumer.
publish = false
authors.workspace = true
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Embedded SurrealDB engine for Node.js, Bun, and Deno"

[features]
default = ["kv-mem"]
kv-mem = ["surrealdb-core/kv-mem"]
kv-rocksdb = ["surrealdb-core/kv-rocksdb"]
kv-surrealkv = ["surrealdb-core/kv-surrealkv"]

[lib]
path = "src-rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
surrealdb-core = { workspace = true, features = ["http"] }
surrealdb-types = { workspace = true }
async-channel = { workspace = true }
dashmap = { workspace = true }
napi = { workspace = true, features = ["async", "serde-json"] }
napi-derive = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
