[workspace]
members = ["./"]

[package]
name = "surreal-pgsql-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.surrealdb-pgsql]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "fuzz_pgsql"
path = "fuzz_targets/fuzz_pgsql.rs"
test = false
doc = false
bench = false
