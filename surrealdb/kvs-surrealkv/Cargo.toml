[package]
name = "surrealdb-kvs-surrealkv"
publish = true
readme = "README.md"
documentation = "https://docs.rs/surrealdb-kvs-surrealkv/"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
affinitypool = { workspace = true }
chrono = { workspace = true }
common = { workspace = true, features = ["sys"] }
surrealdb-cnf = { workspace = true }
parking_lot = { workspace = true }
surrealdb-kvs = { workspace = true }
surrealkv = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

# The runtime that SurrealKV's background tasks run on, off the runtime that serves queries.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
surrealdb-kvs-test = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
