[package]
name = "surrealdb-web-tests"
publish = false
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

# Browser-only tests, run in headless Chrome by `cargo make ci-web-test`.
[target.'cfg(all(target_family = "wasm", target_vendor = "unknown", target_os = "unknown"))'.dependencies]
surrealdb-core = { workspace = true, features = ["kv-mem"] }
surrealdb-types.workspace = true

[target.'cfg(all(target_family = "wasm", target_vendor = "unknown", target_os = "unknown"))'.dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true
web-sys = { version = "0.3", features = [
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetDirectoryOptions",
	"FileSystemSyncAccessHandle",
	"StorageManager",
	"WorkerGlobalScope",
	"WorkerNavigator",
] }

[lints]
workspace = true
