# --------------------------------------------------
# Language upgrade tests
# --------------------------------------------------
#
# These tasks drive the language-tests `upgrade` subcommand through the
# adjacent-pair chain defined in LANG_UPGRADE_VERSIONS. The runner spawns
# the from-version surreal binary, replays each test's imports, stops it,
# spawns the to-version binary against the same data directory, and runs
# the test query — catching any regression in how on-disk state is read.
#
# Binaries for tagged versions are downloaded from download.surrealdb.com
# into language-tests/.binary_cache/ (cached across CI runs). The trailing
# `..` token in the version list cargo-builds the current checkout.

[tasks.test-lang-upgrade]
private = true
category = "CI - LANGUAGE TESTS"
description = "Run SurrealQL language upgrade tests, hopping through adjacent version pairs"
script = """
#!/bin/bash -ex
# Override _TEST_LANG_UPGRADE_JOBS to tune per-runner concurrency (default 12).
cd language-tests
cargo build --features "${_TEST_LANG_FEATURES}"
# `;` separates independent chains, `,` separates versions within one. Adjacent
# pairs are hopped within a chain; no hop is made across a chain boundary.
IFS=';' read -ra CHAINS <<< "${LANG_UPGRADE_VERSIONS}"
for chain in "${CHAINS[@]}"; do
    IFS=',' read -ra V <<< "${chain}"
    for ((i=0; i<${#V[@]}-1; i++)); do
        echo "=== Upgrade hop: ${V[$i]} -> ${V[$((i+1))]} (backend=${_TEST_API_ENGINE}) ==="
        ./target/debug/surrealql-test --color always upgrade \\
            --from "${V[$i]}" --to "${V[$((i+1))]}" \\
            --backend "${_TEST_API_ENGINE}" \\
            --allow-download --no-wip \\
            --jobs "${_TEST_LANG_UPGRADE_JOBS:-12}"
    done
done
"""

[tasks.ci-lang-upgrade-test-surrealkv]
category = "CI - LANGUAGE TESTS"
description = "Run language upgrade tests with the SurrealKV backend"
env = { _TEST_API_ENGINE = "surrealkv", _TEST_LANG_FEATURES = "upgrade" }
run_task = "test-lang-upgrade"

