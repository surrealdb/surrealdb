[tasks.ci-check-imports]
category = "CI - CHECK"
description = "Check for disallowed std::time imports (use web_time instead)"
script = '''
    #!/bin/bash
    set -euo pipefail

    # Each scan below records its own verdict and the script exits once at the
    # end, so one scan's findings never hide the other's.
    FAILED=0

    # Scan for direct use of std::time::Instant or std::time::SystemTime in Rust source files.
    # These should be imported from web_time instead for WASM compatibility.
    # std::time::Duration is fine and not flagged.
    # language-tests/ and fuzz/ are excluded (separate workspaces).
    #
    # Note: this does not match the brace form (`std::time::{Duration, Instant}`),
    # which reaches the same clock. Widening it surfaces hits in crates that never
    # build for wasm, so making it accurate means scoping it the way the
    # tokio::time scan below is scoped.

    MATCHES=$(grep -rn --include='*.rs' \
        -E 'std::time::(Instant|SystemTime)' \
        --exclude-dir=target \
        --exclude-dir=language-tests \
        --exclude-dir=fuzz \
        . || true)

    if [ -n "$MATCHES" ]; then
        echo "$MATCHES" | while IFS= read -r match; do
            echo "error: $match"
            echo "  --> Use web_time::{Instant,SystemTime} instead of std::time for WASM compatibility."
            echo ""
        done
        COUNT=$(echo "$MATCHES" | wc -l | tr -d ' ')
        echo "Found $COUNT disallowed std::time import(s). Use web_time instead."
        FAILED=1
    else
        echo "No disallowed std::time imports found."
    fi

    # The crates below all compile for wasm32-unknown-unknown, where tokio's
    # timers compile but trap: they read the clock through std::time, and while
    # nothing requests tokio's `time` feature for wasm, feature unification
    # supplies it anyway. `common::time` is the same API over the right clock
    # for each target, so any `tokio::time` here is a latent wasm panic.
    #
    # Tests are exempt — they only ever run natively.
    #
    # `tokio::spawn` has the same shape of problem (no runtime on wasm) but is
    # not checked here: a `#[cfg(not(target_family = "wasm"))]` block around it
    # is perfectly correct, and grep cannot see cfg, so every hit would be a
    # false positive.

    TIMERS=$(grep -rn --include='*.rs' \
        -E 'tokio::time::(Instant|Interval|MissedTickBehavior|interval|sleep|timeout|timeout_at)\b' \
        --exclude-dir=target \
        --exclude-dir=tests \
        --exclude='*test*.rs' \
        surrealdb/core/src surrealdb/common/src surrealdb/datastore/src surrealdb/kvs/src \
        surrealdb/expr/src surrealdb/idx/src surrealdb/embedded/src \
        | grep -v '^surrealdb/common/src/time.rs:' || true)

    # Everything that survives the path filters still has to clear the
    # per-file test module, which no path convention marks.
    TIMERS=$(echo "$TIMERS" | while IFS= read -r match; do
        [ -z "$match" ] && continue
        file=${match%%:*}
        rest=${match#*:}
        line=${rest%%:*}
        # The nearest preceding `mod test`/`mod tests` opener, if any.
        start=$(grep -n -E '^(\t| )*mod tests?( |\{)' "$file" | cut -d: -f1 | awk -v L="$line" '$1 < L' | tail -1)
        [ -n "$start" ] || echo "$match"
    done)

    if [ -n "$TIMERS" ]; then
        echo "$TIMERS" | while IFS= read -r match; do
            echo "error: $match"
            echo "  --> Use common::time instead of tokio::time so the timer works on WASM."
            echo ""
        done
        COUNT=$(echo "$TIMERS" | wc -l | tr -d ' ')
        echo "Found $COUNT disallowed tokio::time use(s). Use common::time instead."
        FAILED=1
    else
        echo "No disallowed tokio::time uses found."
    fi

    exit $FAILED
'''

[tasks.ci-check-wasm]
# Note: On Mac, Apple ships its own version of LLVM which does not cross-compile to WASM.
# To build this on a Mac, you need to install the upstream LLVM Clang.
# Steps:
# 1. Install LLVM from Homebrew: `brew install llvm`
# 2. Add the LLVM bin directory to your PATH: `echo 'export PATH="/opt/homebrew/opt/llvm/bin:$PATH"' >> ~/.zshrc`
category = "CI - CHECK"
description = "Run clippy linting (WASM)"
# `RUSTFLAGS` replaces `.cargo/config.toml`'s target rustflags, so the
# getrandom backend and the 4 MiB stack set there are repeated here.
env = { RUSTFLAGS = '--cfg getrandom_backend="wasm_js" -C link-arg=-zstack-size=4194304 ${SURREAL_NIGHTLY_RUSTFLAGS}' }
script = '''
    #!/bin/bash
    set -euo pipefail

    # Clippy rather than `cargo check`: the host-target `ci-clippy` never
    # compiles `cfg(target_family = "wasm")` items, so this is the only pass
    # that lints them.
    #
    # All browser-targeted crates (`surrealdb`, `surrealdb-core`,
    # `surrealdb-embedded`, `surrealdb-wasm`, and `surrealism-verify`) are
    # linted in a unified feature graph with `--no-default-features` and
    # `surrealdb/default` explicitly enabled so `surrealdb-core`'s default
    # features (`shaped`, `graphql`, `gql`) remain disabled, matching the
    # embedded browser engine's feature set while compiling `surrealdb-core`
    # and its dependency tree once.
    wasm_features="surrealdb/default,surrealdb/protocol-ws,surrealdb/protocol-http,surrealdb/kv-mem,surrealdb/kv-surrealkv,surrealdb/http,surrealdb/jwks,surrealdb-wasm/kv-mem,surrealdb-wasm/kv-surrealkv"

    cargo clippy --locked \
        --package surrealdb \
        --package surrealdb-core \
        --package surrealdb-embedded \
        --package surrealdb-wasm \
        --package surrealism-verify \
        --no-default-features \
        --features "$wasm_features" \
        --target wasm32-unknown-unknown \
        -- -D warnings

    # Re-lint `surrealdb-wasm` with the `debug` console panic hook enabled.
    # Retaining the same selected package set keeps Cargo's resolved feature
    # graph identical across shared dependencies so all other workspace crates
    # remain fresh and only `surrealdb-wasm` is re-checked.
    cargo clippy --locked \
        --package surrealdb \
        --package surrealdb-core \
        --package surrealdb-embedded \
        --package surrealdb-wasm \
        --package surrealism-verify \
        --no-default-features \
        --features "$wasm_features,surrealdb-wasm/debug" \
        --target wasm32-unknown-unknown \
        -- -D warnings

    # The core engine on its own, as a downstream edge wasm build takes it: no
    # default features and none of the SDK or embedded engine feature sets.
    cargo clippy --locked --package surrealdb-core \
        --no-default-features --features gql,http \
        --target wasm32-unknown-unknown \
        -- -D warnings

    # The SDK for a WASI host, as a client: the WebSocket engine and TLS, without
    # the SurrealQL parser (its JWT dependency brings in `js-sys` on every wasm
    # target). The SDK's remote engines are the browser's, which import
    # JavaScript a WASI runtime does not provide, so a WASI build must not
    # depend on `wasm-bindgen` through the SDK: a module that does links and
    # then fails to instantiate. The tree is captured before it is searched, so
    # a failing `cargo tree` stops the task and `grep -q` closing the pipe early
    # cannot mask a match.
    wasi_tree=$(cargo tree --locked --package surrealdb \
        --no-default-features --features protocol-ws,rustls \
        --target wasm32-wasip2 --edges normal --prefix none)
    if grep -q '^wasm-bindgen ' <<<"$wasi_tree"; then
        echo "error: the SDK pulls wasm-bindgen into a wasm32-wasip2 build"
        exit 1
    fi
'''

[tasks.ci-wasm-size-budget]
# Builds the edge worker bundles (`surrealdb-edge-size-probe`: lean, full and
# the edge entry) for wasm32 with the `edge` profile, runs `wasm-opt -Oz`, and
# fails when a bundle is over its budget. A bundle whose budget is 0 is
# reported and not checked. Needs binaryen's `wasm-opt` and a clang that
# targets wasm32 (see `ci-check-wasm`). `cargo make ci-wasm-size-budget --
# --toolchain nightly` checks the Cloudflare build with the pinned nightly, and
# `--names` writes each function's size alongside. The budgets and flags are
# documented in the script.
category = "CI - CHECK"
description = "Check the edge wasm bundles against their size budgets"
command = "scripts/wasm-size-budget.sh"
args = ["${@}"]

[tasks.ci-sql-frontend]
private = true
category = "CI - CHECK"
description = "Run comprehensive checks for the SQL front ends named in _SQL_FE"
script = '''
    #!/bin/bash
    set -euo pipefail

    for fe in ${_SQL_FE}; do
        pkg="surrealdb-$fe"
        dir="surrealdb/$fe"
        echo "Running clippy on $pkg..."
        cargo clippy --locked -p "$pkg" --all-features --all-targets -- -D warnings

        echo "Running tests on $pkg..."
        cargo test --locked -p "$pkg" --features fuzzing

        echo "Checking wasm32 compilation for $pkg..."
        cargo check --locked -p "$pkg" --target wasm32-unknown-unknown

        echo "Verifying weight fence and dependency allowlist for $pkg..."
        allowlist="$dir/deps-allowlist.txt"
        actual_deps=$(cargo tree --locked -e normal -p "$pkg" --prefix none --format '{p}' | sed -E 's/ v[0-9].*//' | sort -u)
        while IFS= read -r dep; do
            if [[ -n "$dep" ]] && ! grep -q -F -x "$dep" "$allowlist"; then
                echo "::error::Normal dependency '$dep' is not in $allowlist"
                exit 1
            fi
        done <<< "$actual_deps"

        echo "Checking oracle denylist on all edge kinds for $pkg..."
        all_edges=$(cargo tree --locked -e normal,dev,build -p "$pkg" --prefix none --format '{p}')
        for banned in pg_query prost bindgen clang-sys; do
            if echo "$all_edges" | grep -q "$banned"; then
                echo "::error::Banned dependency '$banned' found in $pkg dependency tree"
                exit 1
            fi
        done

        echo "Checking import fence for common..."
        if [[ -d "$dir/src/common" ]]; then
            if grep -rn "use crate::" "$dir/src/common/" 2>/dev/null | grep -v "use crate::common::"; then
                echo "::error::Common import fence violated: src/common/ must only import from crate::common::"
                exit 1
            fi
        fi

        echo "Running grep bans on $dir/src..."
        if grep -rn -E "\b(tracing|log)::(info|warn|debug|trace|error)\b|\b(info|warn|debug|trace|error)!\(" "$dir/src/" 2>/dev/null; then
            echo "::error::Logging or tracing macros found in $dir/src/"
            exit 1
        fi

        if grep -rn -E "\bassert(!|_eq!|_ne!)\(" "$dir/src/" 2>/dev/null; then
            echo "::error::assert! macros found in non-test src"
            exit 1
        fi

        if [[ -d "$dir/src/print" ]] && grep -rn "format!.*'{.*}'" "$dir/src/print/" 2>/dev/null; then
            echo "::error::Raw '{ interpolation found in print code"
            exit 1
        fi

        if grep -rn -E "(/private/tmp/|/Users/|claude-)" "$dir/src/" "$dir/tests/" 2>/dev/null; then
            echo "::error::Local or session paths found in $dir"
            exit 1
        fi

        if grep -rn -E "::=" "$dir/src/" "$dir/docs/" 2>/dev/null; then
            echo "::error::Prohibited ISO BNF reference found in $dir"
            exit 1
        fi

        if [[ -f "$dir/fuzz/Cargo.toml" ]]; then
            echo "Checking fuzz satellite workspace for $dir..."
            cargo check --locked --manifest-path "$dir/fuzz/Cargo.toml"
        fi
    done

    echo "✅ SQL front-end checks passed successfully!"
'''

