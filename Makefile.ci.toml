# The `lib-*` targets drive the datastore directly and live with the embedded
# engine; the `sdk-*` targets drive the SDK's public API. Each half is a
# separate benchmark binary, so the two dispatch tasks below differ only in the
# package, the bench name, and where the feature set comes from: the engine
# crate takes one storage backend per target, the SDK takes `BENCH_FEATURES`
# because `sdk-ws` needs a protocol feature rather than a backend.
