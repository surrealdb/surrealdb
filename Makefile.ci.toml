[env]
BENCH_WORKER_THREADS = { value = "1", condition = { env_not_set = [
    "BENCH_WORKER_THREADS",
] } }
BENCH_NUM_OPS = { value = "1000", condition = { env_not_set = [
    "BENCH_NUM_OPS",
] } }
BENCH_DURATION = { value = "30", condition = { env_not_set = [
    "BENCH_DURATION",
] } }
BENCH_SAMPLE_SIZE = { value = "10", condition = { env_not_set = [
    "BENCH_SAMPLE_SIZE",
] } }
BENCH_FEATURES = { value = "protocol-ws,kv-mem,kv-rocksdb,kv-surrealkv", condition = { env_not_set = [
    "BENCH_FEATURES",
] } }
# Configure LLVM profiling output to go to target directory instead of repo root
LLVM_PROFILE_FILE = { value = "target/llvm-cov-target/%p-%m.profraw", condition = { env_not_set = [
    "LLVM_PROFILE_FILE",
] } }
# Adjacent-pair upgrade chain for language upgrade tests. Each consecutive
# pair (3.0.0 -> 3.0.1, 3.0.1 -> 3.0.2, ...) is exercised as a separate hop.
# The trailing `..` token resolves to a path-based version, which the runner
# cargo-builds against the current checkout — this is the "main" target.
#
# The chain lists every *stable* release on the 3.x line in order. Betas are
# omitted: once a minor goes stable nobody upgrades from its betas, and a beta
# left in the chain only displaces the stable that shipped after it. A beta
# belongs here only while its minor is unreleased. Each new release must be
# appended before `..`, or the last hop silently widens into a multi-release
# jump and the versions users actually upgrade from stop being covered.
#
# `;` separates independent chains; hops are only made within a chain. The break
# between 3.2.0 and 3.2.1 is deliberate. `REBUILD INDEX` on an HNSW, FULLTEXT or
# DISKANN index never returns when the index was written before 3.2.1 and is read
# by 3.2.1 or later — verified for sources 3.1.5 and 3.2.0 against targets 3.2.1,
# 3.2.2 and 3.2.4. The store is otherwise sound: it opens, queries and reports
# INFO normally, and only the rebuild wedges. Rebuilding is the documented upgrade
# step for those index types, so the three tests covering them cannot cross that
# boundary. Splitting the chain keeps every other pair covered, including 3.2.0 as
# a target; `importing-version` cannot express "every version except this one".
#
# Every numeric entry must have a published binary at
#   https://download.surrealdb.com/v{ver}/surreal-v{ver}.{platform}.{tgz|exe}
# Override `LANG_UPGRADE_VERSIONS` to test alternative chains locally.
LANG_UPGRADE_VERSIONS = { value = "3.0.0,3.0.1,3.0.2,3.0.3,3.0.4,3.0.5,3.1.0,3.1.1,3.1.2,3.1.3,3.1.4,3.1.5,3.2.0;3.2.1,3.2.2,3.2.3,3.2.4,..", condition = { env_not_set = [
    "LANG_UPGRADE_VERSIONS",
] } }

