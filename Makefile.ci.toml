[env]
BENCH_WORKER_THREADS = { value = "1", condition = { env_not_set = [
    "BENCH_WORKER_THREADS",
] } }
BENCH_NUM_OPS = { value = "1000", condition = { env_not_set = [
    "BENCH_NUM_OPS",
] } }
BENCH_DURATION = { value = "30", condition = { env_not_set = [
    "BENCH_DURATION",
] } }
BENCH_SAMPLE_SIZE = { value = "10", condition = { env_not_set = [
    "BENCH_SAMPLE_SIZE",
] } }
BENCH_FEATURES = { value = "allocator,protocol-ws,kv-mem,kv-surrealkv", condition = { env_not_set = [
    "BENCH_FEATURES",
] } }
# Configure LLVM profiling output to go to target directory instead of repo root
LLVM_PROFILE_FILE = { value = "target/llvm-cov-target/%p-%m.profraw", condition = { env_not_set = [
    "LLVM_PROFILE_FILE",
] } }
# Versions the language upgrade tests hop through.
#
# Three axes run over the same test tree, each proving something the others
# cannot:
#
#   LANG_UPGRADE_VERSIONS  adjacent pairs (3.0.0 -> 3.0.1, 3.0.1 -> 3.0.2, ...).
#                          Proves each release can read the one before it. Also
#                          the version list the cumulative walk uses.
#   LANG_UPGRADE_SEEDS     every seed straight to the current checkout. Proves
#                          today's build reads bytes an *old* release wrote,
#                          with no intermediate binary in between to migrate or
#                          rebuild them. Adjacent pairs cannot show this: the
#                          oldest writer HEAD ever sees is the release directly
#                          before it.
#   LANG_UPGRADE_CHAIN     one datastore carried through every listed version in
#                          order, for the tests that declare `[test.chain]`.
#                          Proves a structure created once stays correct while
#                          every release in turn maintains it.
#
# The trailing `..` token resolves to a path-based version, which the runner
# cargo-builds against the current checkout — this is the "main" target.
#
# The chain lists every *stable* release on the 3.x line in order. Betas are
# omitted: once a minor goes stable nobody upgrades from its betas, and a beta
# left in the chain only displaces the stable that shipped after it. A beta
# belongs here only while its minor is unreleased. Each new release must be
# appended before `..`, or the last hop silently widens into a multi-release
# jump and the versions users actually upgrade from stop being covered.
#
# `;` separates independent chains; hops are only made within a chain. A hop that
# cannot work — one spanning a defect in a released binary that no
# `version`/`importing-version` gate can express — is excluded by breaking the
# chain there, leaving every other pair covered.
#
# Release order is not version order: a patch on an older line can ship after a
# newer line and carry a catalog revision the newer line's early releases
# predate. 3.1.6 is such a release. It writes `TableDefinition` at revision 3,
# which 3.2.0 and 3.2.1 cannot decode, so upgrading onto either fails outright;
# its first valid target is 3.2.2. It therefore forms its own chain rather than
# sitting between 3.1.5 and 3.2.0, where it would both break the 3.1.5 -> 3.2.0
# hop and assert an upgrade path that does not exist. That chain starts at 3.1.5
# so the in-line patch upgrade onto it stays covered as well.
#
# 3.2.5 and 3.2.6 also shipped after the 3.3 line began, 3.2.6 after 3.3.4, but
# every 3.3 release reads what they write, so they keep their version-order
# place before 3.3.0.
#
# Every numeric entry must have a published binary at
#   https://download.surrealdb.com/v{ver}/surreal-v{ver}.{platform}.{tgz|exe}
# Override `LANG_UPGRADE_VERSIONS` to test alternative chains locally.
LANG_UPGRADE_VERSIONS = { value = "3.0.0,3.0.1,3.0.2,3.0.3,3.0.4,3.0.5,3.1.0,3.1.1,3.1.2,3.1.3,3.1.4,3.1.5,3.2.0,3.2.1,3.2.2,3.2.3,3.2.4,3.2.5,3.2.6,3.3.0,3.3.1,3.3.2,3.3.3,3.3.4,..;3.1.5,3.1.6,3.2.2", condition = { env_not_set = [
    "LANG_UPGRADE_VERSIONS",
] } }

# Versions the cumulative walk carries one datastore through.
#
# Deliberately not the same list as the adjacent-pair chain. A walk must not pass
# through a release that demands a manual repair. The property the walk measures
# is that a structure created once survives being maintained by every release in
# turn; a release that forces a `REBUILD INDEX` replaces that structure, so
# everything after it reads what the rebuild wrote rather than what the original
# writer left.
#
# Repairs are a pairwise concern, and the pairwise axis covers them properly; the
# chain runner refuses to schedule a test whose repair would fire mid-walk.
#
# This is one ordered list, not several: the runner flattens `;` to `,` because a
# walk cannot skip a version. A release that can only be upgraded onto a target
# further down the list therefore cannot take part at all — 3.1.6 is omitted for
# that reason, and the pair and seed axes carry it instead.
LANG_UPGRADE_CHAIN = { value = "3.0.0,3.0.1,3.0.2,3.0.3,3.0.4,3.0.5,3.1.0,3.1.1,3.1.2,3.1.3,3.1.4,3.1.5,3.2.0,3.2.1,3.2.2,3.2.3,3.2.4,3.2.5,3.2.6,3.3.0,3.3.1,3.3.2,3.3.3,3.3.4,..", condition = { env_not_set = [
    "LANG_UPGRADE_CHAIN",
] } }

# Seeds for the every-release-to-HEAD axis. One release per minor plus the ends
# of each line: enough to cover every stored format the 3.x series produced
# without paying for all twenty-five. Add the newest release here as well as to
# the chain above. 3.1.6 rather than 3.1.5 stands for the end of the 3.1 line, and
# this axis is the only one that carries it all the way to HEAD. 3.2.4 stays
# beside 3.2.6, the end of the 3.2 line: it is the last 3.2 release to write the
# first revision of the ANN pending entries and the reclaim state, which 3.2.5
# moved to their second.
#
# 3.3.0-beta.3 earns its place on a different ground from the rest. The 3.3
# pre-releases are the only published binaries with a table-level shared doc-ID
# space but no injective forward mapping (`!dj`): every stable release to 3.2.4
# is per-index, and 3.3.0 writes `!dj` alongside `!di`. So it is the only seed
# that gives migration 3 (the injective forward doc-ID rebuild) a mapping to
# rebuild, and dropping it would leave that rebuild with no released source at
# all. Its presence is a statement about the code paths this axis reaches, not
# about which releases are supported upgrade sources — `doc/UPGRADING.md`
# answers that, and answers it with stable releases only.
LANG_UPGRADE_SEEDS = { value = "3.0.0,3.0.5,3.1.0,3.1.6,3.2.0,3.2.4,3.2.6,3.3.0-beta.3,3.3.0,3.3.4", condition = { env_not_set = [
    "LANG_UPGRADE_SEEDS",
] } }

# Releases whose RocksDB store the current checkout must open as SurrealKV: the
# latest stable release of each line that still ships `rocksdb://`. Each must
# also be listed in LANG_UPGRADE_SEEDS, so the binaries are already cached.
LANG_UPGRADE_MIGRATION_SOURCES = { value = "3.2.4,3.3.0", condition = { env_not_set = [
    "LANG_UPGRADE_MIGRATION_SOURCES",
] } }

# --------------------------------------------------
# Quality checks
# --------------------------------------------------

[tasks.ci-docs]
category = "CI - CHECK"
description = "Check documentation generation"
command = "cargo"
args = [
    "doc",
    "--locked",
    "--no-deps",
    "--package",
    "surrealdb",
    "--features",
    "rustls,native-tls,protocol-ws,protocol-http,kv-mem,kv-surrealkv,http,scripting,jwks",
]

# Doctests need their own task: every other test task here runs under
# `cargo nextest`, which does not execute doctests at all.
#
# The feature list is `ci-docs` plus `kv-surrealkv`. A doc example behind a
# `#[cfg(feature = ...)]` item is invisible to rustdoc unless that feature is
# on, so every engine carrying examples has to be enabled here or its examples
# go unchecked.
[tasks.ci-doctests]
category = "CI - CHECK"
description = "Compile and run the SDK's documentation examples"
command = "cargo"
args = [
    "test",
    "--locked",
    "--package",
    "surrealdb",
    "--doc",
    "--features",
    "rustls,native-tls,protocol-ws,protocol-http,kv-mem,kv-surrealkv,http,scripting,jwks",
]

[tasks.ci-fmt]
category = "CI - CHECK"
description = "Run code formatting checks"
toolchain = "${SURREAL_NIGHTLY_RUST_TOOLCHAIN}"
command = "cargo"
args = [
    "fmt",
    "--all",
    "--check",
]

[tasks.ci-check]
category = "CI - CHECK"
description = "Run code quality checks"
command = "cargo"
args = [
    "check",
    "--locked",
    "--workspace",
    "--all-targets",
    "--features",
    "${ALL_FEATURES}",
    "${@}",
]

[tasks.ci-check-release]
category = "CI - CHECK"
description = "Run code quality checks (release)"
command = "cargo"
args = [
    "check",
    "--profile",
    "clippy-release",
    "--locked",
    "--workspace",
    "--all-targets",
    "--features",
    "${ALL_FEATURES}",
]

[tasks.ci-clippy]
category = "CI - CHECK"
description = "Run clippy linting"
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--workspace",
    "--all-targets",
    "--features",
    "${ALL_FEATURES}",
    "--tests",
    "--benches",
    "--bins",
    "--",
    "-D",
    "warnings",
]

# `ci-clippy` lints with `${ALL_FEATURES}`, which enables `surrealism`. Every
# `cfg(not(feature = "surrealism"))` item is therefore compiled out and never
# linted by it. This task lints those items by checking the library targets
# (`--lib`) of `surrealdb-core` and `surrealdb-expr` with default features off.
#
# `--no-default-features` is required, not merely dropping `surrealism` from the
# feature list: `surrealdb-server`'s default set includes `surrealism`, and the
# root package's default is `surrealdb-server/default`, so defaults would pull it
# back in. Clippy only lints the packages named with `--package`, and
# `--no-default-features` only applies to the selected root packages, so both
# `surrealdb-core` and `surrealdb-expr` are listed explicitly.
[tasks.ci-clippy-no-surrealism]
category = "CI - CHECK"
description = "Run clippy linting with surrealism disabled"
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--package",
    "surrealdb-core",
    "--package",
    "surrealdb-expr",
    "--no-default-features",
    "--features",
    "surrealdb-core/kv-mem",
    "--lib",
    "--",
    "-D",
    "warnings",
]

[tasks.ci-clippy-fix]
category = "CI - CHECK"
description = "Fix clippy lint issues"
command = "cargo"
args = [
    "clippy",
    "--workspace",
    "--all-targets",
    "--features",
    "${ALL_FEATURES}",
    "--tests",
    "--benches",
    "--bins",
    "--fix",
    "--allow-dirty",
]

[tasks.ci-clippy-release]
category = "CI - CHECK"
description = "Run code quality linting (release)"
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--workspace",
    "--all-targets",
    "--profile",
    "clippy-release",
    "--features",
    "${ALL_FEATURES}",
    "--tests",
    "--benches",
    "--bins",
    "--",
    "-D",
    "warnings",
]

