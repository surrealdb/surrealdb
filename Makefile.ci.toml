# --------------------------------------------------
# Coverage checks
# --------------------------------------------------

[tasks.ci-workspace-coverage]
category = "CI - WORKSPACE TESTS"
description = "Run full workspace tests with code coverage"
command = "cargo"
env = { LLVM_PROFILE_FILE = "target/llvm-cov-target/%p-%m.profraw" }
args = [
    "llvm-cov",
    "nextest",
    "--lcov",
    "--output-path",
    "lcov.info",
    "--locked",
    "--no-default-features",
    # Mirror the `ci-integration-all` feature set so the integration suites
    # (cli/http/ws/graphql/gql/pg) run under coverage, plus the coverage-only
    # allocator features. `cli` is required for the `sql` subcommand, and
    # `postgres` for the `pg_integration` suite, which is compiled away without
    # it.
    "--features",
    "allocator,allocation-tracking,storage-mem,storage-surrealkv,scripting,http,jwks,cli,graphql,gql,postgres",
    "--workspace",
    # Exclude surrealism packages due to wasmtime complexity and stdin loops
    "--exclude", "surrealism-runtime",
    "--exclude", "surrealism",
    "--exclude", "surrealism-macros",
    "--exclude", "surrealism-types",
    "--exclude", "demo",
]

[tasks.ci-workspace-coverage-with-server]
env = { _START_SURREALDB_PATH = "memory" }
category = "CI - WORKSPACE TESTS"
description = "Run full workspace tests with code coverage, and a local SurrealDB server"
run_task = { name = [
    "start-surrealdb",
    "ci-workspace-coverage",
    "stop-surrealdb",
], fork = true }

[tasks.ci-lang-test-coverage]
category = "CI - COVERAGE"
description = "Run language tests with code coverage for core crates"
script = """
    #!/bin/bash -ex
    cd language-tests

    # Set up LLVM coverage instrumentation environment
    eval "$(cargo llvm-cov show-env --export-prefix)"

    # `language-tests` declares its own workspace, so every crate under test is
    # an out-of-workspace path dependency and cargo-llvm-cov instruments none
    # of them by default. Only the crates named here are compiled with
    # `-C instrument-coverage`, and a crate left out is absent from the report
    # entirely rather than showing up as uncovered — so this list is what
    # defines the measured surface, and a crate added to the harness's
    # dependency graph must be added here too.
    #
    # These are every first-party library crate the harness pulls in. The
    # first-party proc-macro crates (surrealdb-keyspace-macro,
    # surrealdb-stored-derive, surrealdb-types-derive) are deliberately
    # absent: they execute while the compiler runs, so instrumenting them
    # measures the build, not the tests.
    COVERAGE_PACKAGES="surrealdb-catalog surrealdb-cnf surrealdb-collections \
        surrealdb-common surrealdb-core surrealdb-datastore surrealdb-expr \
        surrealdb-gql surrealdb-iam surrealdb-idx surrealdb-kvs \
        surrealdb-kvs-any surrealdb-kvs-mem surrealdb-observe \
        surrealdb-parse-common surrealdb-rpc surrealdb-runtime \
        surrealdb-strand surrealdb-parser-next surrealdb-types"
    export __CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES="surrealql_test,surrealql_test_tests,$(echo $COVERAGE_PACKAGES | tr ' -' ',_')"

    # Clean previous coverage artifacts
    cargo llvm-cov clean --workspace
    # `clean --workspace` evicts only this workspace's own artifacts. The crates
    # under test sit outside it, and the variable above is not part of cargo's
    # fingerprint, so their existing artifacts would otherwise be reused as-is
    # and the instrumentation request silently ignored. `cargo clean` rejects a
    # package that is not in the graph, so a crate dropped from the workspace
    # fails here rather than lingering in the list.
    cargo clean --locked $(for p in $COVERAGE_PACKAGES; do echo -p $p; done)

    # Build language-tests with instrumentation
    cargo build --locked

    # Run the language tests (this exercises surrealdb-core)
    ./target/debug/surrealql-test --color always run --no-wip --jobs 3 --backend memory

    # Generate coverage report, excluding the harness code
    cargo llvm-cov report \
        --lcov \
        --output-path ../language-tests-lcov.info \
        --ignore-filename-regex 'language-tests/src/'

    # An instrumentation gap produces a well-formed but empty lcov file, which
    # the upload accepts without complaint. Assert that the crates under test
    # reached the report so the failure surfaces here instead of as a coverage
    # figure that quietly measures nothing. The parser is checked alongside the
    # two largest crates because it sits outside the pair the report is most
    # often read for, so it also catches the crate list narrowing back to those
    # two.
    for coverage_anchor in core/src/exec expr/src parser-next/src; do
        if ! grep -q "surrealdb/$coverage_anchor" ../language-tests-lcov.info; then
            echo "ERROR: no coverage recorded for surrealdb/$coverage_anchor; the crates under test were not instrumented" >&2
            exit 1
        fi
    done
"""

# --------------------------------------------------
# Services
# --------------------------------------------------

# The server the remote-engine tests (`ci-api-integration-{http,ws,any}`) and
# `ci-workspace-*-with-server` run against. By default it is built from this
# checkout and listens on 127.0.0.1:8000. Three variables point the tests at
# any other `surreal`, such as a released binary or a docker image, without
# building one:
#
# - `SURREAL_BIN`: a `surreal` binary to start instead of `target/debug/surreal`.
# - `SURREAL_DOCKER_IMAGE`: an image to run instead, e.g.
#   `surrealdb/surrealdb:v3.0.0`. Takes precedence over `SURREAL_BIN`.
# - `SURREAL_TEST_ADDRESS`: the `host:port` the server listens on and the tests
#   connect to (default `127.0.0.1:8000`).
#
# For example:
#   SURREAL_DOCKER_IMAGE=surrealdb/surrealdb:latest SURREAL_TEST_ADDRESS=127.0.0.1:18000 \
#     cargo make ci-api-integration-ws
[tasks.build-surrealdb]
category = "CI - BUILD"
private = true
# `_PREBUILT_SURREAL` set means `target/debug/surreal` was supplied by the
# caller; `SURREAL_BIN` or `SURREAL_DOCKER_IMAGE` set means no server is built.
condition = { env_not_set = ["_PREBUILT_SURREAL", "SURREAL_BIN", "SURREAL_DOCKER_IMAGE"] }
command = "cargo"
args = [
    "build",
    "--locked",
    "--no-default-features",
    "--features",
    "storage-mem",
]

[tasks.start-surrealdb]
category = "CI - SERVICES"
description = "Start a local SurrealDB server"
dependencies = ["build-surrealdb"]
script = """
    #!/bin/bash -ex

    addr="${SURREAL_TEST_ADDRESS:-127.0.0.1:8000}"
    name="surreal-test-${_TEST_API_ENGINE}"
    rm -f /tmp/${name}.pid /tmp/${name}.container

    if [[ -n "${SURREAL_DOCKER_IMAGE:-}" ]]; then
        # A local binary inherits the root credentials (`SURREAL_USER`,
        # `SURREAL_PASS`) from the environment; a container has to be handed them.
        docker run --detach --rm --name "$name" --publish "${addr}:8000" \
            --env SURREAL_USER --env SURREAL_PASS --env SURREAL_LOG "$SURREAL_DOCKER_IMAGE" \
            start ${_START_SURREALDB_PATH} --allow-all --deny-guests --bind 0.0.0.0:8000 \
            > /tmp/${name}.container
    else
        "${SURREAL_BIN:-target/debug/surreal}" start ${_START_SURREALDB_PATH} --allow-all --deny-guests \
            --bind "$addr" &>/tmp/surrealdb-${_TEST_API_ENGINE}.log &
        echo $! > /tmp/${name}.pid
    fi

    set +e
    echo "Waiting for surreal to be ready on ${addr}..."
    for _ in $(seq 1 30); do
        curl --silent --fail "http://${addr}/health" >/dev/null && echo "Ready!" && exit 0
        sleep 1
    done

    echo "ERROR: Surreal is unhealthy!"
    exit 1
"""

[tasks.stop-surrealdb]
category = "CI - SERVICES"
description = "Stop the local SurrealDB server"
script = """
    #!/bin/bash -ex
    name="surreal-test-${_TEST_API_ENGINE}"
    if [[ -f /tmp/${name}.container ]]; then
        docker stop "$(cat /tmp/${name}.container)" || true
    else
        kill $(cat /tmp/${name}.pid) || true
        sleep 5
        kill -9 $(cat /tmp/${name}.pid) || true
    fi
"""

# --------------------------------------------------
# Benchmarks
# --------------------------------------------------

[tasks.ci-bench]
category = "CI - BENCHMARK"
description = "Run SurrealDB benchmarks"
command = "cargo"
args = [
    "bench",
    "--locked",
    "--quiet",
    "--package",
    "surrealdb",
    "--no-default-features",
    "--features",
    "kv-mem,scripting,http,jwks",
    "${@}",
]

# The `lib-*` targets drive the datastore directly and live with the embedded
# engine; the `sdk-*` targets drive the SDK's public API. Each half is a
# separate benchmark binary, so the two dispatch tasks below differ only in the
# package, the bench name, and where the feature set comes from: the engine
# crate takes one storage backend per target, the SDK takes `BENCH_FEATURES`
# because `sdk-ws` needs a protocol feature rather than a backend.
[tasks.bench-lib-target]
private = true
category = "CI - BENCHMARK"
command = "cargo"
args = [
    "bench",
    "--locked",
    "--package",
    "surrealdb-engine-local",
    "--bench",
    "datastore",
    "--no-default-features",
    "--features",
    "${BENCH_LIB_FEATURES}",
    "${@}",
]

[tasks.bench-sdk-target]
private = true
category = "CI - BENCHMARK"
command = "cargo"
args = [
    "bench",
    "--locked",
    "--package",
    "surrealdb",
    "--bench",
    "sdb",
    "--no-default-features",
    "--features",
    "${BENCH_FEATURES}",
    "${@}",
]

[tasks.bench-lib-mem]
category = "CI - BENCHMARK"
description = "Run library benchmarks with the in-memory engine"
env = { BENCH_DATASTORE_TARGET = "lib-mem", BENCH_LIB_FEATURES = "allocator,kv-mem" }
run_task = { name = ["bench-lib-target"] }

[tasks.bench-lib-surrealkv]
category = "CI - BENCHMARK"
description = "Run library benchmarks with the SurrealKV engine"
env = { BENCH_DATASTORE_TARGET = "lib-surrealkv", BENCH_LIB_FEATURES = "allocator,kv-surrealkv" }
run_task = { name = ["bench-lib-target"] }

[tasks.bench-sdk-mem]
category = "CI - BENCHMARK"
description = "Run SDK benchmarks with the in-memory engine"
env = { BENCH_DATASTORE_TARGET = "sdk-mem" }
run_task = { name = ["bench-sdk-target"] }

[tasks.bench-sdk-surrealkv]
category = "CI - BENCHMARK"
description = "Run SDK benchmarks with the SurrealKV engine"
env = { BENCH_DATASTORE_TARGET = "sdk-surrealkv" }
run_task = { name = ["bench-sdk-target"] }

[tasks.bench-sdk-ws]
category = "CI - BENCHMARK"
description = "Run SDK benchmarks with the WebSocket engine"
env = { BENCH_DATASTORE_TARGET = "sdk-ws" }
run_task = { name = ["bench-sdk-target"] }

# --------------------------------------------------
# Run all required checks for PR merge
# --------------------------------------------------

[tasks.ci-sdk-build]
category = "CI - INTEGRATION TESTS"
description = "Build SDK test projects"
script = """
    #!/bin/bash -e
    echo "Building SDK local tests..."
    cd tests/sdk/local
    cargo build --locked

    echo "Building SDK remote tests..."
    cd ../remote
    cargo build --locked
"""

[tasks.ci-all-required]
category = "CI - ALL REQUIRED CHECKS"
description = "Run almost all required CI checks that must pass for PR merge"
dependencies = [
    # Code quality checks
    "ci-fmt",
    "ci-clippy",
    "ci-check",
    "ci-check-wasm",
    "ci-check-imports",
    "ci-catalog-schema",
    "ci-feature-check",
    "ci-unused-deps",
    "ci-docs",
    "ci-doctests",
    # Workspace tests
    "ci-workspace-test",
    "ci-compile-timers-test",
    # Integration tests
    "ci-cli-integration",
    "ci-http-integration",
    "ci-ws-integration",
    # KVS tests
    "ci-kvs-mem",
    "ci-kvs-surrealkv",
    # SDK build tests
    "ci-sdk-build",
    # SDK tests
    "ci-api-integration-mem",
    "ci-api-integration-surrealkv",
    "ci-api-integration-http",
    "ci-api-integration-ws",
    "ci-api-integration-any",
    # Language tests
    "ci-lang-test-mem",
    "ci-lang-test-surrealkv",
]
