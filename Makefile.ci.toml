[tasks.test-lang-decline-report]
private = true
category = "CI - LANGUAGE TESTS"
description = "Report the statements the engine declines to run, without failing on their count"
script = """
    #!/bin/bash -ex
    cd language-tests
    if [ "${_TEST_LANG_FEATURES}" != "" ]; then
        cargo build --locked --features ${_TEST_LANG_FEATURES}
    else
        cargo build --locked
    fi
    log="target/declines-${_TEST_API_ENGINE}.log"
    set +e
    ./target/debug/surrealql-test --color never run --jobs 12 --backend ${_TEST_API_ENGINE} \
        --report-declines "target/declines-${_TEST_API_ENGINE}.jsonl" 2>&1 | tee "$log"
    set -e
    grep -q '^declines: [0-9]' "$log"
"""

