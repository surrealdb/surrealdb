# --------------------------------------------------
# Language tests over a remote --endpoint
# --------------------------------------------------
#
# These exercise the test harness's `remote` path: instead of an embedded
# in-process datastore, the suite runs against a *running* `surreal` server over
# the API (ws://), so the network + serialization path and the remote executor
# are covered in CI. The server is started to match the embedded harness's
# datastore exactly (see language-tests/README.md) — otherwise scripting / file
# functions / OpenGQL / TEMPFILES / `INFO FOR ROOT` diverge. `_TEST_API_ENGINE`
# selects the *server's* backend (memory or surrealkv); the harness itself is
# backend-agnostic over the API.
#
# Tests run concurrently, each in a namespace of its own, so the one server is
# shared. A test that reaches outside its namespace declares
# `[env] remote-exclusive` and is given the server to itself for its duration;
# one that needs to and does not fails rather than races.

[tasks.test-lang-remote]
private = true
category = "CI - LANGUAGE TESTS"
description = "Run SurrealQL language tests against a running server over --endpoint"
script = """
#!/bin/bash -ex
# The server's default features cover every backend plus scripting / graphql /
# opengql / surrealism, so one build serves any `_TEST_API_ENGINE`.
cargo build --locked -p surreal-db
SERVER="$(pwd)/target/debug/surreal"

# Run from `language-tests` so the harness resolves its `tests/` directory the
# same way the embedded path does (relative to CWD).
cd language-tests
cargo build --locked --features remote
# The remote executor's own unit tests (endpoint-URL mapping, EXPLAIN metric
# redaction) live behind the `remote` feature, and no other CI job builds it —
# the embedded language-test jobs only `cargo build` and run the binary. Without
# this they never execute.
cargo test --locked --features remote
HARNESS="$(pwd)/target/debug/surrealql-test"
TESTS_DIR="$(pwd)/tests"
WORK="$(mktemp -d)"
mkdir -p "${WORK}/sort"

# A dedicated, uncommon port so the suite doesn't collide with whatever else
# might hold 8000 (Docker, a dev server) on a CI runner or a developer's box.
HOST="127.0.0.1:18283"

case "${_TEST_API_ENGINE}" in
    memory|mem) DATA="memory" ;;
    surrealkv)  DATA="surrealkv:${WORK}/data" ;;
    *) echo "test-lang-remote: unsupported _TEST_API_ENGINE='${_TEST_API_ENGINE}'"; exit 1 ;;
esac

# Start the server with the same datastore configuration the embedded harness
# builds: all capabilities + all experimental targets, a temp dir for TEMPFILES
# sorting, the tests tree on the file allowlist, and no bootstrap `main` ns.
SURREAL_FILE_ALLOWLIST="${TESTS_DIR}" "${SERVER}" start \
    --bind "${HOST}" \
    --user root --pass root \
    --allow-all --allow-experimental '*' \
    --temporary-directory "${WORK}/sort" --no-defaults \
    --log warn "${DATA}" &
SERVER_PID=$!
trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

# Wait for the server to accept connections before running the suite.
for _ in $(seq 1 60); do
    if curl -sf "http://${HOST}/health" >/dev/null 2>&1; then READY=1; break; fi
    sleep 1
done
if [ "${READY:-0}" != "1" ]; then echo "test-lang-remote: server did not become healthy"; exit 1; fi

# `--backend` is what filters the corpus by `[env] backend`, so it has to name
# the *server's* engine even though the harness opens no store of its own. Left
# at its `memory` default the surrealkv leg would skip the tests only a
# file-backed engine answers, and run the ones only the in-memory engine
# answers, against a server that is not one.
"${HARNESS}" --color always run --no-wip --backend "${_TEST_API_ENGINE}" --endpoint "ws://${HOST}"
"""

[tasks.ci-lang-test-remote-mem]
category = "CI - LANGUAGE TESTS"
description = "Run SurrealQL language tests over --endpoint against an in-memory server"
env = { _TEST_API_ENGINE = "memory" }
run_task = "test-lang-remote"

[tasks.ci-lang-test-remote-surrealkv]
category = "CI - LANGUAGE TESTS"
description = "Run SurrealQL language tests over --endpoint against a SurrealKV server"
env = { _TEST_API_ENGINE = "surrealkv" }
run_task = "test-lang-remote"

# --------------------------------------------------
# Language upgrade tests
# --------------------------------------------------
#
# These tasks drive the language-tests `upgrade` subcommand through the
# adjacent-pair chain defined in LANG_UPGRADE_VERSIONS. The runner spawns
# the from-version surreal binary, replays each test's imports, stops it,
# spawns the to-version binary against the same data directory, and runs
# the test query — catching any regression in how on-disk state is read.
#
# Binaries for tagged versions are downloaded from download.surrealdb.com
# into language-tests/.binary_cache/ (cached across CI runs). The trailing
# `..` token in the version list cargo-builds the current checkout.
#
# The work is two phases so CI can overlap them. The harness phase compiles the
# `surrealql-test` binary and runs its own unit tests; it needs nothing from the
# checkout's `surreal` binary, so CI runs it while that binary is still being
# built and hands `language-tests/target/debug/surrealql-test` to the axes phase.
# The axes phase needs both binaries. The `ci-lang-upgrade-test-*` tasks run the
# two phases back to back for a single machine.

[tasks.lang-upgrade-harness]
private = true
category = "CI - LANGUAGE TESTS"
description = "Build the language upgrade harness and run its own unit tests"
script = """
#!/bin/bash -ex
cd language-tests
cargo build --locked --features "${_TEST_LANG_FEATURES}"
# The harness's own unit tests live behind the `upgrade` feature and nothing
# else in CI runs them: the language-test jobs only `cargo build` and then
# execute the binary. Without this the version-gate regression tests — the guard
# against a test silently dropping out of the run set — never execute.
cargo test --locked --features "${_TEST_LANG_FEATURES}"
"""

[tasks.test-lang-upgrade]
private = true
category = "CI - LANGUAGE TESTS"
description = "Run the language upgrade axes (adjacent-pair, seed and cumulative) with a built harness"
script = """
#!/bin/bash -ex
# Needs language-tests/target/debug/surrealql-test, built with the lane's
# `_TEST_LANG_FEATURES` by `lang-upgrade-harness`.
# Override _TEST_LANG_UPGRADE_JOBS to tune per-runner concurrency (default 12).
cd language-tests
JOBS="${_TEST_LANG_UPGRADE_JOBS:-12}"
# Only `--color` is a global flag; everything else belongs to the `upgrade`
# subcommand and has to follow it.
OPTS=(--backend "${_TEST_API_ENGINE}" --allow-download --no-wip --jobs "${JOBS}")
# A machine without a wasm-capable C toolchain skips the Surrealism module tests
# with a warning so the rest of the suite stays usable. CI has the toolchain, so
# here a fixture that will not build is a failure rather than lost coverage.
export LANG_UPGRADE_REQUIRE_MODULES=1

# Axis 1 — adjacent pairs. `;` separates independent chains, `,` separates
# versions within one. Adjacent pairs are hopped within a chain; no hop is made
# across a chain boundary.
IFS=';' read -ra CHAINS <<< "${LANG_UPGRADE_VERSIONS}"
for chain in "${CHAINS[@]}"; do
    IFS=',' read -ra V <<< "${chain}"
    for ((i=0; i<${#V[@]}-1; i++)); do
        echo "=== Upgrade hop: ${V[$i]} -> ${V[$((i+1))]} (backend=${_TEST_API_ENGINE}) ==="
        ./target/debug/surrealql-test --color always upgrade "${OPTS[@]}" \
            --from "${V[$i]}" --to "${V[$((i+1))]}"
    done
done

# Axis 2 — every seed straight to the current checkout, in one invocation so the
# runs fan out across all workers rather than serialising per version.
echo "=== Upgrade seeds: ${LANG_UPGRADE_SEEDS} -> .. (backend=${_TEST_API_ENGINE}) ==="
./target/debug/surrealql-test --color always upgrade "${OPTS[@]}" \
    --from "${LANG_UPGRADE_SEEDS}" --to ..

# Axis 3 — cumulative walk. One datastore per test, carried through every
# version in order. Only tests declaring `[test.chain]` are selected, and the
# chain separator is dropped because a walk cannot skip a version.
echo "=== Upgrade chain walk: ${LANG_UPGRADE_CHAIN} (backend=${_TEST_API_ENGINE}) ==="
./target/debug/surrealql-test --color always upgrade "${OPTS[@]}" \
    --chain "${LANG_UPGRADE_CHAIN//;/,}"
"""

[tasks.test-lang-upgrade-rocksdb-migration]
private = true
category = "CI - LANGUAGE TESTS"
description = "Run the RocksDB-to-SurrealKV migration axis with a built harness"
script = """
#!/bin/bash -ex
# Needs language-tests/target/debug/surrealql-test, built with the `upgrade`
# feature by `lang-upgrade-harness`. The released binary writes `rocksdb://DIR`
# and the current checkout then opens the same DIR as `surrealkv://DIR`, once
# unversioned and once with `?versioned=true`.
cd language-tests
JOBS="${_TEST_LANG_UPGRADE_JOBS:-12}"
OPTS=(--backend rocksdb-migration --allow-download --no-wip --jobs "${JOBS}")
export LANG_UPGRADE_REQUIRE_MODULES=1

echo "=== RocksDB migration: ${LANG_UPGRADE_MIGRATION_SOURCES} -> .. (unversioned) ==="
./target/debug/surrealql-test --color always upgrade "${OPTS[@]}" \
    --from "${LANG_UPGRADE_MIGRATION_SOURCES}" --to ..

echo "=== RocksDB migration: ${LANG_UPGRADE_MIGRATION_SOURCES} -> .. (versioned) ==="
./target/debug/surrealql-test --color always upgrade "${OPTS[@]}" --versioned \
    --from "${LANG_UPGRADE_MIGRATION_SOURCES}" --to ..
"""

[tasks.ci-lang-upgrade-run-rocksdb-migration]
category = "CI - LANGUAGE TESTS"
description = "Run the RocksDB-to-SurrealKV migration axis, using a built harness"
run_task = "test-lang-upgrade-rocksdb-migration"

[tasks.ci-lang-upgrade-test-rocksdb-migration]
category = "CI - LANGUAGE TESTS"
description = "Run the RocksDB-to-SurrealKV migration axis"
env = { _TEST_LANG_FEATURES = "upgrade" }
run_task = { name = [
    "lang-upgrade-harness",
    "test-lang-upgrade-rocksdb-migration",
], fork = true, parallel = false }

[tasks.ci-lang-upgrade-harness-surrealkv]
category = "CI - LANGUAGE TESTS"
description = "Build the language upgrade harness for the SurrealKV backend"
env = { _TEST_LANG_FEATURES = "upgrade" }
run_task = "lang-upgrade-harness"

[tasks.ci-lang-upgrade-run-surrealkv]
category = "CI - LANGUAGE TESTS"
description = "Run the language upgrade axes with the SurrealKV backend, using a built harness"
env = { _TEST_API_ENGINE = "surrealkv" }
run_task = "test-lang-upgrade"

[tasks.ci-lang-upgrade-test-surrealkv]
category = "CI - LANGUAGE TESTS"
description = "Run language upgrade tests with the SurrealKV backend"
env = { _TEST_API_ENGINE = "surrealkv", _TEST_LANG_FEATURES = "upgrade" }
run_task = { name = [
    "lang-upgrade-harness",
    "test-lang-upgrade",
], fork = true, parallel = false }

[tasks.ci-lang-upgrade-test-all]
category = "CI - LANGUAGE TESTS"
description = "Run language upgrade tests on all supported backends"
dependencies = [
    "ci-lang-upgrade-test-surrealkv",
    "ci-lang-upgrade-test-rocksdb-migration",
]

# --------------------------------------------------
# MCP tests
# --------------------------------------------------

# The MCP suite needs its own task because the workspace test tasks run with
# `--no-default-features`, which suppresses `surrealdb-mcp/server-http` and so
# compiles the `#![cfg(feature = "server-http")]` HTTP and audit test files
# down to empty binaries. Naming the package and its transports explicitly is
# what makes the transport-level and audit-pipeline coverage actually execute.
[tasks.ci-mcp-test]
category = "CI - MCP TESTS"
description = "Run the MCP server test suite across every transport"
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "--package",
    "surrealdb-mcp",
    "--no-default-features",
    "--features",
    "server-http,transport-io",
    "--all-targets",
]

# --------------------------------------------------
# Workspace tests
# --------------------------------------------------

[tasks.ci-workspace-test]
category = "CI - WORKSPACE TESTS"
description = "Run workspace library tests"
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "--no-default-features",
    "--features",
    # `surrealdb-embedded/kv-mem` has to be named explicitly: it is that crate's
    # own feature, and `storage-mem` on the SDK enables `surrealdb-core/kv-mem`
    # without touching it. Everything in the embedded engine that needs a
    # datastore is gated on it, tests included. `surreal-ext/sign` likewise:
    # `--no-default-features` drops it, and without it `surreal-ext` has no
    # `sign` command for the module trust tests to sign with.
    "allocator,allocation-tracking,storage-mem,storage-surrealkv,scripting,http,jwks,surrealism,gql,surrealdb-embedded/kv-mem,surreal-ext/sign",
    "--workspace",
    "--lib",
    "--bins",
    "--tests",
    "--exclude", "demo",
    "--exclude", "surrealdb-profiling",
    "--exclude", "surrealdb-wasm",
    "--exclude", "surrealdb-node",
    "--exclude", "surrealdb-edge-size-probe",
    "--exclude", "surrealdb-parser-size-probe",
    "--exclude", "surrealism-demo",
    "--",
    "--skip", "api_integration",
    "--skip", "cli_integration",
    "--skip", "http_integration",
    "--skip", "ws_integration",
    "--skip", "graphql_integration",
    "--skip", "gql_integration",
]

[tasks.ci-workspace-test-archive]
category = "CI - WORKSPACE TESTS"
description = "Build the workspace test binaries once and pack them for ci-workspace-test-run"
command = "cargo"
args = [
    "nextest",
    "archive",
    "--locked",
    "--no-default-features",
    "--features",
    "allocator,allocation-tracking,storage-mem,storage-surrealkv,scripting,http,jwks,surrealism,gql,surrealdb-embedded/kv-mem,surreal-ext/sign",
    "--workspace",
    "--lib",
    "--bins",
    "--tests",
    "--exclude", "demo",
    "--exclude", "surrealdb-profiling",
    "--exclude", "surrealdb-wasm",
    "--exclude", "surrealdb-node",
    "--exclude", "surrealdb-edge-size-probe",
    "--exclude", "surrealdb-parser-size-probe",
    "--exclude", "surrealism-demo",
    # Omit DWARF sections on the heavy leaf workspace crates in both `profile.dev`
    # (`.rlib`/`--bins`) and `profile.test` (`--lib`/`--tests` test binaries)
    # while keeping package settings untouched for dependencies so third-party
    # and upstream workspace crates share their `kache` entries. Symbol tables
    # (`.symtab`/`.strtab`) and unwind tables remain intact for panic backtraces.
    "--config", "profile.dev.package.surrealdb-core.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-core.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-server.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-server.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb.debug=\"none\"",
    "--config", "profile.test.package.surrealdb.debug=\"none\"",
    "--config", "profile.dev.package.surreal-db.debug=\"none\"",
    "--config", "profile.test.package.surreal-db.debug=\"none\"",
    "--config", "profile.dev.package.surreal-ext.debug=\"none\"",
    "--config", "profile.test.package.surreal-ext.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-mcp.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-mcp.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-engine-local.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-engine-local.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-embedded.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-embedded.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-pgwire.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-pgwire.debug=\"none\"",
    "--config", "profile.dev.package.surrealdb-mywire.debug=\"none\"",
    "--config", "profile.test.package.surrealdb-mywire.debug=\"none\"",
    # Exclude the integration test binaries that `ci-workspace-test-run` skips,
    # so the archive neither compiles nor links those targets.
    "-E", "not binary(/^(api|cli_integration|http_integration|ws_integration|graphql_integration|gql_integration)$/)",
    "--archive-file", "target/workspace-tests.tar.zst",
]

# Runs one shard (CI_SHARD of CI_SHARDS) of the archive built by
# `ci-workspace-test-archive`, with the same skips as `ci-workspace-test`.
[tasks.ci-workspace-test-run]
category = "CI - WORKSPACE TESTS"
description = "Run one shard of the packed workspace tests"
command = "cargo"
args = [
    "nextest",
    "run",
    "--archive-file", "target/workspace-tests.tar.zst",
    "--workspace-remap", ".",
    "--partition", "count:${CI_SHARD}/${CI_SHARDS}",
    "--",
    "--skip", "api_integration",
    "--skip", "cli_integration",
    "--skip", "http_integration",
    "--skip", "ws_integration",
    "--skip", "graphql_integration",
    "--skip", "gql_integration",
]

# Defaults apply only when the caller has not set the shard variables, so a
# matrix leg's exported CI_SHARD / CI_SHARDS reach the `--partition` expansion.
[tasks.ci-workspace-test-run.env]
CI_SHARD = { value = "1", condition = { env_not_set = ["CI_SHARD"] } }
CI_SHARDS = { value = "1", condition = { env_not_set = ["CI_SHARDS"] } }

[tasks.ci-cjk-test]
category = "CI - WORKSPACE TESTS"
description = "Run the surrealdb-idx tests with the embedded dictionaries enabled"
# The `cjk-embed-*` features are off everywhere else, so every test behind them
# is invisible to the other lanes: `ci-feature-check-idx` only runs `cargo
# check`, which does not build test code at all. Without this lane the tests
# that need an embedded dictionary would compile nowhere and run nowhere.
#
# This runs the crate's whole library suite rather than filtering to the
# segmentation modules. A dictionary is needed wherever it is used, not only
# where it is parsed — the cache that loads one is tested beside the cache, not
# beside the tokenizer — so a filter naming modules quietly stops covering a
# gated test added outside them, which is the very gap this lane exists to
# close. Re-running the rest of the crate's tests costs seconds against the
# dictionary download that dominates this lane.
#
# Enabling the features makes each dictionary crate's build script download its
# dictionary, which is why this is its own lane rather than a flag added to the
# workspace run: the cost lands only here.
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "--package",
    "surrealdb-idx",
    "--features",
    "cjk-embed-all",
    "--lib",
]

# The compile-phase timers' event tests are built only with `compile-timers`, which no other
# lane enables, so they compile and run nowhere else.
[tasks.ci-compile-timers-test]
category = "CI - WORKSPACE TESTS"
description = "Run the compile-phase timers' tests in surrealdb-core"
command = "cargo"
args = [
    "nextest",
    "run",
    "--locked",
    "--package",
    "surrealdb-core",
    "--features",
    "compile-timers,kv-mem",
    "--lib",
    "--",
    "timers::",
]

