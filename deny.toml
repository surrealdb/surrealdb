# See all available configuration options at:
# https://embarkstudios.github.io/cargo-deny/index.html

# --------------------------------------------------
# GRAPH
# --------------------------------------------------

[graph]
# If true, metadata will be collected with `--all-features`
all-features = true
# If true, metadata will be collected with `--no-default-features`
no-default-features = true

# --------------------------------------------------
# BANS
# --------------------------------------------------

[bans]
# The graph highlighting used when creating dotgraphs for crates.
highlight = "all"
# The lint level for when a crate version requirement is set to `*`.
wildcards = "deny"
# Path dependencies on private (publish = false) workspace crates are declared
# without a version on purpose - a version would keep them in published
# manifests and break `cargo publish`. Cargo reads a version-less path dep as
# `*`, so allow that specifically for path deps while still denying genuine
# registry wildcards.
allow-wildcard-paths = true
# Lint level for when multiple versions of the same crate are detected.
multiple-versions = "allow"
# The default lint level for `default` features for workspace crates.
workspace-default-features = "allow"
# The default lint level for `default` features for external crates.
external-default-features = "allow"

# --------------------------------------------------
# SOURCES
# --------------------------------------------------

[sources]
# What to do when encountering a repository from a host not in the allow list.
unknown-git = "deny"
# What to do when encountering a crate from a registry not in the allow list.
unknown-registry = "deny"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories.
allow-git = ["https://github.com/surrealdb/surrealkv"]

# --------------------------------------------------
# ADVISORIES
# --------------------------------------------------

[advisories]
version = 2
# The url(s) of the advisory databases to use.
db-urls = ["https://github.com/rustsec/advisory-db"]
# The path where the advisory database is cloned/fetched into.
db-path = "~/.cargo/advisory-db"
# The lint level for crates that have been yanked.
yanked = "warn"
# A list of security advisory identifiers to ignore.
# TODOs:
# - for RUSTSEC-2025-0141, bincode is unmaintained but considered complete and stable at v1.3.3.
#   Plan migration to wincode, postcard, bitcode, or rkyv in future.
# - for RUSTSEC-2023-0071, rsa gas a constant-time implementation allowing attackers to recover keys
#   see https://github.com/RustCrypto/RSA/issues/19#issuecomment-1822995643 for more information
# - for RUSTSEC-2024-0436, paste is now unmaintained and archived, but we only use paste in tests
#   so we could wait for ${concat(...)} metavariable expressions (issue #124225) to stabilize.
#
# Cleared by the wasmtime 44 bump on main (RUSTSEC-2026-0149, wasmtime-wasi 43.0.2
# `path_open(TRUNCATE)` host-perm bypass).
#
# - for RUSTSEC-2026-0249, smartstring is unmaintained (archived 2026-05-03) and every version
#   is affected, so there is no upgrade that clears it. It reaches us only through
#   `opentelemetry-prometheus-text-exporter`, which uses it for metric and label names the
#   server itself supplies — no attacker-controlled input, and nothing `unsafe` of ours. Every
#   published release of the exporter requires `smartstring = "^1.0.1"`, so clearing this
#   means the exporter migrating to `compact_str` or `smol_str`.
# - for RUSTSEC-2026-0387, `crypto-bigint 0.5.5` has operations that are not constant-time on
#   every compiler and target. It reaches us only through `elliptic-curve 0.13`, which `p256`,
#   `p384` and `ssh-key` use in `surrealism-verify` to check the signature of a module against a
#   public key: public inputs, no secret scalar. Clearing it means the RustCrypto elliptic-curve
#   crates moving to a release built on a patched `crypto-bigint`.
# - for RUSTSEC-2026-0391, -0398 and -0403, the only vulnerable `zstd 0.13.3` /
#   `zstd-safe 7.3.0` in the tree is reached by `tonic` (gRPC transport compression),
#   `surrealkv` (SSTable blocks) and `surrealkv-compat-rocksdb` (legacy RocksDB reads),
#   and none of them call an affected API. -0391 is the `Encoder`/`Decoder::with_context`
#   reused-context leak: each path builds a fresh coder (`read::Decoder`/`Encoder::new`,
#   `stream::encode_all`/`decode_all`, `bulk::decompress`), never `with_context`. -0398 is
#   the `zstd_safe::seekable` decompress path, which nothing here uses. -0403 is streaming
#   `write::Decoder` on a legacy frame; that advisory clears `read::Decoder`, `decode_all`
#   and the bulk API, which are the only forms we use. Clearing these is the zstd 0.14.3 /
#   zstd-safe 8.2.0 bump, which `tonic` (`zstd = "^0.13"`) and `surrealkv` pin out until an
#   upstream release carries it.
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0249",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

# --------------------------------------------------
# LICENSES
# --------------------------------------------------

[licenses]
version = 2
# List of explicitly allowed licenses from https://spdx.org/licenses
allow = [
    "MIT",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.95

