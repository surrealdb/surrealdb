/**
[env]
namespace = true
database = true
imports = ["gql/_schema.surql", "reproductions/_gql_min_param.surql"]

[test]
reason = "A GQL MATCH whose WHERE compares a node's field with a defined parameter answers the nodes whose field exceeds it. The lowering guards the parameter against NONE; the guard shares the parameter's read with the comparison, so it is judged per row beside it."

[[test.results]]
value = "[{ name: 'A' }]"
*/

MATCH (p:person) WHERE p.age > $min RETURN p.name AS name ORDER BY name
