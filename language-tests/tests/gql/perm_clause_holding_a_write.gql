/**
[env]
imports = ["gql/_perm_clause_holding_a_write_import.surql"]
auth = { namespace = "test", database = "test", access = "user", rid = "person:1" }

[test]
reason = """
A stored SELECT permission whose untaken branch holds a write must not decline
the read.

The clause is compiled with the plan that reads the table. A write in an untaken
branch is carried in the compiled clause and never runs, so the read answers as
the clause reads: a GQL plan has no statement behind it to retry, so a read that
declined here would fail outright on a branch it would never have taken.
"""

[[test.results]]
value = "[{ name: 'bob' }]"

*/

MATCH (a:person)-[:knows]->(b:person) RETURN b.name AS name ORDER BY name
