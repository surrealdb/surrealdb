[package]
# The database component of the Surreal CLI. The package is `surreal-db`, but the
# executable it builds is `surreal`: installs, the download layout and the
# Docker image all name the executable, and they do not change with the package.
name = "surreal-db"
publish = false
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

[[bin]]
name = "surreal"
path = "src/main.rs"

[features]
# Inherit the shared default feature set from `surrealdb-server` so the two
# crates don't duplicate the list. This includes `cli`, so the binary and the
# enterprise binary both get the `sql` subcommand by default.
default = ["surrealdb-server/default"]

allocator = ["surrealdb-server/allocator"]
allocation-tracking = ["surrealdb-server/allocation-tracking"]
http = ["surrealdb-server/http"]
# Embedded CJK segmentation dictionaries. Enabled for the shipped binaries
# (and so for the Docker images built from them); see the release workflow.
cjk = ["surrealdb-server/cjk"]
jwks = ["surrealdb-server/jwks"]
ml = ["surrealdb-server/ml"]
scripting = ["surrealdb-server/scripting"]
surrealism = ["surrealdb-server/surrealism"]
storage-mem = ["surrealdb-server/storage-mem"]
storage-surrealkv = ["surrealdb-server/storage-surrealkv"]
storage-tikv = ["surrealdb-server/storage-tikv"]
# GraphQL API support
graphql = ["surrealdb-server/graphql"]
# GQL (ISO/IEC 39075) API support
gql = ["surrealdb-server/gql"]
# MCP (Model Context Protocol) server support
mcp = ["surrealdb-server/mcp"]
# Postgres wire protocol support
postgres = ["surrealdb-server/postgres"]
# MySQL wire protocol support
mysql = ["surrealdb-server/mysql"]
# Interactive SQL CLI support
cli = ["surrealdb-server/cli"]

[dependencies]
# workspace internal dependencies
surrealdb = { workspace = true, features = [
    "protocol-grpc",
    "protocol-http",
    "protocol-ws",
    "rustls",
] }
surrealdb-core = { workspace = true, features = [
    "shaped",
    "crypto-digest",
    "crypto-password",
    "html-sanitize",
    "cjk-tokenizer",
    "observability",
    "vector-index",
    "fulltext",
    "regex-unicode",
    "collate",
    "geo",
    "scram",
    "text-diff",
    "url",
    "maintenance-tasks",
    "api",
    "files",
    "search",
    "encoding",
    "egraph",
] }
surrealdb-rpc.workspace = true
surrealdb-server.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "user"] }

[dev-dependencies]
assert_fs.workspace = true
blake3.workspace = true
chrono.workspace = true
web-time.workspace = true
ciborium.workspace = true
futures.workspace = true
futures-util.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, default-features = false, features = [
    "blocking",
    "gzip",
    "http2",
] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
surrealism-runtime.workspace = true
surrealdb-types.workspace = true
test-log = { workspace = true, features = ["trace"] }
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "signal", "tracing"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
tokio-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
ulid.workspace = true
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
semver.workspace = true

[package.metadata.deb]
# The Debian package and its systemd unit keep the executable's name rather than
# taking the Cargo package's.
name = "surreal"
assets = [
    [
        "target/release/surreal",
        "usr/share/surrealdb/surreal",
        "755",
    ],
    [
        "pkg/deb/README",
        "usr/share/surrealdb/README",
        "644",
    ],
]
copyright = "SurrealDB Ltd. 2022"
depends = "$auto"
extended-description = "A scalable, distributed, collaborative, document-graph database, for the realtime web."
license-file = ["LICENSE", "4"]
maintainer = "Tobie Morgan Hitchcock <tobie@surrealdb.com>"
maintainer-scripts = "pkg/deb/"
priority = "optional"
section = "utility"
systemd-units = { unit-name = "surreal", enable = true }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(docker)',
    'cfg(storage)',
    'cfg(tokio_unstable)',
] }

[workspace.lints.clippy]

# Checks for items referred to through a path rather than a `use` import.
# Deep inline paths obscure which crate an item comes from and make dependency churn harder to see.
# `crate`, `self`, `std`, `core` and `alloc` are exempted via `absolute-paths-allowed-crates` in
# `.clippy.toml`; `use` declarations and macro expansions are never flagged.
# Crate roots that still carry violations opt out with `#![allow(clippy::absolute_paths)]`.
# https://rust-lang.github.io/rust-clippy/master/#absolute_paths
absolute_paths = "warn"

# Checks for usage of `#[allow]` attribute and suggests replacing it with `#[expect]`.
# `#[expect]` attributes suppress the lint emission, but emit a warning if the expectation is unfulfilled.
# This is useful to be notified when the lint is no longer triggered.
# https://rust-lang.github.io/rust-clippy/master/#allow_attributes
# TODO(stu): We should try to replace all of these with `#[expect]` instead. Setting to `allow` for now to avoid
# more changes.
allow_attributes = "allow"

# Checks for code like `foo = bar.clone();`.
# Custom `Clone::clone_from()` or `ToOwned::clone_into` implementations allow the objects to share resources and
# therefore avoid allocations.
# https://rust-lang.github.io/rust-clippy/master/#assigning_clones
assigning_clones = "warn"

# This lint allows boolean comparisons in assert-like macros.
# It is fine to use `assert_eq!(val, true)` in tests and is often more readable than `assert!(val)`.
# https://rust-lang.github.io/rust-clippy/master/#bool_assert_comparison
bool_assert_comparison = "allow"

# Checks for `.clone()` on ref-counted pointers (`Rc`, `Arc`, or `Weak`) where `Rc::clone` /
# `Arc::clone` would make pointer duplication obvious.
# https://rust-lang.github.io/rust-clippy/master/#clone_on_ref_ptr
clone_on_ref_ptr = "warn"

# Checks for the usage of `as _` conversion using inferred type.
# https://rust-lang.github.io/rust-clippy/master/#cloned_instead_of_copied
cloned_instead_of_copied = "warn"

# Checks for function/method calls with a mutable parameter in `debug_assert!`, `debug_assert_eq!` and
# `debug_assert_ne!` macros.
# In release builds `debug_assert!` macros are optimized out by the compiler. Therefore mutating something in a
# `debug_assert!` macro results in different behavior between a release and debug build.
# https://rust-lang.github.io/rust-clippy/master/#debug_assert_with_mut_call
debug_assert_with_mut_call = "warn"

# Denies the configured methods and functions in `clippy.toml`.
# Some methods are undesirable in certain contexts, and it’s beneficial to lint for them as needed.
# https://rust-lang.github.io/rust-clippy/master/#disallowed_methods
disallowed_methods = "warn"

# Checks for explicit `.into_iter()` calls in for loops when the loop already implicitly calls it.
# Removing the explicit call makes the code more concise and idiomatic.
# https://rust-lang.github.io/rust-clippy/master/#explicit_into_iter_loop
explicit_into_iter_loop = "warn"

# Checks for impls of `From<..>` that contain `panic!()` or `unwrap()`
# TryFrom should be used if there’s a possibility of failure.
# https://rust-lang.github.io/rust-clippy/master/#fallible_impl_from
fallible_impl_from = "warn"

# Checks for usage of `.get().unwrap()` (or `.get_mut().unwrap()`) on a standard library type which implements Index.
# Using the Index trait ([]) is more clear and more concise.
# https://rust-lang.github.io/rust-clippy/master/#get_unwrap
get_unwrap = "warn"

# Checks for the usage of `_.to_owned()`, `vec.to_vec()`, or similar when calling `_.clone()` would be clearer.
# https://rust-lang.github.io/rust-clippy/master/#implicit_clone
implicit_clone = "warn"

# Checks for usage of `.to_string()` on an `&&T` where `T` implements `ToString` directly (like `&&str` or `&&String`).
# This bypasses the specialized implementation of ToString and instead goes through the more expensive string
# formatting facilities.
# https://rust-lang.github.io/rust-clippy/master/#inefficient_to_string
inefficient_to_string = "warn"

# Checks for large types being passed by value instead of by reference.
# Passing large types by value causes unnecessary copies and memory overhead on the stack.
# https://rust-lang.github.io/rust-clippy/master/#large_types_passed_by_value
large_types_passed_by_value = "warn"

# Checks for whole number float literals that cannot be represented as the underlying type without loss.
# If the value was intended to be exact, it will not be. This may be especially surprising when the lost precision
# is to the left of the decimal point.
# https://rust-lang.github.io/rust-clippy/master/#lossy_float_literal
lossy_float_literal = "warn"

# Checks for usage of Mutex<X> where an atomic will do.
# https://rust-lang.github.io/rust-clippy/master/#mutex_atomic
mutex_atomic = "warn"

# Checks for functions taking arguments by value where the argument could be
# borrowed (i.e. the body only needs `&T`).
# https://rust-lang.github.io/rust-clippy/master/#needless_pass_by_value
needless_pass_by_value = "warn"

# Checks for binding to underscore prefixed variable without side-effects.
# https://rust-lang.github.io/rust-clippy/master/index.html#no_effect_underscore_binding
no_effect_underscore_binding = "warn"

# Checks for usage of `.as_ref().cloned()` and suggests `.cloned()` instead.
# Using `.cloned()` directly is more concise and easier to read.
# https://rust-lang.github.io/rust-clippy/master/#option_as_ref_cloned
option_as_ref_cloned = "warn"

# Checks for unnecessary calls to `.clone()` on values that are already owned or about to be dropped.
# Redundant clones waste memory and CPU cycles without providing any benefit.
# https://rust-lang.github.io/rust-clippy/master/#redundant_clone
redundant_clone = "warn"

# Checks for usage of `.contains()` followed by `.insert()` on `HashSet` or `BTreeSet`.
# Using a single `.insert()` call and checking its return value is more efficient as it avoids double lookup.
# https://rust-lang.github.io/rust-clippy/master/#set_contains_or_insert
set_contains_or_insert = "warn"

# Checks for functions that pass by value but are trivially copyable.
# https://rust-lang.github.io/rust-clippy/master/#trivially_copy_pass_by_ref
trivially_copy_pass_by_ref = "warn"

# Checks for unnecessary calls to `to_owned()`, `to_string()` and other similar conversion methods
# that result in unnecessary allocations when a reference would suffice.
# https://rust-lang.github.io/rust-clippy/master/#unnecessary_to_owned
unnecessary_to_owned = "warn"

# Checks for functions that are declared `async` but have no `.await`s inside of them.
# Async functions with no async code create overhead, both mentally and computationally.
# https://rust-lang.github.io/rust-clippy/master/#unused_async
#
# SurrealDB relies on async functions in the AST parser and executor to avoid stack overflows.
# Warning or denying this lint can cause unexpected errors.
unused_async = "allow"

# Checks for `.unwrap()` or `.unwrap_err()` calls on Results and `.unwrap()` call on `Option`s.
# https://rust-lang.github.io/rust-clippy/master/index.html#unwrap_used
unwrap_used = "warn"

# Checks for the use of bindings with a single leading underscore.
# https://rust-lang.github.io/rust-clippy/master/index.html#used_underscore_binding
used_underscore_binding = "warn"

# Checks for wildcard enum matches using `_`.
# https://rust-lang.github.io/rust-clippy/master/index.html#wildcard_enum_match_arm
wildcard_enum_match_arm = "deny"

# Profiles

# Plain `cargo build`/`cargo test` (the default dev profile) emitted full
# DWARF (`debug = 2`) for every workspace crate, including the ~300k-LOC
# `surrealdb-core`. Full local-variable debuginfo is a sizable share of
# codegen + final link cost and is rarely used in day-to-day iteration.
# `line-tables-only` keeps backtraces with file:line resolution (panics,
# `RUST_BACKTRACE`, profilers) while dropping local-variable DWARF, and
# `unpacked` keeps debuginfo in the per-object files so no `dsymutil` pass
# runs. This matches the debug settings already used by `[profile.make]`
# and `[profile.profiling]`. Runtime behaviour is unchanged — only the
# emitted DWARF differs. Use `cargo build --config 'profile.dev.debug=2'`
# for a one-off full-debuginfo build under a debugger.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# The suite crate registers its tests through `inventory` module
# constructors. wasm-ld extracts archive members only to satisfy symbol
# references (it has no special handling for init-array members, unlike
# ELF linkers), so the registrations must share one object with the
# `run_all` entry point the consumer references — i.e. one codegen unit —
# or the browser test runner sees an empty registry.
[profile.dev.package.surrealdb-kvs-test]
codegen-units = 1
incremental = false

# Password hashing is deliberately expensive by iteration count, so its cost
# scales directly with how well the inner compression loop is compiled. At
# `opt-level = 0` these cores run one to two orders of magnitude slower than
# optimised — enough that a single `crypto::scrypt::generate` takes over ten
# seconds and the `crypto::*` language tests exceed their per-test timeout.
# Optimising only these packages leaves every workspace crate debuggable while
# the hash cores run at release speed. Output is unchanged; only the time taken
# to produce it differs, so nothing here relaxes a cost parameter and the hashes
# a debug build produces stay the ones a release build would.
#
# `language-tests` is a separate workspace and does not inherit this, so it
# carries the same overrides in its own manifest.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.base64ct]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.typenum]
opt-level = 3

# Signature verification (extension signatures, JWTs) spends its time in
# elliptic-curve field arithmetic, which at `opt-level = 0` runs one to two
# orders of magnitude slower than optimised. The same reasoning as above
# applies: only the arithmetic cores are optimised, and their results do not
# change.
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3

# Surrealism extensions are compiled to native code by Cranelift when they are
# defined or first loaded. In a `dev` build the compiler runs one to two orders
# of magnitude slower, so every test that defines an extension would spend most
# of its time compiling, and many such tests at once starve their servers of
# CPU. Two settings account for it: `opt-level = 0`, and `debug_assertions`,
# under which `cranelift-codegen` compiles in its per-instruction `trace!`
# logging (otherwise gated on its `trace-log` feature). A server logging at
# `trace` hands each of those records to the `log` bridge and its filters even
# though the filters drop them. Only the compiler is changed; the code it emits,
# and so what the tests observe, is the same.
[profile.dev.package.cranelift-codegen]
opt-level = 3
debug-assertions = false
[profile.dev.package.cranelift-codegen-shared]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3

# Regular-expression compilation and NFA/DFA search run inside the parser,
# `string::matches`, `regex::*` builtins and test-output canonicalisation.
# Optimising the automata and syntax crates speeds up regex construction and
# matching without changing results.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# Equality saturation (`egg::Runner`) runs inside the e-graph planner and its
# corpus equivalence suites over thousands of queries per test run.
[profile.dev.package.egg]
opt-level = 3

# `dev` with optimised workspace code, for binaries CI builds only to execute
# queries against: the `surreal` server the integration lanes share and the
# language-test runner. Debug assertions, overflow checks and unwinding stay
# on, so a failure reads as it does under `dev`.
#
# It is a separate profile, not a change to `dev`, because `opt-level` is part
# of every compile unit's cache key. Setting it on `dev` would rebuild each job
# that only checks, lints or builds test archives, for no gain in any of them.
# Builds in this profile land in `target/devopt`, apart from `target/debug`.
#
[profile.devopt]
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = true

# The SurrealQL parser's golden corpus check (`cargo make ci-parser-golden`),
# which gates pull requests. It runs optimised code, as the check parses every
# corpus input through every entry point, but drops `release`'s whole-program
# LTO and single codegen unit: those roughly double its build from cold and
# triple its rebuild after a parser change, for little gain in its run.
# Debug assertions and overflow checks stay off, as in `release`, so the check
# runs the parser as it ships.
[profile.golden]
inherits = "release"
lto = false
codegen-units = 16

# Faster release-mode checks/lints in CI (no whole-crate LTO)
[profile.clippy-release]
inherits = "release"
lto = false
codegen-units = 16

# The browser engine (`surrealdb/wasm`). A wasm module is downloaded before it
# can run, so its size is a latency cost every page load pays and `opt-level`
# trades against — which is the one setting that differs from `release`.
# `wasm-opt -Oz` runs afterwards and shrinks the module further, but it works on
# the emitted code and cannot recover a monomorphisation `-O3` chose to inline.
#
# Profiles have to live here: cargo reads them only from the workspace root and
# silently ignores a `[profile]` in a member manifest.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'

# Keeps the symbol names a browser stack trace needs, and the panic messages
# `panic = "abort"` would otherwise let the runtime discard. Paired with the
# crate's `debug` feature, which installs the console panic hook that reports
# them. Disables whole-program LTO and enables parallel codegen units so debug
# Wasm builds do not serialize on a single fat-LTO codegen unit.
[profile.wasm-release-debug]
inherits = "wasm-release"
lto = false
codegen-units = 16
strip = false
panic = 'unwind'

# The engine as an edge worker (Cloudflare Workers) bundles it, measured by
# `scripts/wasm-size-budget.sh`. Its size is the worker's cold-start cost, so
# every setting favours size: `opt-level = 'z'`, one fat-LTO codegen unit and
# no unwinding. The nightly-only flags that shrink it further — rebuilding std
# with `panic=immediate-abort`, `-Zlocation-detail=none` and friends — cannot
# be set from a profile on stable; the script passes them, and documents each.
[profile.edge]
inherits = "release"
opt-level = 'z'
lto = 'fat'
codegen-units = 1
panic = 'abort'

[profile.bench]
strip = false

[profile.make]
inherits = "dev"
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.profiling]
inherits = "release"
# `line-tables-only` keeps frame symbolication for `sample` / `perf` /
# flamegraphs while dropping local-variable info — ~half the debug-data
# size and a noticeably faster final-binary LTO pass.
debug = "line-tables-only"
strip = false
panic = 'unwind'
# ThinLTO + multi-codegen-unit final binary. Still cross-crate inlines
# (within 1-3% of full LTO on hot loops in practice), but the link step
# parallelises across cores instead of running one 30+ minute single-threaded
# rustc. Worth it for an iterative profiling loop.
lto = "thin"
codegen-units = 16
