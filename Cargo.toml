[workspace]
resolver = "3"
members = [
    # Root package
    ".",
    # SurrealDB crates
    "surrealdb",
    "surrealdb/cnf",
    "surrealdb/collections",
    "surrealdb/common",
    "surrealdb/core",
    "surrealdb/datastore",
    "surrealdb/edge-size-probe",
    "surrealdb/embedded",
    "surrealdb/catalog",
    "surrealdb/engine-api",
    "surrealdb/engine-local",
    "surrealdb/expr",
    "surrealdb/gql",
    "surrealdb/iam",
    "surrealdb/idx",
    "surrealdb/keyspace-macro",
    "surrealdb/kvs",
    "surrealdb/kvs-any",
    "surrealdb/kvs-mem",
    "surrealdb/kvs-surrealkv",
    "surrealdb/kvs-test",
    "surrealdb/kvs-tikv",
    "surrealdb/mcp",
    "surrealdb/ext",
    "surrealdb/mysql",
    "surrealdb/mywire",
    "surrealdb/node",
    "surrealdb/observe",
    "surrealdb/parse-common",
    "surrealdb/parser-next",
    "surrealdb/parser-next/size-probe",
    "surrealdb/pgsql",
    "surrealdb/pgwire",
    "surrealdb/rpc",
    "surrealdb/runtime",
    "surrealdb/server",
    "surrealdb/sqlplan",
    "surrealdb/sqlfront-derive",
    "surrealdb/sqlfront-spec",
    "surrealdb/sqon",
    "surrealdb/stored-derive",
    "surrealdb/strand",
    "surrealdb/types",
    "surrealdb/types/derive",
    "surrealdb/wasm",
    # SurrealML crates
    "surrealml/core",
    # Surrealism crates
    "surrealism",
    "surrealism/demo",
    "surrealism/macros",
    "surrealism/runtime",
    "surrealism/types",
    "surrealism/verify",
    # Other
    "profiling",
]

[workspace.package]
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
edition = "2024"
license-file = "LICENSE"
publish = false
version = "4.0.0-nightly"
description = "A scalable, distributed, collaborative, document-graph database, for the realtime web"
repository = "https://github.com/surrealdb/surrealdb"
homepage = "https://github.com/surrealdb/surrealdb"
keywords = [
    "database",
    "embedded-database",
    "key-value",
    "key-value-store",
    "kv-store",
]
categories = ["database-implementations", "data-structures", "embedded"]

[workspace.dependencies]
# SurrealDB crates
surrealdb = { version = "4.0.0-nightly", path = "surrealdb", default-features = false }
surrealdb-catalog = { version = "4.0.0-nightly", path = "surrealdb/catalog" }
surrealdb-expr = { version = "4.0.0-nightly", path = "surrealdb/expr", default-features = false }
surrealdb-gql = { version = "4.0.0-nightly", path = "surrealdb/gql" }
surrealdb-parser-next = { version = "4.0.0-nightly", path = "surrealdb/parser-next" }
surrealdb-strand = { version = "4.0.0-nightly", path = "surrealdb/strand", default-features = false }
surrealdb-core = { version = "4.0.0-nightly", path = "surrealdb/core", default-features = false }
surrealdb-embedded = { version = "4.0.0-nightly", path = "surrealdb/embedded", default-features = false }
surrealdb-datastore = { version = "4.0.0-nightly", path = "surrealdb/datastore" }
surrealdb-engine-api = { version = "4.0.0-nightly", path = "surrealdb/engine-api" }
surrealdb-engine-local = { version = "4.0.0-nightly", path = "surrealdb/engine-local", default-features = false }
surrealdb-server = { version = "4.0.0-nightly", path = "surrealdb/server", default-features = false }
surrealdb-mcp = { version = "4.0.0-nightly", path = "surrealdb/mcp", default-features = false }
surrealdb-mywire = { version = "4.0.0-nightly", path = "surrealdb/mywire", default-features = false }
surrealdb-pgwire = { version = "4.0.0-nightly", path = "surrealdb/pgwire", default-features = false }
surrealdb-types = { version = "4.0.0-nightly", path = "surrealdb/types", default-features = false }
surrealdb-types-derive = { version = "4.0.0-nightly", path = "surrealdb/types/derive" }
parse-common = { version = "4.0.0-nightly", package = "surrealdb-parse-common", path = "surrealdb/parse-common" }
sqon = { version = "4.0.0-nightly", package = "surrealdb-sqon", path = "surrealdb/sqon" }
common = { version = "4.0.0-nightly", package = "surrealdb-common", path = "surrealdb/common" }
surrealdb-cnf = { version = "4.0.0-nightly", path = "surrealdb/cnf" }
surrealdb-runtime = { version = "4.0.0-nightly", path = "surrealdb/runtime", default-features = false }
surrealdb-rpc = { version = "4.0.0-nightly", path = "surrealdb/rpc" }
surrealdb-iam = { version = "4.0.0-nightly", path = "surrealdb/iam" }
surrealdb-idx = { version = "4.0.0-nightly", path = "surrealdb/idx", default-features = false }
surrealdb-observe = { version = "4.0.0-nightly", path = "surrealdb/observe" }
surrealdb-keyspace-macro = { version = "4.0.0-nightly", path = "surrealdb/keyspace-macro" }
surrealdb-stored-derive = { version = "4.0.0-nightly", path = "surrealdb/stored-derive" }
surrealdb-kvs = { version = "4.0.0-nightly", path = "surrealdb/kvs" }
surrealdb-kvs-any = { version = "4.0.0-nightly", path = "surrealdb/kvs-any", default-features = false }
surrealdb-kvs-mem = { version = "4.0.0-nightly", path = "surrealdb/kvs-mem" }
surrealdb-kvs-surrealkv = { version = "4.0.0-nightly", path = "surrealdb/kvs-surrealkv" }
# Dev-only, `publish = false`: declared WITHOUT a version so cargo strips it
# from published manifests. A version here would make cargo package/publish
# demand it from crates.io, where a publish=false crate can never appear -
# breaking every crate that dev-depends on it (surrealdb-kvs-any).
surrealdb-kvs-test = { path = "surrealdb/kvs-test" }
surrealdb-mysql = { version = "4.0.0-nightly", path = "surrealdb/mysql" }
surrealdb-pgsql = { version = "4.0.0-nightly", path = "surrealdb/pgsql" }
surrealdb-sqlplan = { version = "4.0.0-nightly", path = "surrealdb/sqlplan" }
surrealdb-sqlfront-derive = { version = "4.0.0-nightly", path = "surrealdb/sqlfront-derive" }
surrealdb-sqlfront-spec = { path = "surrealdb/sqlfront-spec" }
surrealdb-kvs-tikv = { version = "4.0.0-nightly", path = "surrealdb/kvs-tikv" }
surrealdb-collections = { version = "4.0.0-nightly", path = "surrealdb/collections" }

# SurrealML crates
surrealml-core = { version = "0.4.0-nightly", path = "surrealml/core" }
# Surrealism crates
surrealism = { version = "0.7.0-nightly", path = "surrealism" }
surrealism-macros = { version = "0.7.0-nightly", path = "surrealism/macros", default-features = false }
surrealism-runtime = { version = "0.7.0-nightly", path = "surrealism/runtime" }
surrealism-types = { version = "0.7.0-nightly", path = "surrealism/types", default-features = false }
surrealism-verify = { version = "0.7.0-nightly", path = "surrealism/verify" }


# External surreal crates
affinitypool = "0.8.0"
dmp = "0.2.3"
lexicmp = "0.2.0"
revision = { version = "0.30.0", features = [
    "bytes",
    "chrono",
    "geo",
    "roaring",
    "rust_decimal",
    "specialised-vectors",
    "uuid",
] }

storekey = { version = "0.11.0", features = ["bytes", "uuid"] }
surrealkv = { version = "1.0.0", git = "https://github.com/surrealdb/surrealkv", rev = "81a5200" }
surrealmx = "1.0.0"
web-time = "1.1.0"
## Maintained by @Delskayn
js = { version = "0.14.0", package = "rquickjs", features = ["rust-alloc"] }

# External KV stores
tikv = { version = "0.5.0", default-features = false, package = "surrealdb-tikv-client" }

# Other crates
addr = { version = "0.15.6", default-features = false, features = ["std"] }
ahash = "0.8.12"
ammonia = "4.2.3"
anyhow = "1.0.104"
arbitrary = "1.5.0"
argon2 = "0.5.3"
