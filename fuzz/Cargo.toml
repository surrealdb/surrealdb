[package]
name = "surrealdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version= "0.4.12", features = ["arbitrary-derive"] }
tokio = "1.52.1"

[dependencies.surrealdb-core]
path = "../surrealdb/core"
features = ["kv-mem", "regex-unicode", "collate", "geo", "scram", "text-diff", "url", "maintenance-tasks", "api", "files", "search", "encoding", "arbitrary", "gql", "crypto-digest", "crypto-password", "html-sanitize", "cjk-tokenizer", "observability", "vector-index", "fulltext"]
default-features = false

[dependencies.surrealdb-gql]
path = "../surrealdb/gql"

[dependencies.surrealdb-parser-next-lower]
path = "../surrealdb/parser-next/lower"

[dependencies.surrealdb-sql]
path = "../surrealdb/sql"
features = ["arbitrary"]

[dependencies.surrealdb-types]
path = "../surrealdb/types"
features = ["arbitrary"]
default-features = false


# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_sql_parser"
path = "fuzz_targets/fuzz_sql_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_gql_parser"
path = "fuzz_targets/fuzz_gql_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_executor"
path = "fuzz_targets/fuzz_executor.rs"
test = false
doc = false

[[bin]]
name = "fuzz_structured_executor"
path = "fuzz_targets/fuzz_structured_executor.rs"
test = false
doc = false


[[bin]]
name = "fuzz_vm_executor"
path = "fuzz_targets/fuzz_vm_executor.rs"
test = false
doc = false

[[bin]]
name = "fuzz_format"
path = "fuzz_targets/fuzz_format.rs"
test = false
doc = false
