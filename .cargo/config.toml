# Unoptimised builds spill every local and temporary into each async fn's
# stack frame, and executing a query polls through a chain that is hundreds of
# async frames deep, so some debug-build tests need more than the 2 MiB
# default thread stack. Threads spawned without an explicit stack size —
# libtest test threads and tokio runtime threads included — honour
# RUST_MIN_STACK, and cargo applies [env] to every process it launches,
# including test binaries under both `cargo test` and `cargo nextest`. CI sets
# the same 8 MiB for the workspace test job in ci.yml. A RUST_MIN_STACK
# already exported in the environment takes precedence over this entry.
[env]
RUST_MIN_STACK = "8388608"

[target.wasm32-unknown-unknown]
# getrandom 0.3 refuses to build for this target until a backend is named, and
# the choice is a cfg rather than a feature so it cannot be expressed as a
# dependency. The graph reaches getrandom through `geo` -> `rand`, so every
# wasm build needs it.
#
# This line does NOT provide it to every wasm build. Cargo treats `RUSTFLAGS`,
# `build.rustflags` and `target.<triple>.rustflags` as mutually exclusive
# sources, checked in that order, first match wins — they are not concatenated.
# So a build that sets `RUSTFLAGS` at all discards this, and both
# `Makefile.local.toml` and CI set `-D warnings`. Such a build must carry the
# cfg itself, as `ci-check-wasm` does; this line covers only the wasm builds
# that set no `RUSTFLAGS`, such as `wasm-pack`.
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
rustflags = [
	"-C", "target-feature=+crt-static",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
	"-C", "target-feature=+crt-static",
	"-C", "link-arg=/NODEFAULTLIB:libvcruntimed.lib",
	"-C", "link-arg=/NODEFAULTLIB:vcruntime.lib",
	"-C", "link-arg=/NODEFAULTLIB:vcruntimed.lib",
	"-C", "link-arg=/NODEFAULTLIB:libcmtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:msvcrt.lib",
	"-C", "link-arg=/NODEFAULTLIB:msvcrtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:libucrt.lib",
	"-C", "link-arg=/NODEFAULTLIB:libucrtd.lib",
	"-C", "link-arg=/NODEFAULTLIB:ucrtd.lib",
	"-C", "link-arg=/DEFAULTLIB:libvcruntime.lib",
	"-C", "link-arg=/DEFAULTLIB:libcmt.lib",
	"-C", "link-arg=/DEFAULTLIB:ucrt.lib"
]
