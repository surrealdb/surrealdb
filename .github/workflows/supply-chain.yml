name: Supply chain security

run-name: "Supply chain security run '${{ github.head_ref || github.ref_name }}'"

on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/core/Cargo.toml
      - crates/sdk/Cargo.toml
      - build.rs
      - crates/sdk/build.rs
      - supply-chain/audits.toml
      - supply-chain/config.toml
      - supply-chain/imports.lock
      - .github/workflows/supply-chain.yml
    branches:
      - main
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/core/Cargo.toml
      - crates/sdk/Cargo.toml
      - build.rs
      - crates/sdk/build.rs
      - supply-chain/audits.toml
      - supply-chain/config.toml
      - supply-chain/imports.lock
      - .github/workflows/supply-chain.yml
  merge_group:

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Supply-chain jobs run dependency-analysis tools (cargo-deny, cargo-vet), not the
  # shipping build, so the toolchain just needs to build those tools.
  RUST_VERSION: 1.94.0

jobs:
  cargo-deny:
    name: Check dependencies for known issues
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        run: |
          CARGO_DENY_VERSION=0.19.0
          CARGO_DENY_TRIPLE=x86_64-unknown-linux-musl
          mkdir -p "$HOME/.cargo/bin"
          curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-${CARGO_DENY_TRIPLE}.tar.gz" | tar xz -C /tmp
          mv "/tmp/cargo-deny-${CARGO_DENY_VERSION}-${CARGO_DENY_TRIPLE}/cargo-deny" "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Check dependencies for known issues
        run: cargo deny check

      - name: Dependency check failure
        if: failure()
        run: |
          echo "## :warning: Supply chain security check failed" >> $GITHUB_STEP_SUMMARY
          echo "See instructions in the [supply chain security process](https://github.com/surrealdb/surrealdb/blob/main/supply-chain/README.md#Process)." >> $GITHUB_STEP_SUMMARY
  cargo-vet:
    name: Check dependencies for untrusted sources
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-vet
        run: cargo install --debug --locked cargo-vet

      - name: Check dependencies for untrusted sources
        run: cargo vet check

      - name: Dependency check failure
        if: failure()
        run: |
          echo "## :warning: Supply chain security check failed" >> $GITHUB_STEP_SUMMARY
          echo "See instructions in the [supply chain security process](https://github.com/surrealdb/surrealdb/blob/main/supply-chain/README.md#Process)." >> $GITHUB_STEP_SUMMARY
