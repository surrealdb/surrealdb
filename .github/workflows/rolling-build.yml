# Rolling build (engine)
#
# Builds and stores release-ready ENGINE artifacts for release branches (every
# push) and for the nightly (main) channel (once daily on a schedule), so a later
# release just *promotes* an existing build instead of rebuilding (build-once /
# promote-many).
#
# For each commit this workflow builds the branch's *channel* of engine artifacts
# (see rolling-channel.yml): the binary matrix (+ macOS universal), the scanned
# multi-arch Docker images in the private registry, and a
# rolling-builds/<slug>/<sha>/engine.json manifest. Each channel verifies the
# workspace crates package cleanly and that no publishable crate changed without a
# version bump; these gates run in parallel with the binary compile (the two slow
# jobs overlap) but every job that persists an artifact — the S3 upload and the
# Docker push — waits on them, as does the manifest. So a failed gate stores
# nothing and yields no manifest. The manifest is what marks a commit as
# releasable; the promote workflow refuses to release a commit that has no
# manifest.
#
# The downstream image is built by a SEPARATE workflow (rolling-downstream-build.yml)
# that also runs on push, and can additionally be triggered on its own so a
# downstream-only change becomes promotable without a new engine commit. The two
# sides write separate manifests (engine.json here, downstream.json there) keyed
# by the same commit, and are married at promote time.
#
# Channel (slug = the branch name):
#   * releases/* — every push builds that line's channel at the branch's
#     Cargo.toml version (alpha/beta/rc/stable), so any commit is promotable.
#   * main — the `nightly` channel is NOT built per push (only one nightly is
#     promoted per day). It is built on a schedule a few hours before the nightly
#     promote, and can also be dispatched manually. The nightly promote walks main
#     history for the newest built commit, so it doesn't need HEAD pre-built.
#   * A manual dispatch against any OTHER branch builds a throwaway test set: no
#     manifest is written (not promotable) and the artifacts are cleaned up after.
#
# Correctness is gated by ci.yml on the same commit, so this workflow does not
# re-run the quality/test matrix. It does NOT publish crates (crates.io versions
# are write-once; that happens only at release time).

name: Rolling build

run-name: "Rolling build (${{ github.ref_name }} @ ${{ inputs.git-sha || github.sha }})"

on:
  push:
    branches:
      - 'releases/*'
  # Nightly (main) channel: build once a day, a few hours ahead of the release
  # workflow's 00:00 UTC promote, so there's a buffer to notice and re-run a failed
  # build before promotion. main is deliberately NOT built per push.
  schedule:
    - cron: "0 20 * * *"
  # Manual build/rebuild: dispatch against the branch line and pass the exact
  # commit — or a branch/ref, which resolves to its tip — to (re)build. On main /
  # releases/* it reproduces (and overwrites) that commit's promotable artifacts.
  # On any other branch it is a throwaway test build — no manifest is written and
  # the artifacts are deleted afterwards. Omit git-sha to build the branch tip.
  workflow_dispatch:
    inputs:
      git-sha:
        # A branch/ref resolves to its tip. The artifact line/slug follows the
        # DISPATCHED ref, so pass a commit or ref that belongs to the branch you
        # dispatched against. Empty = the dispatched branch tip.
        description: 'Commit or branch to (re)build (empty = branch tip)'
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Keyed per COMMIT being built, not per branch: every commit on main / releases/*
# must produce its own complete, promotable artifact set, so distinct commits
# build in PARALLEL and never cancel or queue behind one another (the unit of
# promotion is the commit, not "the latest"). We key on the exact target commit
# (inputs.git-sha on a manual rebuild, else github.sha) rather than github.sha
# alone: on a workflow_dispatch github.sha is the branch TIP, so two rebuilds of
# different old commits would otherwise share a group and cancel each other.
# cancel-in-progress then only supersedes a redundant re-run of the SAME target.
concurrency:
  group: rolling-engine-${{ inputs.git-sha || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    if: ${{ github.repository == vars.PRIVATE_ENGINE_REPO }}
    runs-on: ubuntu-latest
    outputs:
      build-metadata: ${{ steps.vars.outputs.build-metadata }}
      channels: ${{ steps.channels.outputs.channels }}
      # Promotability, sha half: a build is only promotable when the commit it was
      # built from is reachable from a promotion line (main or a releases/* line).
      # A push/schedule/tip dispatch (no git-sha override) builds the dispatched
      # ref's own tip, whose release/main gating finalize already enforces — so it
      # is promotable without the (history-deepening) reachability check. Only an
      # explicit git-sha override can point at an off-line commit, so we verify
      # just that case. The workflow ref is gated separately in finalize.
      engine-promotable: ${{ inputs.git-sha == '' && 'true' || steps.promotable.outputs.promotable }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The pushed commit, or the exact sha/ref for a manual (re)build (a
          # branch resolves to its tip).
          ref: ${{ inputs.git-sha || github.sha }}

      - name: Derive rolling build vars
        id: vars
        uses: ./.github/actions/derive-rolling-vars

      # A manual dispatch may build an arbitrary commit for inspection, but it is
      # only promotable when that commit lives on a promotion line. Reachability
      # (not branch-name equality) is what's checked, so the dispatched workflow
      # ref and the built commit need not share a branch (a main dispatch may
      # rebuild a releases/3.2 commit and vice versa) and an older ancestor being
      # rebuilt still counts.
      #
      # This is duplicated (verbatim) in rolling-downstream-build.yml's prepare on
      # purpose: it must stay inline rather than become a shared local action. A
      # `uses: ./…` action is read from the checked-out tree, and prepare checks
      # out the target commit, so the action would be missing whenever an override
      # reproduces a commit that predates it (every current release). An inline
      # run: comes from the workflow definition, so it is always present.
      - name: Assert built commit is on a release line
        id: promotable
        if: ${{ inputs.git-sha != '' }}
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          # Ancestry tests need full history connecting the target commit to the
          # promotion lines; a rolling checkout is shallow, so deepen first (a
          # no-op if already complete), then bring in main + every releases/* tip.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --no-tags --quiet --unshallow origin 2>/dev/null \
              || git fetch --no-tags --quiet --deepen=2147483647 origin 2>/dev/null \
              || true
          fi
          git fetch --no-tags --quiet origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/releases/*:refs/remotes/origin/releases/*'
          promotable=false
          on=""
          for ref in $(git for-each-ref --format='%(refname)' \
            refs/remotes/origin/main 'refs/remotes/origin/releases/*'); do
            if git merge-base --is-ancestor "${SHA}" "${ref}" 2>/dev/null; then
              promotable=true
              on="${ref#refs/remotes/origin/}"
              break
            fi
          done
          if [ "${promotable}" = true ]; then
            echo "Commit ${SHA} is on '${on}' — promotable."
          else
            echo "::warning title=Rolling build::commit ${SHA} is not reachable from main or any releases/* line — building it for inspection but not marking it promotable."
          fi
          echo "promotable=${promotable}" >> "$GITHUB_OUTPUT"

      # The branch's own channel (nightly on main, the line's channel on
      # releases/*). version-override is empty so the binary keeps the
      # Cargo.toml version.
      - name: Assemble channels
        id: channels
        env:
          NAME: ${{ steps.vars.outputs.name }}
          SLUG: ${{ steps.vars.outputs.slug }}
          S3_PREFIX: ${{ steps.vars.outputs.s3-prefix }}
          VERSION: ${{ steps.vars.outputs.version }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          channels=$(jq -nc \
            --arg name "$NAME" \
            --arg slug "$SLUG" \
            --arg s3 "$S3_PREFIX" \
            --arg ver "$VERSION" \
            --arg label "$BRANCH" \
            --arg sha "$SHA" \
            '[{name:$name, versionOverride:"", slug:$slug, s3Prefix:$s3, version:$ver, label:$label, sha:$sha}]')
          echo "Channels for ${GITHUB_SHA}:"
          echo "$channels" | jq .
          echo "channels=${channels}" >> "$GITHUB_OUTPUT"

  # Build and store the channel's engine artifact set for this branch. The crate
  # packaging / version-drift gates run INSIDE this channel (rolling-channel.yml)
  # in parallel with the binary compile — the two slow jobs overlap instead of
  # running back-to-back. The gates don't block the compile, but every persisting
  # job (S3 upload, Docker push) and the engine.json manifest do wait on them, so
  # an un-bumped or unpackageable crate never gets artifacts stored anywhere and
  # can never be promoted.
  channels:
    name: Build ${{ matrix.channel.label }}
    if: ${{ github.repository == vars.PRIVATE_ENGINE_REPO }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.prepare.outputs.channels) }}
    uses: ./.github/workflows/rolling-channel.yml
    with:
      name: ${{ matrix.channel.name }}
      build-metadata: ${{ needs.prepare.outputs.build-metadata }}
      version-override: ${{ matrix.channel.versionOverride }}
      branch-slug: ${{ matrix.channel.slug }}
      branch: ${{ matrix.channel.label }}
      s3-prefix: ${{ matrix.channel.s3Prefix }}
      release-version: ${{ matrix.channel.version }}
      git-ref: ${{ matrix.channel.sha }}
      # Sha half of promotability (see prepare): gates whether this channel may
      # write engine.json. The workflow ref half is gated inside the channel.
      engine-promotable: ${{ needs.prepare.outputs.engine-promotable }}
    secrets: inherit
