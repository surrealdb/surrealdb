name: Nightly benchmark

on:
  #push:
  #  branches:
  #    - main
  #pull_request:
  #  types:
  #    - opened
  #    - synchronize
  #    - reopened

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *" # Run every night at 12 a clock

defaults:
  run:
    shell: bash

# sccache → S3 backend, consumed by setup-environment's daemon-start step
# (env-style configuration; call sites may pass the same values as inputs).
env:
  SCCACHE_BUCKET: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_KEY_PREFIX: ${{ github.repository }}
  SCCACHE_IDLE_TIMEOUT: "0"
  # Dedicated bucket-scoped creds, not the release-publishing AMAZON_* keys.
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

jobs:
  bench:
    name: Nightly benchmark
    runs-on: runner-arm-bench
    if: ${{ github.repository == vars.PRIVATE_ENGINE_REPO }}
    timeout-minutes: 240
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Build language bench suite
        run: |
          cd language-tests

          cargo build --locked --release --features bench,bench-remote-store

      # The harness pins the HNSW graph seed itself, so the ANN benches build the
      # same graph here as in a local `cargo make bench` and their run-to-run
      # spread reflects timing noise rather than graph-construction variance.
      # Export `SURREAL_HNSW_BUILD_SEED` on this step to override it for a run.
      - name: Run language suite
        run: |
          sudo ./.github/scripts/quiet_system.py ./language-tests/target/release/surrealql-test bench \
            --store-url ${{ secrets.BENCH_DS_URL }} \
            --store-user ${{ secrets.BENCH_DS_USER }} \
            --store-password ${{ secrets.BENCH_DS_PASS }} \
            run \
            --path language-tests/tests \
            --save

  # Slow regression for https://github.com/surrealdb/surrealdb/issues/7318
  # (DiskANN KNN race after CONCURRENTLY build). Marked `#[ignore]` because it
  # takes ~1 min; runs nightly so future refactors of the DiskANN compaction
  # path don't silently re-introduce the race.
  regression-7318:
    name: DiskANN #7318 regression
    runs-on: ubuntu-latest-8-cores
    if: ${{ github.repository == vars.PRIVATE_ENGINE_REPO }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-cache: false
          free-disk-space: 'false'

      - name: Run reproduction test
        run: |
          cargo test --locked -p surreal --release --no-default-features \
            --features 'storage-mem,http' \
            --test reproduce_issue_7318 -- --ignored --nocapture
