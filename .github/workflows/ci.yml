name: CI

run-name: "CI run '${{ github.head_ref || github.ref_name }}'"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:

concurrency:
  # Superseded automatic main/branch/PR runs should release runner capacity.
  # Explicit workflow_dispatch validations remain independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Build/test lanes use the pinned nightly parallel frontend. MSRV and Clippy
  # keep the stable compatibility/lint signal; shipping workflows use stable.
  # ----------------------------------------
  # Server build
  # ----------------------------------------

  # Classifies the change set so docs-only pull requests skip the compile and
  # test jobs. Any API failure leaves `docs_only` false, which runs everything.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Markdown inside a crate can be compiled into rustdoc (`include_str!`), so
      # only top-level Markdown, doc/, docs/, img/ and LICENSE count as docs.
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [[ -n "$PR" ]]; then
            if files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
              if [[ -n "$files" ]] && ! grep -qvE '(^(doc|docs|img)/|^LICENSE$|^[^/]+\.md$)' <<<"$files"; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Every consumer of this job's binary runs on arm on pull requests, and the
  # job gates all of them, so an amd64 leg there would hold them back for a
  # binary none of them uses. push and merge_group build both, as the amd
  # upgrade lanes run there.
  build:
    name: Build binary (${{ matrix.arch == 'arm' && 'arm64' || 'amd64' }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
    env:
      TARGET: ${{ matrix.arch == 'arm' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      ARTIFACT_ARCH: ${{ matrix.arch == 'arm' && 'arm64' || 'amd64' }}
      # Verbose cache tracing on the branches whose cache behaviour is worth
      # inspecting. kache writes it to stderr, so it lands in the build step's
      # own log; empty leaves the action's default filter in place.
      KACHE_LOG: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'kache=debug' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          # The WASI target is needed to pack the Surrealism demo module below.
          targets: wasm32-wasip2
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        # `devopt` rather than `dev`: this binary is what the SDK, upgrade,
        # conformance and MCP lanes execute, so it is built with optimised
        # workspace code and RocksDB (see `[profile.devopt]` in Cargo.toml).
        # Consumers download the single file to `target/debug` and are
        # indifferent to the profile it was built in.
        run: cargo build --locked --profile devopt --target ${{ env.TARGET }}

      - name: Upload artifact
        id: upload-surreal
        background: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # (Actions must be pinned by commit hash) v7.0.1
        with:
          name: surreal-${{ env.ARTIFACT_ARCH }}
          path: target/${{ env.TARGET }}/devopt/surreal

      # rust-toolchain.toml pins the toolchain every cargo invocation resolves
      # to, which is not the one the setup action installs targets for, so the
      # WASI target has to be added to the pinned toolchain as well.
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      # The Surrealism demo archive is the fixture the conformance suite loads
      # via `DEFINE MODULE`. Every leg packs it: the archive itself is a WASM
      # component and so portable, but packing exercises host-architecture code
      # paths — compiling the guest's C dependencies for wasm32, and running the
      # component through wasmtime to extract its exports — so each architecture
      # covers its own. Packing here also keeps a failure attached to a job the
      # required-checks gate already watches, and keeps the conformance job free
      # of a Rust toolchain.
      - name: Pack Surrealism demo module
        run: >-
          target/${{ env.TARGET }}/devopt/surreal module build --debug
          -o ${{ github.workspace }}/demo.surli surrealism/demo

      - name: Upload Surrealism demo module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # (Actions must be pinned by commit hash) v7.0.1
        with:
          name: demo-surli-${{ env.ARTIFACT_ARCH }}
          path: demo.surli

      - name: kache stats
        if: ${{ always() }}
        run: kache stats || true

      - name: Wait for the binary upload
        wait: upload-surreal

  # ----------------------------------------
  # Code quality checks
  # ----------------------------------------

  format:
    name: Check format
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-4-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lookup the nightly toolchain
        id: info
        run: |
          set -x
          echo "toolchain=$(cat rust-toolchain.nightly)" >> $GITHUB_OUTPUT

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          toolchain: ${{ steps.info.outputs.toolchain }}
          components: rustfmt
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          enable-kache: "false"

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Check format
        run: cargo make ci-fmt

  clippy:
    name: Check clippy (debug)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          components: clippy
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Run clippy
        run: cargo make ci-clippy

      - name: Run clippy (surrealism off)
        run: cargo make ci-clippy-no-surrealism

  clippy-release:
    name: Check clippy (release)
    needs: changes
    if: (github.ref == 'refs/heads/main') && needs.changes.outputs.docs_only != 'true'
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          components: clippy
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Run clippy release
        run: cargo make ci-clippy-release

  miri:
    name: Test unsafe code with miri
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          toolchain: nightly
          components: miri
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run miri
        run: cargo +nightly miri test --locked -p surrealdb-common --lib

  check-debug:
    name: Check workspace (debug)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          targets: wasm32-unknown-unknown
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Validate nightly build helpers
        run: python3 scripts/tests/test-nightly-build.py

      - name: Check workspace
        run: cargo make ci-check

  check-release:
    name: Check workspace (release)
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'merge_group') && needs.changes.outputs.docs_only != 'true'
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Check workspace release
        run: cargo make ci-check-release

  check-msrv:
    name: Check workspace (MSRV)
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    env:
      msrv: "1.95" # This should be updated if the MSRV is updated.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          toolchain: ${{ env.msrv }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-make
        run: cargo +${{ env.msrv }} install --debug --locked cargo-make

      - name: Check workspace on MSRV
        run: cargo +${{ env.msrv }} make ci-check

  check-wasm:
    name: Check Wasm
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          components: clippy
          targets: wasm32-unknown-unknown
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Check wasm
        run: cargo make ci-check-wasm

  test-wasm:
    name: Test Wasm (IndexedDB)
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    # GitHub-hosted runner: Chrome and chromedriver come preinstalled, which
    # the wasm-bindgen-test browser harness needs.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          targets: wasm32-unknown-unknown
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        run: cargo install --locked wasm-pack@=0.15.0

      - name: Test the IndexedDB backend in headless Chrome
        working-directory: surrealdb/kvs-indxdb
        run: wasm-pack test --headless --chrome

  check-revision:
    name: Check revision
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-4-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          enable-kache: "false"

      - name: Install revision-lock
        run: cargo install revision-lock --version 0.2.0 --locked

      - name: Check revision.lock
        run: revision-lock --check

  check-catalog-schema:
    name: Check catalog schema
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      # The base branch's lock is the earlier lock a pull request's numbering is held to. A base
      # without a lock leaves the variable unset, and only the committed lock is checked.
      - name: Fetch the base branch's catalog schema lock
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git show "FETCH_HEAD:surrealdb/catalog/catalog-schema.lock" > "$RUNNER_TEMP/base.lock"; then
            echo "CATALOG_SCHEMA_BASE=$RUNNER_TEMP/base.lock" >> "$GITHUB_ENV"
          else
            echo "The base branch has no catalog schema lock; checking the committed lock only."
          fi

      - name: Check the catalog schema lock
        run: cargo make ci-catalog-schema

  check-docs:
    name: Check docs
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Check docs
        run: cargo make ci-docs

      - name: Run doctests
        run: cargo make ci-doctests

  parser:
    name: Check SurrealQL parser
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Check the parser's golden corpus and invariants
        run: cargo make ci-parser

  feature-check:
    name: Check feature combinations (${{ matrix.package }})
    needs: changes
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.docs_only != 'true'
    # Each package gets its own target directory/runner. The old aggregate
    # spawned nine Cargo processes against one target directory, serializing
    # on the build lock and repeatedly replacing each other's feature variants.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: [sdk, engine-local, core, server, kvs, kvs-any, datastore, runtime, idx, types, expr]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          kache-manifest-key: feature-check-${{ matrix.package }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-make,cargo-hack

      - name: Check feature combinations
        run: cargo make "ci-feature-check-$FEATURE_PACKAGE"
        env:
          FEATURE_PACKAGE: ${{ matrix.package }}

  unused-deps:
    name: Check unused dependencies
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-4-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          enable-kache: "false"

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Install cargo-machete
        run: cargo install --locked cargo-machete

      - name: Check unused dependencies
        run: cargo make ci-unused-deps

  check-versions:
    name: Check crate versions
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          # This job only runs `cargo package --no-verify`, which compiles
          # nothing, so the compile cache would never be exercised (like the other
          # no-compile jobs above).
          enable-kache: "false"

      # Catches PRs that change a published crate (e.g. surrealism, surrealml)
      # without bumping its version, so it's surfaced at review time instead of
      # only on main / at release time. Reads crates.io only (no secrets), so
      # this also runs on fork PRs.
      - name: Check crate versions
        uses: ./.github/actions/check-crate-versions

  # ----------------------------------------
  # Lockfile freshness
  # ----------------------------------------

  # The only `--locked` assertion in CI that is guaranteed to be about the
  # commit. Every other one is sequenced after the shared setup action, whose
  # cache step resolves each workspace it is handed without `--locked` and so
  # rewrites a stale lockfile before the assertion reads it. This job therefore
  # runs bare — no setup action, no cache, no other cargo step — and resolves
  # only, so it covers every workspace in the repository in seconds.
  check-lockfiles:
    name: Check lockfiles
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Check every lockfile satisfies its manifests
        run: ./.github/scripts/check-lockfiles.sh

  # ----------------------------------------
  # PostgreSQL front end
  # ----------------------------------------

  pgsql:
    name: PostgreSQL front-end checks
    runs-on: runner-arm-4-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          # This task includes Clippy; keep lint behavior on stable.
          components: clippy
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          targets: wasm32-unknown-unknown
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Run surrealdb-pgsql CI checks
        run: cargo make ci-pgsql

      - name: Run wire protocol integration tests
        run: cargo make ci-wire

  # ----------------------------------------
  # Integration tests
  # ----------------------------------------

  integration-tests:
    name: Integration tests (${{ matrix.arch }})
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # ARM on every trigger; amd64 added only on merge-queue and push.
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          preset: test

      - name: Run integration tests
        run: cargo make ci-integration-all

      - name: kache stats
        if: success() || failure()
        run: kache stats || true

  # ----------------------------------------
  # Workspace tests
  # ----------------------------------------

  # The workspace tests are compiled once into a nextest archive and the
  # archive is run in shards, so the compile is paid once per architecture
  # instead of once per shard.
  test-build:
    name: Build workspace tests (${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build workspace test archive
        uses: ./.github/actions/test-workspace
        with:
          task: ci-workspace-test-archive
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload workspace test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # (Actions must be pinned by commit hash) v7.0.1
        with:
          name: workspace-tests-${{ matrix.arch }}
          path: target/workspace-tests.tar.zst
          retention-days: 1
          compression-level: 0

  test:
    name: Test workspace (${{ matrix.arch }}, shard ${{ matrix.shard }}/3)
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    needs: [test-build, changes]
    env:
      RUST_MIN_STACK: "8388608" # 8 MiB — some debug tests overflow nextest's default thread stack
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: "3"
    # ARM on every trigger; amd64 added only on merge-queue and push to main.
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
        shard: [1, 2, 3]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain and the wasm target stay: the Surrealism tests build the
      # demo module with cargo when the setup script cannot reuse one.
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          targets: wasm32-wasip2

      - parallel:
          - name: Install wasm32-wasip2 target
            run: rustup target add wasm32-wasip2

          - name: Install tools
            uses: ./.github/actions/install-tools
            with:
              preset: test

          - name: Download workspace test archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: workspace-tests-${{ matrix.arch }}
              path: target

      - name: Run workspace tests
        run: cargo make ci-workspace-test-run

  # The `cjk-embed-*` features are off in every other lane, so the segmentation
  # tests behind them are built nowhere else — `Check features` only runs
  # `cargo check`, which does not build test code. This lane is what makes them
  # run at all. It is separate because enabling the features makes each
  # dictionary crate download its dictionary at build time.
  test-cjk:
    name: Test CJK segmentation
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          preset: test

      - name: Test CJK segmentation
        run: cargo make ci-cjk-test

  # ----------------------------------------
  # Storage engine tests
  # ----------------------------------------

  kvs-engines:
    name: KVS - ${{ matrix.engine }} engine (${{ matrix.arch }})
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
        # RocksDB is three legs: each of its test suites resolves a different
        # feature set for the C++ library, which cargo rebuilds for every one, so
        # one leg running them in turn takes ~3x the others. See `ci-kvs-rocksdb-*`.
        engine: [mem, rocksdb-core, rocksdb-store, rocksdb-idx, surrealkv, tikv]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-key: kvs
          # Each engine compiles its own feature set, and the manifest default
          # cannot see the matrix - without this the legs overwrite each other's
          # manifest and the next run prefetches whichever finished last.
          kache-manifest-key: kvs-${{ matrix.engine }}-${{ matrix.arch }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest,cargo-make

      - name: Setup databases
        uses: ./.github/actions/setup-databases
        with:
          tikv: ${{ matrix.engine == 'tikv' }}

      - name: Test engine
        run: cargo make ci-kvs-${{ matrix.engine }}

  # ----------------------------------------
  # Rust SDK tests
  # ----------------------------------------

  sdk-build:
    name: Test SDK build
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-4-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build local
        working-directory: tests/sdk/local
        run: cargo build --locked

      - name: Build remote
        working-directory: tests/sdk/remote
        run: cargo build --locked

  sdk-engines:
    name: Rust SDK - ${{ matrix.engine }} engine
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [mem, rocksdb, surrealkv, tikv]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          # Engine-independent deps (see kvs-engines) — one shared cache key.
          cache-key: sdk
          # The compiled artifacts are not engine-independent, so the manifest
          # is scoped per engine (see kvs-engines).
          kache-manifest-key: sdk-${{ matrix.engine }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest,cargo-make

      - name: Setup databases
        uses: ./.github/actions/setup-databases
        with:
          tikv: ${{ matrix.engine == 'tikv' }}

      - name: Test engine
        run: cargo make ci-api-integration-${{ matrix.engine }}

  # The `any`, `ws` and `http` legs talk to a locally started server. They run
  # the `surreal` binary the `build` job produced instead of compiling a
  # second copy of the engine.
  sdk-engines-server:
    name: Rust SDK - ${{ matrix.engine }} engine
    needs: [build, changes]
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [any, ws, http]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          # Engine-independent deps (see kvs-engines) — one shared cache key.
          cache-key: sdk
          # The compiled artifacts are not engine-independent, so the manifest
          # is scoped per engine (see kvs-engines).
          kache-manifest-key: sdk-${{ matrix.engine }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest,cargo-make

      - name: Setup databases
        uses: ./.github/actions/setup-databases
        with:
          tikv: ${{ matrix.engine == 'tikv' }}

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surreal-arm64
          path: target/debug

      - name: Set file permissions
        run: chmod +x target/debug/surreal

      - name: Test engine
        env:
          # Makes `build-surrealdb` a no-op: target/debug/surreal is already there.
          _PREBUILT_SURREAL: "1"
        run: cargo make ci-api-integration-${{ matrix.engine }}

  # ----------------------------------------
  # SurrealQL language tests
  # ----------------------------------------

  lang-tests:
    name: Language tests - ${{ matrix.engine }} (${{ matrix.arch }})
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
        # tikv takes ~30-45 min, far longer than the other engines, so it's
        # excluded from pull_request and merge_group and only runs post-merge.
        engine: ${{ github.event_name == 'push' && fromJSON('["mem", "surrealkv", "rocksdb", "tikv"]') || fromJSON('["mem", "surrealkv", "rocksdb"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          workspaces: language-tests
          # Engine-independent deps (see kvs-engines) — one shared cache key.
          cache-key: lang
          # The compiled artifacts are not engine-independent, so the manifest
          # is scoped per engine (see kvs-engines).
          kache-manifest-key: lang-${{ matrix.engine }}-${{ matrix.arch }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          # Coverage (and thus cargo-llvm-cov) only on the arm mem leg; the
          # amd mem leg runs the plain test task to avoid a duplicate upload.
          tools: ${{ (matrix.engine == 'mem' && matrix.arch == 'arm') && 'cargo-make,cargo-llvm-cov' || 'cargo-make' }}

      - name: Setup databases
        uses: ./.github/actions/setup-databases
        with:
          tikv: ${{ matrix.engine == 'tikv' }}

      - name: Run language tests
        if: matrix.engine != 'mem' || matrix.arch != 'arm'
        run: cargo make ci-lang-test-${{ matrix.engine }}

      - name: Run language tests with coverage
        if: matrix.engine == 'mem' && matrix.arch == 'arm'
        run: cargo make ci-lang-test-coverage

      - name: Upload language test coverage to Codecov
        if: matrix.engine == 'mem' && matrix.arch == 'arm'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # (Actions must be pinned by commit hash) v7.0.0
        with:
          files: language-tests-lcov.info
          # The report's contents are validated by `ci-lang-test-coverage`
          # before this step runs, so a coverage regression fails there rather
          # than here. This step is best-effort delivery of an already-checked
          # artifact, and does not gate the job.
          fail_ci_if_error: false
          flags: language-tests
          name: language-test-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # NOTE: language tests over a remote --endpoint need a server to point at and
  # are destructive to it, so they are a manual-only workflow rather than a job
  # here. See .github/workflows/lang-tests-remote.yml.

  # ----------------------------------------
  # SurrealQL language upgrade tests
  # ----------------------------------------

  # The harness is compiled apart from the lanes that run it. Compiling it takes
  # as long as the `build` job does and needs nothing from that job's binary, so
  # it runs alongside and the lane starts with the harness already in hand.
  upgrade-harness:
    name: Upgrade test harness - ${{ matrix.engine }} (${{ matrix.arch }})
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
        engine: [surrealkv, rocksdb]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          workspaces: language-tests
          # Engine-independent deps (see kvs-engines) — one shared cache key.
          cache-key: lang-upgrade-harness
          # The compiled artifacts are not engine-independent, so the manifest
          # is scoped per engine (see kvs-engines).
          kache-manifest-key: lang-upgrade-harness-${{ matrix.engine }}-${{ matrix.arch }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-make

      # Builds the harness, then runs its own unit tests. The binary is uploaded
      # once the unit tests have passed, so a lane never runs a harness that
      # failed them.
      - name: Build and test the harness
        run: cargo make ci-lang-upgrade-harness-${{ matrix.engine }}

      - name: Upload harness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # (Actions must be pinned by commit hash) v7.0.1
        with:
          name: upgrade-harness-${{ matrix.engine }}-${{ matrix.arch }}
          path: language-tests/target/debug/surrealql-test
          if-no-files-found: error

  upgrade-tests:
    name: Upgrade tests - ${{ matrix.engine }} (${{ matrix.arch }})
    needs: [build, upgrade-harness, changes]
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-${{ matrix.arch }}-32-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && fromJSON('["arm","amd"]') || fromJSON('["arm"]') }}
        engine: [surrealkv, rocksdb]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          # The WASI target is needed to build the Surrealism module the upgrade
          # tests load through DEFINE MODULE.
          targets: wasm32-wasip2
          cache-key: lang-upgrade
          kache-manifest-key: lang-upgrade-${{ matrix.engine }}-${{ matrix.arch }}

      - name: Resolve upgrade version chain
        id: vers
        run: |
          # Extract the version chains, then translate their ',' and ';'
          # separators to '_' so the value is usable inside an `actions/cache`
          # key (which forbids commas).
          extract() {
            grep -E "^$1 = " Makefile.ci.toml \
              | sed -E 's/.*value = "([^"]+)".*/\1/' \
              | tr ',;' '__'
          }
          # All three lists name binaries the run downloads, so all three belong in the key.
          echo "chain=$(extract LANG_UPGRADE_VERSIONS)_$(extract LANG_UPGRADE_SEEDS)_$(extract LANG_UPGRADE_CHAIN)" >> "$GITHUB_OUTPUT"

      - name: Cache upgrade binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # (Actions must be pinned by commit hash) v6.1.0
        with:
          # Pre-built surreal-vX.Y.Z tarballs from download.surrealdb.com.
          # Release tarballs are immutable, so stale-key restores are safe.
          path: language-tests/.binary_cache
          key: lang-upgrade-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vers.outputs.chain }}
          restore-keys: |
            lang-upgrade-binaries-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-make

      # rust-toolchain.toml pins the toolchain every cargo invocation resolves
      # to, which is not the one the setup action installs targets for, so the
      # WASI target has to be added to the pinned toolchain as well.
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      # The current checkout's binary is the one the `build` job produced, so the
      # harness does not compile the engine a second time.
      - name: Download current binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surreal-${{ matrix.arch == 'arm' && 'arm64' || 'amd64' }}
          path: target/debug

      - name: Set file permissions
        run: chmod +x target/debug/surreal

      # Compiled by `upgrade-harness`, which runs while `build` does.
      - name: Download harness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgrade-harness-${{ matrix.engine }}-${{ matrix.arch }}
          path: language-tests/target/debug

      - name: Set harness permissions
        run: chmod +x language-tests/target/debug/surrealql-test

      - name: Run language upgrade tests
        env:
          LANG_UPGRADE_PREBUILT_CURRENT: "1"
        run: cargo make ci-lang-upgrade-run-${{ matrix.engine }}

  # ----------------------------------------
  # Tokio-console feature check
  # ----------------------------------------

  check-tokio-console:
    name: Check tokio-console feature
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    env:
      RUSTFLAGS: -D warnings --cfg tokio_unstable
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Check tokio-console feature
        run: cargo check --locked --package surrealdb-server --features tokio-console

  # ----------------------------------------
  # Language-test bench harness
  # ----------------------------------------

  # The `bench`/`bench-remote-store` features build a separate binary (the
  # `Benchmark PR` workflow) that nothing else in CI compiles, so a break there
  # would otherwise go unnoticed until that label-gated job runs. `cargo check`
  # in debug catches a broken build far cheaper than the full release build
  # the benchmark job needs to actually run benches.
  check-bench:
    name: Check language-test bench harness
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          workspaces: language-tests
          cache-key: lang-bench

      - name: Check bench harness compiles
        run: cargo check --locked --features bench,bench-remote-store --manifest-path language-tests/Cargo.toml

  # ----------------------------------------
  # JS SDK conformance suite
  # ----------------------------------------

  conformance-tests:
    name: Conformance tests
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    needs: [build, changes]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surreal-arm64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Download Surrealism demo module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-surli-arm64
          path: ${{ github.workspace }}/artifacts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tests/conformance-js
        run: bun install --frozen-lockfile

      # The downloaded server is a debug build, so its per-request startup is
      # slow enough that the default 5s test timeout flakes under the suite's
      # parallel per-file servers; 30s is generous headroom, not a real budget.
      - name: Run conformance suite
        working-directory: tests/conformance-js
        env:
          SURREAL_BIN: ${{ github.workspace }}/artifacts/surreal
          SURREAL_DEMO_SURLI: ${{ github.workspace }}/artifacts/demo.surli
        run: bun test --timeout 30000

  # ----------------------------------------
  # MCP server
  # ----------------------------------------

  # The MCP server needs a job of its own. The workspace test tasks run with
  # `--no-default-features`, which leaves `surrealdb-mcp/server-http` off and so
  # compiles the HTTP-transport and audit test files — both gated on that
  # feature — down to empty binaries. The Rust half here runs those suites with
  # the transports actually enabled. The JS half drives the built server through
  # the official MCP TypeScript SDK, covering the advertised tool surface and
  # the protocol-version negotiation matrix against a real client rather than
  # against our own in-process assumptions.
  mcp-tests:
    name: MCP tests
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    needs: [build, changes]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          preset: test

      - name: Run MCP crate tests
        run: cargo make ci-mcp-test

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surreal-arm64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: tests/mcp-js
        run: bun install --frozen-lockfile

      # Each test file spawns its own debug-build server and waits for /health
      # in a `beforeAll`, so the per-test timeout has to cover process startup
      # on a loaded runner, not just a request. 60s is headroom for that hook,
      # not a real budget — the suite settles in well under a minute.
      - name: Run MCP conformance suite
        working-directory: tests/mcp-js
        env:
          SURREAL_BIN: ${{ github.workspace }}/artifacts/surreal
        run: bun test --timeout 90000

  # ----------------------------------------
  # Embedded Node.js engine
  # ----------------------------------------

  # Builds the `@surrealdb/node-native` NAPI addon for the host platform and
  # drives the built package directly — the SDK engine that wraps it lives in the
  # surrealdb.js repository. The addon is published from this repo alongside the
  # engine it embeds, so a change that breaks it has to fail here rather than at
  # release time.
  node-engine:
    name: Node engine
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          # The addon is a release build into its own target triple directory,
          # so it shares nothing with the debug-profile jobs.
          cache-key: node

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: surrealdb/node
        run: bun install --frozen-lockfile

      - name: Build the addon
        working-directory: surrealdb/node
        run: bun run build

      - name: Test the addon
        working-directory: surrealdb/node
        run: bun test

  wasm-engine:
    name: Wasm engine
    needs: changes
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: runner-arm-16-cores${{ github.event_name == 'pull_request' && '-spot' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          toolchain: build-nightly
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          targets: wasm32-unknown-unknown
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          # The module is a release build into its own target triple directory,
          # so it shares nothing with the debug-profile jobs.
          cache-key: wasm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The CLI and the wasm-bindgen crate share a bindgen schema that changes
      # between patch releases, so the version comes from the lockfile — the
      # same source `build.ts` checks against before it runs.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "Installing wasm-bindgen-cli $version"
          cargo install --locked -f wasm-bindgen-cli --version "$version"

      - name: Install wasm-opt
        run: cargo install --locked wasm-opt --version 0.116.1

      - name: Install dependencies
        working-directory: surrealdb/wasm
        run: bun install --frozen-lockfile

      - name: Build the module
        working-directory: surrealdb/wasm
        run: bun run build

      - name: Test the module
        working-directory: surrealdb/wasm
        run: bun test

  # ----------------------------------------
  # Required checks
  # ----------------------------------------

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    # !cancelled() so the gate runs even when some needs are skipped (e.g. the
    # main-only jobs on a PR). success() || failure() evaluates to false when a
    # need is skipped — which skips this aggregator and leaves the required
    # check unreported on both PRs and merge_group runs. The step below treats
    # skipped needs as success.
    if: ${{ !cancelled() }}
    needs:
      # Change classification
      - changes
      # Server build
      - build
      # Quality checks
      - format
      - clippy
      - clippy-release
      - check-debug
      - check-release
      - check-msrv
      - check-wasm
      - test-wasm
      - check-revision
      - check-catalog-schema
      - check-docs
      - parser
      - feature-check
      - check-tokio-console
      - check-bench
      - unused-deps
      - check-versions
      - check-lockfiles
      # Integration tests
      - integration-tests
      # Workspace tests
      - test-build
      - test
      # SDK tests
      - sdk-build
      - sdk-engines
      - sdk-engines-server
      # KVS tests
      - kvs-engines
      # SurrealQL language tests
      - lang-tests
      - upgrade-harness
      - upgrade-tests
      # JS SDK conformance
      - conformance-tests
      # MCP server
      - mcp-tests
      # Embedded Node.js engine
      - node-engine
      # Embedded browser engine
      - wasm-engine
      # PostgreSQL front end
      - pgsql
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check for failures
        run: |
          echo "Checking results of all required jobs..."

          # List of all job results
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.build.result }}"
            "${{ needs.format.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.clippy-release.result }}"
            "${{ needs.check-debug.result }}"
            "${{ needs.check-release.result }}"
            "${{ needs.check-msrv.result }}"
            "${{ needs.check-wasm.result }}"
            "${{ needs.test-wasm.result }}"
            "${{ needs.check-revision.result }}"
            "${{ needs.check-catalog-schema.result }}"
            "${{ needs.check-docs.result }}"
            "${{ needs.parser.result }}"
            "${{ needs.feature-check.result }}"
            "${{ needs.check-tokio-console.result }}"
            "${{ needs.check-bench.result }}"
            "${{ needs.unused-deps.result }}"
            "${{ needs.check-versions.result }}"
            "${{ needs.check-lockfiles.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.test-build.result }}"
            "${{ needs.test.result }}"
            "${{ needs.sdk-build.result }}"
            "${{ needs.sdk-engines.result }}"
            "${{ needs.sdk-engines-server.result }}"
            "${{ needs.kvs-engines.result }}"
            "${{ needs.lang-tests.result }}"
            "${{ needs.upgrade-harness.result }}"
            "${{ needs.upgrade-tests.result }}"
            "${{ needs.conformance-tests.result }}"
            "${{ needs.mcp-tests.result }}"
            "${{ needs.node-engine.result }}"
            "${{ needs.wasm-engine.result }}"
            "${{ needs.pgsql.result }}"
          )

          # Check if any job failed (skipped is ok for conditional jobs)
          failed=false
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ A required job had result: $result"
              failed=true
            fi
          done

          # pgsql must succeed on every run (skipped is NOT allowed)
          if [[ "${{ needs.pgsql.result }}" != "success" ]]; then
            echo "❌ pgsql check did not succeed: ${{ needs.pgsql.result }}"
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            echo "❌ One or more required checks failed"
            exit 1
          else
            echo "✅ All required CI checks have passed successfully!"
          fi
