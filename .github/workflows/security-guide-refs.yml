# SECURITY_GUIDE.md reference check
#
# SECURITY_GUIDE.md names the modules, files, functions and constants that enforce
# each security invariant, so a reviewer can find the enforcement point. When code
# is renamed or moved and the guide is not updated, the invariant keeps reading as
# a requirement while pointing at nothing, and quietly stops being reviewed.
#
# This job resolves every Rust file path and code identifier in the guide against
# the tree and fails when one no longer exists. Deliberate exceptions live in
# .github/security-guide-refs-allow.txt. It reads only checked-out files.

name: Security guide refs

run-name: "Security guide refs '${{ github.head_ref || github.ref_name }}'"

on:
  pull_request:
    paths:
      - "SECURITY_GUIDE.md"
      - ".github/scripts/check-security-guide-refs.py"
      - ".github/security-guide-refs-allow.txt"
      - ".github/workflows/security-guide-refs.yml"
      - "surrealdb/**/*.rs"
      - "surrealism/**/*.rs"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: security-guide-refs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check guide references resolve
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve references
        run: python3 .github/scripts/check-security-guide-refs.py
