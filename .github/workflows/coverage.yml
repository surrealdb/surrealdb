name: Coverage

run-name: "Coverage report for ${{ github.ref_name }}"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run coverage on'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: Generate coverage report
    runs-on: [ runner-arm-32-cores ]
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-cache: false

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-llvm-cov,cargo-nextest,cargo-make
          # Use cargo install to avoid taiki-e/install-action needing sudo (unzip) on self-hosted runner
          use-cargo-install: true

      - name: Generate coverage report
        run: cargo make ci-workspace-coverage-with-server

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.ref_name }}-${{ github.sha }}
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # (Actions must be pinned by commit hash) v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          flags: workspace-tests
          name: coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
