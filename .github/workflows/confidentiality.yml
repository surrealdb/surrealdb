# Confidentiality guard
#
# Scans every PR for confidential strings (see .github/scripts/check-
# confidentiality.sh) so nothing that must stay private can be merged into a
# branch that is mirrored to the public engine repo. Squash-merging keeps a
# fixed-up PR out of the permanent history.
#
# The denylist is built from repository secrets and variables at runtime; this
# workflow names nothing confidential itself. It runs only on the private
# engine repo and fails closed if the terms are unavailable.

name: Confidentiality

run-name: "Confidentiality '${{ github.head_ref || github.ref_name }}'"

on:
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: confidentiality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for confidential references
    if: ${{ github.repository == vars.PRIVATE_ENGINE_REPO }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files
        env:
          AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          CONFIDENTIAL_TERMS: ${{ vars.CONFIDENTIAL_TERMS }}
        run: .github/scripts/check-confidentiality.sh
