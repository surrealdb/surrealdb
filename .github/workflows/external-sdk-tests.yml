name: SDKs

# Exercise external SDK repos against a freshly built surreal binary.
# Runs on the org's amd64 spot runners against an amd64 surreal binary.
# Not in PR required checks.

on:
  workflow_dispatch:
    inputs:
      surrealdb-js-ref:
        description: "The surrealdb.js ref to test the embedded engine against"
        required: false
        default: main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ----------------------------------------
  # Server build (shared by SDK matrices)
  # ----------------------------------------

  build:
    name: Build binary (amd64)
    runs-on: runner-amd-16-cores-spot
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          # The kache S3 backend shared with the rest of CI. Empty on fork PRs,
          # which then compile against a runner-local store.
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --locked --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # (Actions must be pinned by commit hash) v7.0.1
        with:
          name: surreal-amd64
          path: target/x86_64-unknown-linux-gnu/debug/surreal

  sdk-javascript:
    name: SDK - JavaScript (${{ matrix.version }}, ${{ matrix.protocol }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - latest
        protocol:
          - http
          - ws
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.js"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # (Actions must be pinned by commit hash) v8.0.1
        with:
          name: surreal-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup JavaScript
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}

      - name: Install dependencies
        run: bun install

      - name: Run JavaScript tests (${{ matrix.protocol }})
        run: bun test --timeout 10000 --reporter=junit --reporter-outfile=junit.xml
        env:
          SURREAL_PROTOCOL: ${{ matrix.protocol }}
          SURREAL_EXECUTABLE_PATH: ${{ github.workspace }}/artifacts/surreal

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          report_paths: junit.xml
          check_name: JS SDK Test Report (${{ matrix.version }} / ${{ matrix.protocol }})
          detailed_summary: true
          include_passed: false
          include_skipped: false
          group_suite: true
          skip_success_summary: true

  sdk-golang:
    name: SDK - Golang (${{ matrix.version }}, ${{ matrix.protocol }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.23
        protocol:
          - http
          - ws
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.go"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # (Actions must be pinned by commit hash) v8.0.1
        with:
          name: surreal-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Start SurrealDB
        run: ${{ github.workspace }}/artifacts/surreal start --allow-all -u root -p root &

      - name: Wait for startup
        timeout-minutes: 1
        run: |
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... (attempt $i/30)"
            sleep 2
          done

          # Final check
          if ! curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "SurrealDB failed to start"
            exit 1
          fi

      - name: Run Golang tests (${{ matrix.protocol }})
        timeout-minutes: 5
        run: go test -v -cover ./...
        env:
          SURREALDB_URL: ${{ matrix.protocol }}://localhost:8000/rpc

  sdk-python:
    name: SDK - Python (${{ matrix.version }}, ${{ matrix.protocol }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version:
          - 3.13
        protocol:
          - http
          - ws
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.py"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # (Actions must be pinned by commit hash) v8.0.1
        with:
          name: surreal-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Start SurrealDB
        run: ${{ github.workspace }}/artifacts/surreal start --allow-all -u root -p root &

      - name: Wait for startup
        timeout-minutes: 1
        run: |
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... (attempt $i/30)"
            sleep 2
          done

          # Final check
          if ! curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "SurrealDB failed to start"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Python tests (${{ matrix.protocol }})
        # The ws leg legitimately takes ~5 minutes on loaded runners; a 5-minute
        # timeout was killing fully green runs at the finish line.
        timeout-minutes: 10
        run: uv run pytest --ignore=tests/unit_tests/connections/embedded
        env:
          PYTHONPATH: ./src
          SURREALDB_URL: ${{ matrix.protocol }}://localhost:8000
          SURREALDB_VERSION: ${{ matrix.version }}
          PYTHONWARNINGS: ignore::ResourceWarning,ignore::UserWarning

  sdk-php:
    name: SDK - PHP (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8.4
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.php"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # (Actions must be pinned by commit hash) v8.0.1
        with:
          name: surreal-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # (Actions must be pinned by commit hash) v2.37.2
        with:
          php-version: ${{ matrix.version }}
          extensions: openswoole-26.2.0

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start SurrealDB
        run: ${{ github.workspace }}/artifacts/surreal start --allow-all -u root -p root &

      - name: Wait for startup
        timeout-minutes: 1
        run: |
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... (attempt $i/30)"
            sleep 2
          done

          # Final check
          if ! curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "SurrealDB failed to start"
            exit 1
          fi

      - name: Run PHP tests
        timeout-minutes: 5
        continue-on-error: true
        run: composer test

  sdk-dotnet:
    name: SDK - .NET (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version:
          - 10.0.x
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.net"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # (Actions must be pinned by commit hash) v8.0.1
        with:
          name: surreal-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/surreal

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # (Actions must be pinned by commit hash) v6.0.0
        with:
          dotnet-version: ${{ matrix.version }}

      - name: Install dependencies
        run: dotnet restore

      - name: Disable embedded mode
        run: sudo bash disable_embedded_mode.sh

      - name: Build
        run: dotnet build --no-restore

      - name: Start SurrealDB
        run: ${{ github.workspace }}/artifacts/surreal start --allow-all -u root -p root &

      - name: Wait for startup
        timeout-minutes: 1
        run: |
          # Wait for SurrealDB to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB to start... (attempt $i/30)"
            sleep 2
          done

          # Final check
          if ! curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "SurrealDB failed to start"
            exit 1
          fi

      - name: Run .NET tests
        timeout-minutes: 5
        continue-on-error: true
        run: >
          dotnet run
          --project ./SurrealDb.Net.Tests/SurrealDb.Net.Tests.csproj
          --no-restore
          --no-build

      - name: Run .NET tests (Live Query)
        timeout-minutes: 5
        continue-on-error: true
        run: >
          dotnet run
          --project ./SurrealDb.Net.LiveQuery.Tests/SurrealDb.Net.LiveQuery.Tests.csproj
          --no-restore
          --no-build

  # ----------------------------------------
  # SDK summary (fails if any SDK test job failed; not in required-checks yet)
  # ----------------------------------------

  sdk-output:
    name: SDK test summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - sdk-javascript
      - sdk-golang
      - sdk-python
      - sdk-php
      - sdk-dotnet
    steps:
      - name: SDK test results
        run: |
          echo "JavaScript: ${{ needs.sdk-javascript.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo "Golang: ${{ needs.sdk-golang.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo "Python: ${{ needs.sdk-python.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo "PHP: ${{ needs.sdk-php.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo ".NET: ${{ needs.sdk-dotnet.result == 'success' && '✅ Passed' || '❌ Failed' }}"

      - name: Fail if any SDK tests failed
        run: |
          if [[ "${{ needs.sdk-javascript.result }}" == "failure" ]] || \
             [[ "${{ needs.sdk-golang.result }}" == "failure" ]] || \
             [[ "${{ needs.sdk-python.result }}" == "failure" ]] || \
             [[ "${{ needs.sdk-php.result }}" == "failure" ]] || \
             [[ "${{ needs.sdk-dotnet.result }}" == "failure" ]]; then
            echo "❌ One or more SDK test jobs failed"
            exit 1
          fi
          echo "✅ All SDK tests passed"

  # --------------------------------------
  # Embedded engines, through the SDK
  # --------------------------------------

  # Each module's own suite (`Node engine` and `Wasm engine` in ci.yml) covers its
  # FFI surface. This covers the pairing: the SDK's `NodeEngine` and
  # `WebAssemblyEngine` driving builds of this repo's modules, which is the only
  # place a defect in how the two meet can show up.
  #
  # The suite reaches shapes neither module's own tests do, because it drives them
  # the way the SDK's own API does — `query().retry()` abandons a stream
  # mid-flight, for one — so it is where a defect in a module's lifetime handling
  # surfaces rather than in a release.
  #
  # Both modules are built even though the suites run separately: surrealdb.js is
  # one Bun workspace, so a single `bun install` has to satisfy both packages'
  # native dependencies or it resolves neither.
  sdk-javascript-embedded:
    name: SDK - JavaScript (embedded engines)
    runs-on: runner-amd-16-cores-spot
    # Manual only until the two modules are published and surrealdb.js's packages
    # wrap them. Before then the guard below is the honest outcome on every run,
    # and a permanently red required check teaches people to ignore it. Run it by
    # hand against a branch that has the wrappers:
    #   gh workflow run external-sdk-tests.yml -f surrealdb-js-ref=<branch>
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          path: engine

      - name: Setup environment
        uses: ./engine/.github/actions/setup-environment
        with:
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.AMAZON_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.AMAZON_SECRET_KEY }}
          targets: wasm32-unknown-unknown
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-key: node

      - name: Setup JavaScript
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The CLI and the wasm-bindgen crate share a bindgen schema that changes
      # between patch releases, so the version comes from the lockfile — the
      # same source `build.ts` checks against before it runs.
      - name: Install wasm-bindgen-cli
        working-directory: engine
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "Installing wasm-bindgen-cli $version"
          cargo install --locked -f wasm-bindgen-cli --version "$version"

      - name: Install wasm-opt
        run: cargo install --locked wasm-opt --version 0.116.1

      - name: Build and pack the addon
        id: node
        working-directory: engine/surrealdb/node
        run: |
          bun install --frozen-lockfile
          bun run build
          # A distinct name per run: `bun install` reuses a cached extraction for
          # a tarball whose name and version have not changed, which would install
          # a stale module and test the wrong binary.
          bun pm pack --destination "${{ runner.temp }}"
          mv "${{ runner.temp }}"/surrealdb-node-native-*.tgz \
            "${{ runner.temp }}/addon-${{ github.sha }}.tgz"
          echo "tarball=${{ runner.temp }}/addon-${{ github.sha }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Build and pack the WebAssembly module
        id: wasm
        working-directory: engine/surrealdb/wasm
        run: |
          bun install --frozen-lockfile
          bun run build
          bun pm pack --destination "${{ runner.temp }}"
          mv "${{ runner.temp }}"/surrealdb-wasm-native-*.tgz \
            "${{ runner.temp }}/module-${{ github.sha }}.tgz"
          echo "tarball=${{ runner.temp }}/module-${{ github.sha }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Checkout surrealdb.js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1
        with:
          repository: "surrealdb/surrealdb.js"
          ref: ${{ inputs.surrealdb-js-ref || 'main' }}
          path: sdk

      - name: Point the SDK at the modules just built
        working-directory: sdk
        run: |
          # Repointing every package that wraps one of our modules, and failing
          # when a package does not: without that the job installs, builds and
          # passes while testing surrealdb.js's own engines, reporting green for a
          # pairing it never exercised. A silent pass here is worse than no job at
          # all.
          python3 - <<'PY'
          import json, pathlib, sys

          wrappers = {
              "packages/node/package.json": ("@surrealdb/node-native", "${{ steps.node.outputs.tarball }}"),
              "packages/wasm/package.json": ("@surrealdb/wasm-native", "${{ steps.wasm.outputs.tarball }}"),
          }

          missing = []
          for path, (dependency, tarball) in wrappers.items():
              manifest = pathlib.Path(path)
              package = json.loads(manifest.read_text())
              if dependency not in package.get("dependencies", {}):
                  missing.append(f"{path} does not depend on {dependency}")
                  continue
              package["dependencies"][dependency] = f"file:{tarball}"
              manifest.write_text(json.dumps(package, indent=4) + "\n")

          if missing:
              for line in missing:
                  print(f"::error::{line}, so it builds its own engine and this job")
                  print("::error::would test nothing about this repo. It becomes meaningful")
                  print("::error::once the wrapper lands.")
              sys.exit(1)
          PY

      - name: Install dependencies
        working-directory: sdk
        # Not frozen: the manifests were just repointed at local tarballs.
        run: bun install

      - name: Run the SDK suite against the embedded Node engine
        working-directory: sdk
        run: bun run test:node

      - name: Run the SDK suite against the embedded WebAssembly engine
        working-directory: sdk
        run: bun run test:wasm
