name: Nix

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'flake.nix'
      - 'flake.lock'
      - 'pkg/nix/**'
      - '.github/workflows/nix.yml'

# Setting the shell option, it will run 'bash --noprofile --norc -eo pipefail {0}'
defaults:
  run:
    shell: bash

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  build:
    name: Build native Linux binary and Docker image
    runs-on: [ runner-amd-32-cores ]
    env:
      # Trusted refs (main / tags) get full access: Cachix push and smoke tests.
      # On any other ref cachix runs read-only to prevent cache poisoning, and
      # built binaries are never executed to avoid running unreviewed code.
      IS_TRUSTED_REF: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # (Actions must be pinned by commit hash) v31.11.1

      # The self-hosted runner starts with $USER unset, which cachix rejects
      # ("$USER must be set."). GitHub-hosted runners export it automatically.
      # Export the real runner user (not a hardcoded "root", which would send
      # the Nix installer down the single-user root path and fail to write to
      # the sudo-created, root-owned /nix on this non-root container runner).
      - name: Export USER for cachix
        run: echo "USER=$(id -un)" >> "$GITHUB_ENV"

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # (Actions must be pinned by commit hash) v17
        env:
          CACHIX_AUTH_TOKEN: ${{ env.IS_TRUSTED_REF == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
        with:
          name: surrealdb
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community

      - run: nix build .#x86_64-unknown-linux-gnu

      - name: Smoke-test binary
        if: env.IS_TRUSTED_REF == 'true'
        run: ./result/bin/surreal help

      - run: nix build .#docker-image

      - name: Smoke-test Docker image
        if: env.IS_TRUSTED_REF == 'true'
        run: docker load --input ./result

