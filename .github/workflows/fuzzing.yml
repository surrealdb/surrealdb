name: Fuzzing

run-name: "Fuzzing run '${{ github.head_ref || github.ref_name }}'"

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check-fuzzing:
    name: Check fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # (Actions must be pinned by commit hash) v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # (Actions must be pinned by commit hash) v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz

      - name: Check fuzzers
        run: cargo build --manifest-path fuzz/Cargo.toml

      - name: Check OSS-Fuzz
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@22d0a9a05012b976c58c78398d4b7238f74fd158 # (Actions must be pinned by commit hash) master
        with:
          oss-fuzz-project-name: surrealdb
          language: rust
        # Temporarily allow this step to fail
        continue-on-error: true
