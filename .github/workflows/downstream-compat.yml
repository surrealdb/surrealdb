# ─────────────────────────────────────────────────────────────────────────────
# Downstream compatibility — non-blocking signal
# ─────────────────────────────────────────────────────────────────────────────
#
# Builds + unit-tests a downstream consumer of `surrealdb-server` against this
# PR's code, redirecting its dependency to this checkout with a Cargo `[patch]`.
# Soft signal only — never a required check. One-time setup (secrets) and the
# full rationale live in the PR that introduced this workflow.
# ─────────────────────────────────────────────────────────────────────────────

name: Downstream compatibility

run-name: "Downstream compatibility '${{ github.head_ref || github.ref_name }}'"

on:
  workflow_dispatch:

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  compat:
    name: Build + test
    if: github.repository == vars.PRIVATE_ENGINE_REPO && github.event.pull_request.draft != true
    # On-demand (not spot): spot preemption shows up as "runner lost
    # communication" failures, and this is a soft signal we don't want flaking.
    runs-on: runner-arm-16-cores
    timeout-minutes: 45

    steps:
      # Until the downstream App + secrets are provisioned this check should be a
      # no-op, not a red mark on every PR (it is a soft signal, not a gate). All
      # the real work below is gated on `configured`, so an unconfigured repo
      # passes green with a notice instead of failing at the token step.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check whether the downstream check is configured
        id: preflight
        env:
          # Gate on the PRIVATE KEY (a secret), not the client-id (a variable):
          # variables are present in contexts where secrets are withheld (fork
          # PRs, or the setup window before the key secret was added), so gating
          # on the variable lets the token mint run without a key and hard-fail
          # instead of no-opping. `!= ''` yields a boolean without exposing it.
          # The dependency-fetch App's read-only key covers both the downstream
          # checkout and the downstream's own private git sources.
          HAS_DEP_APP: ${{ secrets.DEP_FETCH_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_DEP_APP}" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Downstream compatibility::Not configured (DEP_FETCH_APP_* absent) — skipping."
          fi

      # The engine (this PR) is checked out at the workspace root so the local
      # composite actions below (./.github/actions/...) resolve.
      - name: Checkout engine (this PR)
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave this repo's GITHUB_TOKEN in the workspace git config: it
          # is scoped to this repo, and a later git call to the downstream repo
          # made from this directory would otherwise pick it up and be denied.
          persist-credentials: false

      # Mint a short-lived, read-only token scoped to the downstream repo, for
      # the checkout below. The owner defaults to this repository's owner; the
      # repo name comes from a secret. It comes from the dependency-fetch App
      # (contents: read), installed on the downstream repo: this workflow can be
      # dispatched from any branch, so it never reads the release-automation
      # App's key, which is for the release workflows only.
      - name: Generate a token for the downstream repo
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEP_FETCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEP_FETCH_APP_PRIVATE_KEY }}
          repositories: ${{ secrets.DOWNSTREAM_REPO }}
          permission-contents: read

      # Pick the downstream branch to validate against, in priority order: the
      # exact target branch (the matching release branch for a release-targeted
      # PR), then main as a last resort. The first that exists downstream wins —
      # so a release PR is checked against the matching release line whenever it
      # exists, and only against main if it doesn't. A missing counterpart branch
      # is not itself a compat failure.
      - name: Resolve downstream branch
        id: branch
        if: steps.preflight.outputs.configured == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ secrets.DOWNSTREAM_REPO }}
          WANT: ${{ github.base_ref || github.ref_name }}
        run: |
          set -uo pipefail
          # Resolve via `git ls-remote` rather than `gh` — git is always on the
          # runner (the checkout above uses it) whereas gh is not installed here.
          # The installation token is supplied through the environment
          # (GIT_CONFIG_*), so it never appears in a process's argv.
          #
          # Run from RUNNER_TEMP, NOT the workspace: the engine checkout's repo
          # config carries an http.https://github.com/.extraheader for this repo's
          # GITHUB_TOKEN (host-scoped, so it also matches the downstream URL). Run
          # here and git would send that token — which can't see the private
          # downstream repo — and GitHub returns "Repository not found". Running
          # outside any repo means only the installation token below is used.
          workdir="${RUNNER_TEMP:-/tmp}"
          url="https://github.com/${OWNER}/${REPO}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0
          ref=""
          last_err=""
          # Number of ls-remote attempts per candidate before giving up on it.
          max_attempts=5
          for cand in "${WANT}" main; do
            # --exit-code: 0 = ref found, 2 = connected but no such ref, other =
            # access/auth error. So a non-empty last_err means we couldn't reach
            # the repo (likely the App lacks Contents:read), vs the ref just being
            # absent (empty last_err).
            #
            # Retry only the "couldn't reach the repo" case: a freshly-minted
            # installation token is occasionally not usable for a moment, and a
            # private repo surfaces that as a transient 404 ("repository not
            # found") that is indistinguishable from a real permission gap on a
            # single attempt. A ref that is merely absent (empty last_err) is a
            # real "no such branch", so we stop retrying and fall through to the
            # next candidate. Fixed 5s backoff.
            attempt=1
            while :; do
              if last_err="$(git -C "$workdir" ls-remote --exit-code --heads "$url" "refs/heads/${cand}" 2>&1 >/dev/null)"; then
                ref="${cand}"
                break
              fi
              if [ -z "${last_err}" ] || [ "${attempt}" -ge "${max_attempts}" ]; then
                break
              fi
              echo "Downstream ls-remote for '${cand}' failed (attempt ${attempt}/${max_attempts}); retrying in 5s..." >&2
              attempt=$((attempt + 1))
              sleep 5
            done
            [ -n "${ref}" ] && break
          done
          if [ -z "${ref}" ]; then
            echo "::error title=Downstream compatibility::could not read '${WANT}' or 'main' on ${OWNER}/${REPO}. If git reports an auth/permission error below, the dependency-fetch App (DEP_FETCH_APP_*) is missing Contents:read on the repo (ref reads require it; approve the permission on the installation, not just add it to the App). git said: ${last_err:-<no error output: branches simply do not exist>}"
            exit 1
          fi
          if [ "${ref}" != "${WANT}" ]; then
            echo "::warning title=Downstream compatibility::no matching downstream branch '${WANT}'; validating against '${ref}' instead"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Validating against downstream branch '${ref}'"

      - name: Checkout downstream
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.DOWNSTREAM_REPO }}
          ref: ${{ steps.branch.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: downstream
          persist-credentials: false

      - name: Setup environment
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/setup-environment
        with:
          # The kache S3 backend shared with the rest of CI.
          kache-bucket: ${{ secrets.AWS_S3_SCCACHE_BUCKET_NAME }}
          kache-access-key-id: ${{ secrets.KACHE_READONLY_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.KACHE_READONLY_SECRET_KEY }}
          workspaces: downstream
          cache-key: downstream-compat
          save-cache: ${{ github.event_name == 'push' }}

      # Mint the credential cargo presents for the downstream's private git
      # dependencies. The step after this publishes it through GIT_CONFIG_GLOBAL,
      # so every later step inherits it, including `cargo check` and `cargo
      # nextest run` over the downstream workspace. Build scripts, proc macros
      # and test binaries there run as this user and can read the file, so it
      # must be read-only and confined to the dependency-fetch App's
      # installation.
      #
      # No `repositories:` restriction: the App is single-purpose, so its
      # installation is itself the allowlist and a list here would only
      # duplicate it. `permission-contents: read` pins the token regardless of
      # what the App is granted later.
      - name: Generate a token for the downstream's private git dependencies
        id: dep-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEP_FETCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEP_FETCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # The downstream declares its private git dependencies with ssh:// URLs,
      # and this runner has no ssh key for them. Rewrite that spelling (and the
      # scp-style one) to token-authenticated HTTPS so the token minted above is
      # what cargo presents, and make cargo fetch through the git CLI, since its
      # builtin fetcher ignores git config. Engine URLs match the rewrite too,
      # harmlessly: the [patch] step below means they are never fetched. This
      # mirrors the downstream's own setup-environment action, so both repos
      # authenticate the same dependencies the same way.
      #
      # The rewrite lives in a job-scoped file under $RUNNER_TEMP, published via
      # GIT_CONFIG_GLOBAL, so the token stays out of ~/.gitconfig, which would
      # outlive the job on a reused runner. GIT_CONFIG_GLOBAL REPLACES
      # ~/.gitconfig rather than layering on it, hence the include (git skips it
      # silently when the file does not exist). The file is recreated rather
      # than edited so a stale one left by a failed cleanup cannot win the
      # insteadOf tie with an expired token.
      - name: Authenticate the downstream's private git dependencies
        if: steps.preflight.outputs.configured == 'true'
        env:
          TOKEN: ${{ steps.dep-token.outputs.token }}
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/dep.gitconfig"
          rm -f "$cfg"
          git config --file "$cfg" include.path "$HOME/.gitconfig"
          chmod 600 "$cfg"
          git config --file "$cfg" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --file "$cfg" --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          {
            echo "GIT_CONFIG_GLOBAL=$cfg"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"

      - name: Install tools
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/install-tools
        with:
          preset: test

      # The downstream generates its replication gRPC stubs in a build script
      # (tonic-prost-build), which shells out to `protoc`. No engine crate needs
      # it, so the runner image ships none and the downstream `cargo check`
      # aborts in that build script without this. Installed from the upstream
      # release (the same pinned action as the cargo tools above) rather than
      # apt, so it does not depend on the runner's package lists; the action
      # puts it on PATH, which is where prost-build looks.
      - name: Install protoc for the downstream build
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/install-tools
        with:
          tools: protoc

      # The downstream's `envtest` crate binds a Go implementation through
      # rust2go, and that crate's build script shells out to `go build`. No
      # engine crate needs Go, so the runner image ships none and the downstream
      # unit suite aborts in that build script without this.
      #
      # The version here is a starting point, not a requirement to keep in step
      # with the downstream: the two steps that run the build script set
      # `GOTOOLCHAIN=auto`, so the `go` command honours the `go`/`toolchain`
      # directives in the downstream's own `go.mod` and fetches a newer toolchain
      # when it asks for one.
      - name: Install Go for the downstream build
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # (Actions must be pinned by commit hash) v7.0.0
        with:
          go-version: '1.25'

      # The downstream pulls in surrealdb-librocksdb-sys (the rust-rocksdb fork)
      # with its `cloud`+`aws` cargo features, from the downstream's own
      # dependency graph, not this engine. Those features compile RocksDB's
      # cloud glue against the AWS C++ SDK (`#include <aws/core/Aws.h>`), and the
      # fork's build.rs expects a prebuilt SDK at $AWS_SDK_INSTALL_DIR. The runner
      # image ships none, so without it the downstream `cargo check` aborts at
      # the C++ stage. The SDK is never compiled here: it is pulled from the
      # artifact aws-sdk-artifact.yml publishes for this architecture, at the
      # version and build revision .github/scripts/aws-sdk-cpp.sh pins. That
      # script names the tag and verifies the unpacked layout on both sides, so
      # the publisher and this consumer cannot disagree about either.
      #
      # The cargo steps below link these system libraries directly (the fork's
      # build.rs emits -lcurl -lssl -lcrypto -lz), and they live outside the SDK
      # prefix, so they are installed here. The install is best-effort (runner
      # images with stale apt lists 404 on package fetches); the link probe
      # decides whether anything the build needs is actually missing, so a gap
      # fails here with the libraries named, not half an hour later as a bare
      # "cannot find -lcurl" from an ld invocation deep inside the cargo build.
      - name: Install the system libraries the downstream build links
        if: steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail

          # Use sudo only when present and not already root (self-hosted runners
          # vary).
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get -qq -y update || true
            $SUDO apt-get -qq -y install --no-install-recommends \
              g++ git libcurl4-openssl-dev libssl-dev zlib1g-dev || true
          fi

          if ! command -v cc >/dev/null 2>&1; then
            echo "::error title=Downstream compatibility::no C compiler/linker driver (cc) on this runner, and the best-effort apt-get install above could not provide one (check its output); the cargo steps below cannot link"
            exit 1
          fi
          probe="${RUNNER_TEMP}/link-probe.c"
          echo 'int main(void) { return 0; }' > "${probe}"
          missing=""
          for lib in curl ssl crypto z; do
            cc "${probe}" "-l${lib}" -o /dev/null 2>/dev/null || missing="${missing} lib${lib}"
          done
          if [ -n "${missing}" ]; then
            echo "::error title=Downstream compatibility::runner is missing system link libraries required by the downstream build:${missing} (from libcurl4-openssl-dev / libssl-dev / zlib1g-dev). The best-effort apt-get install above could not provide them (check its output for the cause); failing here instead of at link time in the cargo steps below"
            exit 1
          fi

      - name: Install oras
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/install-oras

      # Pulled by digest: the tag is resolved once, the pull names the digest it
      # resolved to, and oras verifies every blob against that manifest, so what
      # is unpacked is exactly what one publish run pushed. The registry is
      # reached through the runner's ambient IAM role, as the private pipeline's
      # pushes are. An absent tag is the one expected failure: the publish
      # workflow has not run for this pin (a bumped version or revision, or the
      # first run), and the message says so. A repository that does not exist
      # is named as its own cause when the role can tell. There is no fallback
      # to a source build, which no CI job does for this SDK.
      - name: Pull the AWS C++ SDK artifact
        if: steps.preflight.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.AWS_SDK_ECR_REPOSITORY || secrets.AWS_ECR_REPOSITORY }}
          AWS_SDK_INSTALL: ${{ runner.temp }}/aws-sdk-install
        run: |
          set -euo pipefail
          if [[ -z "${ECR_REGISTRY}" ]]; then
            echo "::error title=Downstream compatibility::AWS_ECR_REGISTRY is not configured, so the AWS C++ SDK artifact cannot be pulled."
            exit 1
          fi
          if [[ -z "${ECR_REPOSITORY}" ]]; then
            echo "::error title=Downstream compatibility::neither the AWS_SDK_ECR_REPOSITORY variable nor the AWS_ECR_REPOSITORY secret names the repository aws-sdk-artifact.yml publishes to."
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "::error title=Downstream compatibility::the aws CLI is not on this runner, so it cannot log in to the registry to pull the AWS C++ SDK artifact."
            exit 1
          fi
          tag="$(.github/scripts/aws-sdk-cpp.sh tag)"
          file="$(.github/scripts/aws-sdk-cpp.sh file)"
          ref="${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          # The region is read off the registry host
          # (<account>.dkr.ecr.<region>.amazonaws.com), so it cannot drift from it.
          region="$(printf '%s' "${ECR_REGISTRY}" | cut -d. -f4)"
          if ! aws ecr get-login-password --region "${region}" \
            | oras login --username AWS --password-stdin "${ECR_REGISTRY}"; then
            echo "::error title=Downstream compatibility::could not log in to the registry: this runner's IAM role must be able to pull from the ${ECR_REPOSITORY} repository (the private runners' role can; see aws-sdk-artifact.yml)."
            exit 1
          fi
          # A missing repository would otherwise read as a missing tag. Needs
          # ecr:DescribeRepositories; without it the resolve below still
          # distinguishes an auth failure from an absent tag.
          if out="$(aws ecr describe-repositories --region "${region}" --repository-names "${ECR_REPOSITORY}" --query 'repositories[0].repositoryName' --output text 2>&1)"; then
            echo "Repository ${ECR_REPOSITORY} exists"
          elif grep -q RepositoryNotFoundException <<<"${out}"; then
            echo "::error title=Downstream compatibility::the repository ${ECR_REPOSITORY} does not exist in the registry; create it and run the 'AWS C++ SDK artifact' workflow, or point AWS_SDK_ECR_REPOSITORY (or AWS_ECR_REPOSITORY) at the right one."
            exit 1
          elif grep -qi "AccessDenied\|not authorized" <<<"${out}"; then
            echo "Cannot confirm the repository ${ECR_REPOSITORY} exists (this role has no ecr:DescribeRepositories); resolving the tag directly."
          else
            echo "::error title=Downstream compatibility::could not describe the repository ${ECR_REPOSITORY}:"
            echo "${out}"
            exit 1
          fi
          if ! digest="$(oras resolve "${ref}" 2>"${RUNNER_TEMP}/resolve.err")"; then
            if grep -q "not found" "${RUNNER_TEMP}/resolve.err"; then
              echo "::error title=Downstream compatibility::${ECR_REPOSITORY}:${tag} is not published. Run the 'AWS C++ SDK artifact' workflow (aws-sdk-artifact.yml) on main first; it publishes the version .github/scripts/aws-sdk-cpp.sh pins for both architectures. This job never builds the SDK from source."
            else
              echo "::error title=Downstream compatibility::could not resolve ${ECR_REPOSITORY}:${tag}:"
              cat "${RUNNER_TEMP}/resolve.err"
            fi
            exit 1
          fi
          echo "::notice title=Downstream compatibility::AWS C++ SDK from ${ECR_REPOSITORY}:${tag} (${digest})"
          pulled="${RUNNER_TEMP}/aws-sdk-artifact"
          rm -rf "${pulled}" "${AWS_SDK_INSTALL}"
          mkdir -p "${pulled}"
          oras pull --output "${pulled}" "${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}"
          .github/scripts/aws-sdk-cpp.sh unpack "${pulled}/${file}" "${AWS_SDK_INSTALL}"
          .github/scripts/aws-sdk-cpp.sh verify "${AWS_SDK_INSTALL}"
          rm -rf "${pulled}"
          # Hand the prebuilt SDK to the fork's build.rs for the cargo steps below.
          echo "AWS_SDK_INSTALL_DIR=${AWS_SDK_INSTALL}" >> "$GITHUB_ENV"

      # Redirect every engine crate the downstream depends on DIRECTLY from
      # this repo's git source to this checkout with a Cargo `[patch]`. The
      # crate set is read from the downstream's own manifests (any Cargo.toml
      # in its workspace): a direct git dependency left unpatched forces
      # cargo to fetch the pinned private rev, which the runner cannot
      # authenticate. Transitive engine crates are never patched — they
      # follow as path dependencies of the patched crates. When the
      # downstream-locked engine version differs from this checkout, the
      # engine workspace version (and its internal version requirements) is
      # stamped uniformly to the locked version, keeping the patch preferred
      # for every crate without breaking the workspace's own internal edges.
      # This rewrites Cargo.lock, so the cargo steps below intentionally
      # omit --locked.
      - name: Point downstream at this engine checkout
        if: steps.preflight.outputs.configured == 'true'
        env:
          ENGINE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Existence is a sufficient capability check: the script was introduced
          # complete with the ENGINE_DEST / positional-engine-path contract in a
          # single downstream commit and backported intact, so no downstream
          # commit carries it without that contract. Older commits take the
          # [patch] fallback below.
          if [ -f downstream/docker/patch-ce-local.py ]; then
            # The downstream repo owns the engine-redirection logic: a real TOML
            # parser that handles any declaration form, rewrites every engine dep to
            # a path into this checkout and reconciles the lock (see that script's
            # header). ENGINE_DEST == the engine location means no relocation - this
            # engine checkout already sits outside the downstream workspace.
            WORKSPACE_DIR=downstream ENGINE_DEST="${ENGINE}" \
              python3 downstream/docker/patch-ce-local.py "${ENGINE}"
          else
            # Fallback for downstream branches that predate the script (e.g.
            # release lines): redirect via a [patch] over every directly-declared
            # engine dep, with a uniform workspace version stamp so cargo prefers
            # the patch even under release-line version skew.
            src_url="$(grep -E '^[[:space:]]*surrealdb-server[[:space:]]*=' downstream/Cargo.toml \
              | grep -oE 'git = "[^"]*"' | head -n1 | sed -E 's/.*"([^"]*)".*/\1/')"
            if [ -z "$src_url" ]; then
              echo "::error title=Downstream compatibility::could not find the surrealdb-server git source in downstream/Cargo.toml"
              exit 1
            fi

            # Every crate the downstream declares as a direct dependency on
            # this git source, across all manifests in its workspace. The URL
            # is matched as a fixed string, so a different git source whose
            # URL merely contains this repo's name can never sweep foreign
            # crates into the set. A no-match grep must not kill the step
            # under `set -o pipefail` — the empty-set branch below owns that
            # diagnosis. The scan expects inline-table dependencies
            # (`name = { git = ... }`): a table-form dependency would match on
            # its bare `git = ...` line, so that token is filtered out and
            # surfaces through the empty-set error rather than as a confusing
            # missing-crate failure. Crate names contain no whitespace, so
            # word-splitting the list is safe.
            git_crates="$(grep -rh --include=Cargo.toml -F "git = \"${src_url}\"" downstream/ \
              | sed -nE 's/^[[:space:]]*([A-Za-z0-9_-]+)[[:space:]]*=.*/\1/p' \
              | grep -vx git | sort -u || true)"
            if [ -z "$git_crates" ]; then
              echo "::error title=Downstream compatibility::no direct inline-table dependencies on ${src_url} found in the downstream manifests"
              exit 1
            fi

            # Authoritative name -> directory map of the engine workspace
            # members (exact, no filesystem-order ambiguity from stray
            # fixtures that happen to share a crate name).
            engine_meta="$(cargo metadata --manifest-path "${ENGINE}/Cargo.toml" --no-deps --format-version 1)"
            find_crate_dir() {
              jq -r --arg name "$1" \
                '.packages[] | select(.name == $name) | .manifest_path' <<<"$engine_meta" \
                | head -n1 | xargs -r dirname
            }
            # Prints the downstream-locked version of crate $1 (empty if absent).
            locked_version() {
              awk -v crate="$1" '
                /^\[\[package\]\]/ { name = ""; ver = "" }
                /^name = / { name = $3; gsub(/"/, "", name) }
                /^version = / { ver = $3; gsub(/"/, "", ver) }
                name == crate && ver != "" { print ver; exit }
              ' downstream/Cargo.lock
            }
            workspace_ver="$(jq -r '.packages[0].version' <<<"$engine_meta")"

            # Cargo records the git source's resolved version as an available
            # version and selects the newest semver-compatible one. When this
            # engine's version differs from what the downstream locked (e.g. a
            # release branch vs main drift), cargo prefers the original git
            # source over the path [patch] below and tries to fetch the pinned
            # private rev — which the runner cannot authenticate. Stamping only
            # some crates would break the workspace's own internal version
            # requirements, so the stamp is uniform: rewrite the engine
            # workspace version and its internal `[workspace.dependencies]`
            # version requirements to the downstream-locked version, so every
            # patched crate presents the locked version while internal edges
            # stay mutually consistent. On main (where the versions already
            # match) this is a no-op; mixed locked versions across the direct
            # dependencies make a consistent stamp impossible and are surfaced
            # as a warning instead.
            stamp_ver=""
            for crate in $git_crates; do
              want_ver="$(locked_version "$crate")"
              if [ -z "${want_ver}" ]; then
                echo "::warning title=Downstream compatibility::could not read the downstream-locked version of ${crate}; cargo may skip the [patch] if the engine version differs from the downstream lock"
              elif [ -z "${stamp_ver}" ]; then
                stamp_ver="${want_ver}"
              elif [ "${stamp_ver}" != "${want_ver}" ]; then
                echo "::warning title=Downstream compatibility::downstream locks mixed engine versions (${stamp_ver} vs ${want_ver} for ${crate}); skipping the version stamp — cargo may prefer the original git source and fail to fetch it"
                stamp_ver="mixed"
              fi
            done
            if [ -n "${stamp_ver}" ] && [ "${stamp_ver}" != "mixed" ] && [ "${stamp_ver}" != "${workspace_ver}" ]; then
              sed -i -E "s/^version = \"${workspace_ver}\"$/version = \"${stamp_ver}\"/" "${ENGINE}/Cargo.toml"
              sed -i -E "/path = \"surrealdb/s/version = \"${workspace_ver}\"/version = \"${stamp_ver}\"/" "${ENGINE}/Cargo.toml"
              echo "Stamped engine workspace version ${workspace_ver} -> ${stamp_ver} (matches downstream lock)"
            fi

            {
              echo ""
              echo "# CI-only (downstream-compat): build against this PR's engine checkout."
              echo "[patch.\"${src_url}\"]"
            } >> downstream/Cargo.toml
            for crate in $git_crates; do
              dir="$(find_crate_dir "$crate")"
              if [ -z "$dir" ]; then
                echo "::error title=Downstream compatibility::downstream depends on '${crate}' from ${src_url}, but this checkout has no workspace member with that name"
                exit 1
              fi
              # A crate with an explicit (non workspace-inherited) version does
              # not follow the uniform stamp; surface the mismatch so a
              # patch-skip fetch failure explains itself.
              want_ver="$(locked_version "$crate")"
              if [ -n "${want_ver}" ] && [ "${want_ver}" != "${workspace_ver}" ] \
                && ! grep -qE '^version\.workspace = true$' "${dir}/Cargo.toml"; then
                echo "::warning title=Downstream compatibility::${crate} declares an explicit version (engine ${workspace_ver}, downstream lock ${want_ver}) that the workspace stamp does not cover; cargo may skip the [patch]"
              fi
              echo "${crate} = { path = \"${dir}\" }" >> downstream/Cargo.toml
              echo "Patching ${crate} (${src_url}) -> ${dir}"
            done
          fi

      # Name the repo when a private git source is unreachable. cargo's failure
      # for a missing credential is a bare "revision <sha> not found / failed to
      # authenticate" that names neither the repo nor the remedy, and an App
      # installation is not guessable from it.
      # Warns rather than fails: the scan is a grep over manifests, so it must
      # never be the thing that reddens this job — an unreachable source fails
      # the cargo step below on its own, with this annotation alongside it.
      - name: Check the downstream's private git sources are reachable
        if: steps.preflight.outputs.configured == 'true'
        env:
          # The engine's own repo as owner/name, dropped from the scan: the
          # patch step above redirects those crates to this checkout, so they
          # are never fetched. github.repository rather than the event payload,
          # so the value does not depend on the triggering event's shape.
          ENGINE_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # A downstream whose only private source is the engine matches
          # nothing here, and grep reports that as exit 1, which the runner's
          # `bash -e -o pipefail` would turn into a failed step. Empty is the
          # answer the branch below handles, so the status is not one.
          repos="$(grep -rhoE '(ssh://git@github\.com/|git@github\.com:)[A-Za-z0-9._-]+/[A-Za-z0-9._-]+' \
                     --include=Cargo.toml --exclude-dir=target --exclude-dir=vendor downstream/ \
                   | sed -E 's#.*github\.com[:/]##; s#\.git$##' \
                   | sort -u | grep -vx "${ENGINE_REPO}")" || true
          if [ -z "${repos}" ]; then
            echo "No private git sources beyond the engine."
            exit 0
          fi
          for repo in ${repos}; do
            if git ls-remote "ssh://git@github.com/${repo}.git" HEAD >/dev/null 2>&1; then
              echo "reachable: ${repo}"
            else
              echo "::warning title=Downstream compatibility::the downstream resolves a git dependency from '${repo}', which this job cannot read, so the cargo steps below will fail in resolution. Install the dependency-fetch App (DEP_FETCH_APP_*) on '${repo}' with Contents:read and approve it there. Its installation is the allowlist, so nothing in this repo needs changing once that is done."
            fi
          done

      # The downstream workspace includes the Kubernetes operator crates
      # (s7b-operator, s7b-operator-e2e). Their build graph is disjoint from the
      # engine: they do not depend on the patched engine crates, so they add no
      # compatibility signal here. Building them also needs the Go toolchain (the
      # envtest dev-dependency's build script), and their tests need a live
      # cluster, neither of which this runner provides. Exclude them, matching
      # the downstream repo's own engine `cargo make ci-*` tasks; its operator-*
      # workflows cover those crates.
      - name: Build downstream (cargo check)
        if: steps.preflight.outputs.configured == 'true'
        working-directory: downstream
        # `actions/setup-go` exports `GOTOOLCHAIN=local` for every later step,
        # which turns the installed version into a ceiling: a `go.mod` asking for
        # a newer one fails with `go.mod requires go >= …` instead of fetching
        # it. Set here rather than on that step, whose own `env` would not reach
        # this one, and at step level so it takes precedence over the export.
        env:
          GOTOOLCHAIN: auto
        # The operator crates are excluded by name, and cargo only *warns* when an
        # excluded name matches nothing — so a rename in the downstream silently
        # puts them back in the build. They were `s7b-operator*` and are now
        # `surrealdb-operator*`; check that warning if this lane starts running
        # tests it should not.
        run: cargo check --workspace --exclude surrealdb-operator --exclude surrealdb-operator-e2e

      - name: Test downstream (unit suite)
        if: steps.preflight.outputs.configured == 'true'
        working-directory: downstream
        env:
          GOTOOLCHAIN: auto
        # Same naming caveat as the step above. The operator crates drive a real
        # Kubernetes API through envtest and need a kubeconfig this runner has no
        # cluster for, so they are not part of the compatibility signal.
        run: cargo nextest run --workspace --exclude surrealdb-integration --exclude surrealdb-operator --exclude surrealdb-operator-e2e

      - name: kache stats
        if: ${{ always() && steps.preflight.outputs.configured == 'true' }}
        run: kache stats || true
