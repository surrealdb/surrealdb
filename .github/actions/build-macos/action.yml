name: 'Build macOS binary'
description: 'Build SurrealDB binary for macOS'

inputs:
  arch:
    description: 'Target architecture (x86_64-apple-darwin or aarch64-apple-darwin)'
    required: true
  platform:
    description: 'Platform name (amd64 or arm64)'
    required: true
  name:
    description: 'The name of output'
    required: true
  version-override:
    description: 'Version override (for nightly builds)'
    required: false
    default: ''
  build-metadata:
    description: 'Build metadata'
    required: false
    default: ''
  extra-features:
    description: 'Extra features enabled in the binary'
    required: false
    default: 'jwks'
  upload:
    description: 'Upload build artifacts'
    required: false
    default: 'true'
  release:
    description: 'Compile with release flag'
    required: false
    default: 'true'
  binary:
    description: 'The executable to build and package; artifacts are named after it'
    required: false
    default: 'surreal'
  package:
    description: 'The Cargo package to build (empty = the workspace root package, which builds `surreal`)'
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}

runs:
  using: 'composite'
  steps:
    - name: Output package versions
      shell: bash
      run: |
        set -x
        set +e
        go version ; cargo version ; rustc --version ; cmake --version ; gcc --version ; g++ --version ; perl -v

    - name: Prepare dependencies
      shell: bash
      run: |
        # The runner image ships with third-party taps preconfigured, and brew
        # warns about untrusted taps on every invocation. Everything installed
        # here comes from homebrew-core, so drop the preinstalled taps rather
        # than trusting or ignoring them.
        brew untap aws/tap 2>/dev/null || true
        brew install protobuf

    - name: Install target (for cross-compilation)
      if: ${{ inputs.arch == 'x86_64-apple-darwin' }}
      shell: bash
      run: rustup target add x86_64-apple-darwin

    - name: Build binary
      shell: bash
      env:
        SURREAL_BUILD_VERSION: ${{ inputs.version-override }}
        SURREAL_BUILD_METADATA: ${{ inputs.build-metadata }}
      run: |
        set -x

        # Build
        extra_args=""
        compile_profile="debug"
        if [[ "${{ inputs.name }}" == "ci" && "${{ inputs.upload }}" == "false" ]]; then
          extra_args="${extra_args} --features ${{ inputs.extra-features }}"
        else
          extra_args="${extra_args} --features default"
          if [[ ! -z "${{ inputs.extra-features }}" ]]; then
            extra_args="${extra_args} --features ${{ inputs.extra-features }}"
          fi
        fi
        if [[ "${{ inputs.release }}" == "true" ]]; then
          extra_args="${extra_args} --release"
          compile_profile="release"
        fi
        if [[ -n "${{ inputs.package }}" ]]; then
          extra_args="${extra_args} --package ${{ inputs.package }}"
        fi

        cargo build --no-default-features ${extra_args} --locked --target ${{ inputs.arch }}

        # Package
        cp target/${{ inputs.arch }}/${compile_profile}/${{ inputs.binary }} ${{ inputs.binary }}
        ./${{ inputs.binary }} --version
        tar -zcvf ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}.tgz ${{ inputs.binary }}
        echo $(shasum -a 256 ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}.tgz | cut -f1 -d' ') > ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}.txt

    - name: Upload artifacts
      if: ${{ inputs.upload == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}
        path: |
          ${{ inputs.binary }}
          ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}.tgz
          ${{ inputs.binary }}-${{ inputs.name }}.darwin-${{ inputs.platform }}.txt
