name: 'Build Linux binary'
description: 'Build SurrealDB binary for Linux using Docker'

inputs:
  arch:
    description: 'Target architecture (x86_64-unknown-linux-gnu or aarch64-unknown-linux-gnu)'
    required: true
  platform:
    description: 'Platform name (amd64 or arm64)'
    required: true
  name:
    description: 'The name of output'
    required: true
  version-override:
    description: 'Version override (for nightly builds)'
    required: false
    default: ''
  build-metadata:
    description: 'Build metadata'
    required: false
    default: ''
  onnx-version:
    description: 'The ONNX library version'
    required: false
    default: '1.23.2'
  extra-features:
    description: 'Extra features enabled in the binary'
    required: false
    default: 'storage-tikv,jwks,ml'
  upload:
    description: 'Upload build artifacts'
    required: false
    default: 'true'
  release:
    description: 'Compile with release flag'
    required: false
    default: 'true'
  cache-image:
    description: >-
      Full image reference (registry/repo:tag) for the buildx registry cache of
      the builder image, read and written via ambient AWS credentials. Pull
      access gives a warm cache; push access lets the cache persist across
      runs; neither a failed import nor a rejected export blocks the build.
      Empty keeps the cache local to the runner, which on ephemeral runners
      means a cold builder build every run.
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: surreal-${{ inputs.name }}.linux-${{ inputs.platform }}

runs:
  using: 'composite'
  steps:
    - name: Prepare docker image name
      id: image
      shell: bash
      run: |
        set -x

        tag=$(echo ${{ github.ref_name }} | sed -e 's/[^a-zA-Z0-9]/-/g')
        echo "tag=${tag}" >> $GITHUB_OUTPUT

        echo "folder=/tmp/surrealdb-builder/${tag}" >> $GITHUB_OUTPUT

    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Setup artifact directory
      shell: bash
      run: mkdir -p ${{ steps.image.outputs.folder }}

    # The cache is an optimization, never a gate: if the registry is
    # unreachable (or the login fails), the build proceeds with a cold local
    # cache instead of failing, so a registry outage cannot block a release
    # build. Region and registry host are derived from the reference.
    - name: Report a disabled builder cache
      if: ${{ inputs.cache-image == '' }}
      shell: bash
      run: echo "::notice title=builder cache::cache-image is not configured; the builder image rebuilds from scratch on every run."

    - name: Log in to the builder cache registry
      id: cache
      if: ${{ inputs.cache-image != '' }}
      shell: bash
      env:
        CACHE_IMAGE: ${{ inputs.cache-image }}
      run: |
        set -euo pipefail
        registry="${CACHE_IMAGE%%/*}"
        region="$(printf '%s' "$registry" | cut -d. -f4)"
        if aws ecr get-login-password --region "$region" 2>/dev/null \
             | docker login --username AWS --password-stdin "$registry" >/dev/null 2>&1; then
          echo "ref=${CACHE_IMAGE}" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not log in to ${registry} for the builder-image cache; building with a cold cache."
          echo "ref=" >> "$GITHUB_OUTPUT"
        fi

    # image-manifest/oci-mediatypes: ECR rejects buildkit's default cache
    # manifest format; the OCI form is required for a registry cache there.
    # ignore-error on the export: a registry login can succeed while the role
    # lacks push rights on the repo (GetAuthorizationToken is granted broadly),
    # and buildkit otherwise fails the WHOLE build when the cache export is
    # rejected at the end - the cache must degrade, never gate.
    # mode=min exports the full layer set of this build: the `builder` target
    # is a single self-contained stage, so mode=max has no extra intermediate
    # stages to add. `load` streams the image straight into the local daemon
    # for the `docker run` compile below.
    - name: Build & Push builder image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      id: build
      with:
        context: .
        platforms: linux/${{ inputs.platform }}
        file: ./docker/Dockerfile
        target: builder
        cache-from: ${{ steps.cache.outputs.ref != '' && format('type=registry,ref={0}', steps.cache.outputs.ref) || format('type=local,src={0}', steps.image.outputs.folder) }}
        cache-to: ${{ steps.cache.outputs.ref != '' && format('type=registry,ref={0},mode=min,image-manifest=true,oci-mediatypes=true,ignore-error=true', steps.cache.outputs.ref) || format('type=local,dest={0}', steps.image.outputs.folder) }}
        push: false
        load: true
        tags: surrealdb-builder:${{ steps.image.outputs.tag }}-${{ inputs.platform }}

    - name: Output package versions
      shell: bash
      run: |
        set -x
        set +e
        go version ; cargo version ; rustc --version ; cmake --version ; gcc --version ; g++ --version ; perl -v

    - name: Determine ONNX architecture
      id: onnx
      shell: bash
      run: |
        if [[ "${{ inputs.platform }}" == "amd64" ]]; then
          echo "arch=x64" >> $GITHUB_OUTPUT
        else
          echo "arch=aarch64" >> $GITHUB_OUTPUT
        fi

    - name: Build binary
      shell: bash
      env:
        SURREAL_BUILD_VERSION: ${{ inputs.version-override }}
        SURREAL_BUILD_METADATA: ${{ inputs.build-metadata }}
      run: |
        set -x

        tag=$(echo ${{ github.ref_name }} | sed -e 's/[^a-zA-Z0-9]/-/g')

        # Build
        extra_args=""
        compile_profile="debug"
        if [[ "${{ inputs.name }}" == "ci" && "${{ inputs.upload }}" == "false" ]]; then
          extra_args="${extra_args} --features ${{ inputs.extra-features }}"
        else
          extra_args="${extra_args} --features default"
          if [[ ! -z "${{ inputs.extra-features }}" ]]; then
            extra_args="${extra_args} --features ${{ inputs.extra-features }}"
          fi
        fi
        if [[ "${{ inputs.release }}" == "true" ]]; then
          extra_args="${extra_args} --release"
          compile_profile="release"
        fi

        # Builder entrypoint downloads ONNX Runtime in-container when ORT_DOWNLOAD_URL is set.
        ORT_DOWNLOAD_URL="https://github.com/supertone-inc/onnxruntime-build/releases/download/v${{ inputs.onnx-version }}/onnxruntime-linux-${{ steps.onnx.outputs.arch }}-static_lib-${{ inputs.onnx-version }}.tgz"

        # Do not pass `-e RUSTFLAGS=` when unset: an empty RUSTFLAGS in the container
        # disables `[build] rustflags` from `.cargo/config.toml`.
        docker_env=(
          -e "SURREAL_BUILD_VERSION=$SURREAL_BUILD_VERSION"
          -e "SURREAL_BUILD_METADATA=$SURREAL_BUILD_METADATA"
          -e "ORT_DOWNLOAD_URL=$ORT_DOWNLOAD_URL"
        )
        if [[ -n "${RUSTFLAGS:-}" ]]; then
          docker_env+=(-e "RUSTFLAGS=${RUSTFLAGS}")
        fi

        docker run \
          --rm -t \
          -v $(pwd):/surrealdb \
          "${docker_env[@]}" \
          surrealdb-builder:${tag}-${{ inputs.platform }} \
            --target ${{ inputs.arch }} --no-default-features ${extra_args} --locked

        # Package
        cp target/${{ inputs.arch }}/${compile_profile}/surreal surreal
        tar -zcvf surreal-${{ inputs.name }}.linux-${{ inputs.platform }}.tgz surreal
        echo $(shasum -a 256 surreal-${{ inputs.name }}.linux-${{ inputs.platform }}.tgz | cut -f1 -d' ') > surreal-${{ inputs.name }}.linux-${{ inputs.platform }}.txt

        # Verify the binary is compatible with various Linux distributions
        docker run --platform linux/${{ inputs.platform }} --rm -t -v ./target/${{ inputs.arch }}/${compile_profile}/surreal:/surreal ubuntu:24.04 /surreal version
        docker run --platform linux/${{ inputs.platform }} --rm -t -v ./target/${{ inputs.arch }}/${compile_profile}/surreal:/surreal rockylinux/rockylinux:10 /surreal version
        docker run --platform linux/${{ inputs.platform }} --rm -t -v ./target/${{ inputs.arch }}/${compile_profile}/surreal:/surreal debian:12 /surreal version

    - name: Upload artifacts
      if: ${{ inputs.upload == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: surreal-${{ inputs.name }}.linux-${{ inputs.platform }}
        path: |
          surreal
          surreal-${{ inputs.name }}.linux-${{ inputs.platform }}.tgz
          surreal-${{ inputs.name }}.linux-${{ inputs.platform }}.txt
