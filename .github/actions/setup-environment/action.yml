name: 'Setup environment'
description: 'Install Rust toolchain, checkout sources, and setup cache'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: stable
  components:
    description: 'Additional Rust components to install (space-separated)'
    required: false
    default: ''
  targets:
    description: 'Additional targets to install (space-separated)'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: ''
  save-cache:
    description: 'Whether to save cache (typically only on main branch)'
    required: false
    default: 'false'
  workspaces:
    description: 'Workspaces to cache (multi-line string)'
    required: false
    default: ''
  cache-directories:
    description: 'Additional cache directories'
    required: false
    default: ''
  free-disk-space:
    description: 'Whether to free disk space by removing pre-installed software'
    required: false
    default: 'false'
  enable-kache:
    description: 'Whether to compile via kache (RUSTC_WRAPPER)'
    required: false
    default: 'true'
  kache-bucket:
    description: >-
      S3 bucket backing the shared compile cache. Empty compiles against a
      local, runner-lifetime store only - the fork-PR / unconfigured-secret
      path. A bucket that is set but unreachable FAILS the job: kache refuses
      to run against a silently cold remote, so a backend outage reds CI
      rather than quietly tripling every build.

      Only a push to a PROTECTED branch publishes to the bucket. kache holds
      pull requests, tags, dispatches and scheduled runs to reads no matter
      what credential they carry, so a PR cannot poison the shared cache -
      and cannot warm it either, not even from its own earlier runs. A PR
      reads what main last published; "Nothing to sync" in a PR's post step
      is that policy, not a failure.
    required: false
    default: ''
  kache-region:
    description: 'Region of kache-bucket.'
    required: false
    default: 'us-east-1'
  kache-access-key-id:
    description: >-
      Static access key for the cache bucket. Empty falls back to whatever the
      ambient credential chain resolves (e.g. a private runner's instance
      role).
    required: false
    default: ''
  kache-secret-access-key:
    description: 'Secret half of kache-access-key-id.'
    required: false
    default: ''
  kache-manifest-key:
    description: >-
      Scopes the build manifest kache warm-prefetches from, under the branch
      segment every key already carries. Every build variant sharing the bucket
      needs its own: an unscoped manifest defaults to the target triple, which
      all of them then overwrite, and prefetch collapses to nothing. The
      default - the job plus runner platform - separates jobs but cannot see
      the matrix, so pass this wherever legs of one job compile different
      features or cross-compile different targets on one runner.

      The branch segment is the base branch, not the running ref, so a pull
      request warms from the manifest its target published rather than from
      one under a ref that only exists for the merge. Cache entries stay
      shared across branches - they are content-addressed, so the lines that
      genuinely build the same dependency reuse each other's - and only the
      prefetch hint list is per-line.
    required: false
    default: ''
  kache-branch:
    description: >-
      Release line the manifest is keyed under. Defaults to the base branch,
      which is the line being built whenever the workflow ref is that line.
      Pass it where the two differ: a rolling rebuild dispatched from one line
      to rebuild another compiles that other line's sources, and would
      otherwise warm from - and be keyed under - the dispatching line.
    required: false
    default: ''
  kache-version:
    description: 'Pin the kache release to install. Empty installs the latest.'
    required: false
    default: ''
  kache-cache-dir:
    description: >-
      Local kache store. Defaults beside the workspace under the runner's temp
      directory, because kache shares artifact bytes by hardlink or reflink and
      neither can cross a mount: the per-user cache directory is on a different
      mount from the build tree on these runners, and every store and restore
      there degrades to a full copy. Point it at a persistent path on a runner
      whose store should outlive the job.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Free disk space
      # The cleanup commands are Linux-specific (sudo + GNU paths). Running them
      # on macOS/Windows runners only produces noise (read-only volume / missing
      # sudo), so restrict the step to Linux where it actually frees space.
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "Disk space before cleanup:"
        df -h /

        echo "Removing unnecessary software..."

        # Large language runtimes and toolchains
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf /usr/lib/jvm || true
        sudo rm -rf /opt/maven || true
        sudo rm -rf /usr/share/gradle* || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /usr/local/share/powershell || true
        sudo rm -rf /usr/local/share/vcpkg || true
        sudo rm -rf /usr/share/miniconda || true
        sudo rm -rf /usr/share/mono || true
        sudo rm -rf /var/lib/snapd || true

        # Browsers and drivers
        sudo rm -rf /usr/local/share/chromium || true
        sudo rm -rf /usr/local/share/gecko_driver || true
        sudo rm -rf /opt/microsoft/msedge || true

        # Docs and manuals
        sudo rm -rf /usr/share/doc || true
        sudo rm -rf /usr/share/man || true

        # Cloud tools
        sudo rm -rf /usr/share/az_* || true

        # Clean Docker
        sudo docker image prune --all --force || true

        # Clean apt cache
        sudo apt-get clean || true

        echo "Disk space after cleanup:"
        df -h /

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Installs the kache binary, points RUSTC_WRAPPER at it, and - when a bucket
    # is configured - starts the daemon that prefetches from S3 while cargo is
    # still fetching. Credentials reach the daemon as masked job environment
    # variables, which it holds for the job's lifetime.
    - name: Setup kache
      if: inputs.enable-kache == 'true'
      uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # (Actions must be pinned by commit hash) v1
      with:
        version: ${{ inputs.kache-version }}
        s3-bucket: ${{ inputs.kache-bucket }}
        s3-region: ${{ inputs.kache-region }}
        # Keyed under the repository so one bucket can serve several, and under
        # a kache/ segment so these objects stay separable from any other
        # cache's in the same bucket.
        s3-prefix: ${{ github.repository }}/kache
        s3-access-key-id: ${{ inputs.kache-access-key-id }}
        s3-secret-access-key: ${{ inputs.kache-secret-access-key }}
        manifest-key: ${{ format('{0}/{1}', inputs.kache-branch || github.base_ref || github.ref_name, inputs.kache-manifest-key || format('{0}-{1}-{2}', inputs.cache-key || github.job, runner.os, runner.arch)) }}
        cache-dir: ${{ inputs.kache-cache-dir || format('{0}/kache', runner.temp) }}
        # The GitHub Actions cache is a fixed 10GB per repository, already spent
        # on the registry caches below. A kache store persisted there would
        # evict them, so a job without a bucket caches locally or not at all -
        # the same reach the compile cache had before kache.
        github-cache: 'false'
        # Every job in a workflow would post its own; the job summary carries
        # the same report, and the workflows grant read-only token scopes.
        pr-comment: 'false'

    - name: Configure cargo for kache
      if: inputs.enable-kache == 'true'
      shell: bash
      # Incremental artifacts are per-machine and defeat a shared cache: they
      # would be recompiled on every runner and stored by none.
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    - name: Setup cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ inputs.save-cache }}
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        cache-directories: ${{ inputs.cache-directories }}
        cache-targets: false
