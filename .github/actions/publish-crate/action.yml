name: 'Publish crate'
description: 'Publish crate to crates.io'

inputs:
  publish:
    description: 'Whether to publish (false for dry-run)'
    required: false
    default: 'false'
  nightly-release:
    description: 'Whether this is a nightly release'
    required: false
    default: 'true'
  cargo-registry-token:
    description: 'Token for publishing to crates.io'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-environment
      with:
        # Precautionary headroom on the GitHub-hosted ubuntu-latest runner
        # (Linux-only, no-op elsewhere). Publishing now runs with --no-verify
        # (the rolling `package` gate already verify-built the workspace on this
        # SHA), so this no longer needs to fit a full rocksdb + wasm-opt rebuild;
        # it's kept as cheap insurance against packaging many large crates.
        free-disk-space: 'true'

    - name: Install release-plz
      uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # (Actions must be pinned by commit hash) v2.81.11
      with:
        tool: release-plz@0.3.159

    - name: Configure release-plz
      shell: bash
      run: |
        # publish_no_verify passes `--no-verify` to `cargo publish`, so release
        # does NOT rebuild each crate to verify its tarball before upload. That
        # verification already happened at rolling-build time (the `package`
        # channel gate runs `cargo package --locked --workspace` on this exact
        # SHA and gates the manifest), so re-doing the full workspace rebuild
        # here — rocksdb + wasm-opt C/C++ builds and all — is pure duplication.
        # This is the build-once / promote-many contract for crates: verify once
        # on push, upload the already-verified crates at promote time.
        cat << EOF > /tmp/release-plz.toml
        [workspace]
        changelog_update = false
        git_release_enable = false
        semver_check = false
        git_tag_enable = false
        publish_no_verify = true
        EOF

    # No CARGO_REGISTRY_TOKEN here: `cargo publish --dry-run` never contacts the
    # registry to upload, so the crates.io token is deliberately kept OUT of
    # scope for dry-runs (and for the nightly path, which only ever dry-runs).
    # The token is only injected into the real publish step below.
    - name: Publish the crate (dry-run)
      if: ${{ inputs.publish == 'false' || inputs.nightly-release == 'true' }}
      shell: bash
      run: |
        set -x
        
        # Create a temporary branch in case the git ref is not a branch
        git checkout -b crate
        
        echo "Running cargo publish --workspace --dry-run --no-verify"
        echo "Note: Failures here are informational and do not block nightly builds"
        echo "Common cause: workspace crates with new APIs not yet published"

        # --no-verify: the rolling `package` gate already ran
        # `cargo package --locked --workspace` on this SHA (build-once /
        # promote-many), so skip the redundant per-crate rebuild. This stays a
        # cheap name/version/registry sanity check on top of that gate.
        # Let this fail naturally - workflow will handle continuation
        cargo publish --workspace --dry-run --no-verify

    - name: Publish the crate
      if: ${{ inputs.publish == 'true' && inputs.nightly-release != 'true' }}
      shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ inputs.cargo-registry-token }}
      run: |
        set -x

        # Create a temporary branch in case the git ref is not a branch
        git checkout -b crate

        # Real publish - use release-plz for retry logic
        # If all crates are already published, release-plz will fail
        # We should treat this as success (idempotency)
        if ! release-plz release --config /tmp/release-plz.toml; then
          # Check if the failure was because everything is already published
          echo "release-plz failed, checking if all crates are already published..."

          # Get all workspace crates (exclude crates with publish = false)
          all_published=true
          for crate in $(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name'); do
            version=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            echo "Checking if $crate@$version is published..."

            if ! cargo search "$crate" --limit 1 | grep -q "^$crate = \"$version\""; then
              echo "  $crate@$version is NOT published"
              all_published=false
              break
            else
              echo "  $crate@$version is already published"
            fi
          done

          if [[ "$all_published" == "true" ]]; then
            echo "All crates are already published. Treating as success (idempotent)."
            exit 0
          else
            echo "Some crates failed to publish. Failing."
            exit 1
          fi
        fi


