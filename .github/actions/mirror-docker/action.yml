name: 'Mirror Docker image'
description: 'Faithfully mirror a prebuilt multi-arch image from private ECR to a public DockerHub repository, stripping build attestations'

inputs:
  ecr-registry:
    description: 'ECR registry host (e.g. <account>.dkr.ecr.<region>.amazonaws.com)'
    required: true
  ecr-repository:
    description: 'ECR repository name holding the rolling images'
    required: true
  source-tag:
    description: 'Rolling source tag (without the -dev suffix), e.g. rolling-<branch-slug>-<sha>'
    required: true
  tag-prefix:
    description: 'Public image tag prefix (sanitized release name), e.g. v3.1.2 or nightly'
    required: true
  tag-suffix:
    description: 'Public image tag suffix (e.g. -dev)'
    required: false
    default: ''
  environment:
    description: 'Release environment (nightly, alpha, beta, stable)'
    required: true
  latest:
    description: 'Whether to also publish the :latest tag'
    required: false
    default: 'false'
  oidc-connection-id:
    description: 'Docker OIDC connection ID for keyless DockerHub auth via GitHub Actions OIDC. The caller job must grant `id-token: write`.'
    required: true
  dest-repo:
    description: 'Destination DockerHub repository (namespace/name). Required and passed explicitly by every caller: no default, so a mis-wired or empty value is a loud failure rather than a silent push to the public flagship repo.'
    required: true
  extra-stable-tags:
    description: >-
      Whether a stable release also gets the moving :<major>.<minor> and :<major>
      tags. True for the engine image. False for the downstream licensed image,
      which follows the downstream tag convention (<name> + optional :latest only).
    required: false
    default: 'true'
  dry-run:
    description: 'Verify the source manifests in ECR and compute the public tags, but do not create/push anything on DockerHub'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # Ambient auth: the private runner's IAM instance role provides ECR
    # credentials, so no configure-aws-credentials / static keys are needed.
    - name: Login to Amazon ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
      run: |
        set -euo pipefail
        region="$(printf '%s' "$ECR_REGISTRY" | cut -d. -f4)"
        aws ecr get-login-password --region "$region" \
          | docker login --username AWS --password-stdin "$ECR_REGISTRY"

    # OIDC keyless auth: the DockerHub login username is the org that owns the
    # destination repo (the namespace before the '/'), so it can never drift from
    # the repo being pushed to. login-action exchanges the job's GitHub OIDC token
    # (id-token: write, granted by the caller) for a short-lived DockerHub token
    # scoped by the org's OIDC connection rulesets. No long-lived credential.
    #
    # This couples the login org to the OIDC connection: dest-repo's namespace must
    # be the same Docker org that owns oidc-connection-id, otherwise the exchange is
    # rejected. Both currently resolve to the `surrealdb` org.
    - name: Resolve DockerHub org
      id: docker-org
      shell: bash
      env:
        DEST_REPO: ${{ inputs.dest-repo }}
      run: |
        set -euo pipefail
        # Guard a malformed dest-repo here so it fails on the real cause rather
        # than as a confusing empty-username OIDC error two steps later.
        if [[ "$DEST_REPO" != */* ]]; then
          echo "::error::dest-repo must be '<org>/<name>', got '${DEST_REPO}'"
          exit 1
        fi
        printf 'name=%s\n' "${DEST_REPO%%/*}" >> "$GITHUB_OUTPUT"

    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ steps.docker-org.outputs.name }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.oidc-connection-id }}

    # Mirror the multi-arch image from ECR to DockerHub by recreating the index
    # from the per-platform manifests ONLY. This deliberately omits the
    # BuildKit attestation manifests (provenance/SBOM), whose in-toto
    # subject/materials encode the ECR registry host and AWS account ID. The
    # per-platform manifest digests (and therefore the layers) are preserved, so
    # the public image is byte-identical to run; only the build attestations are
    # dropped. Image/binary signing + clean attestation regeneration is planned
    # as a follow-up.
    - name: Mirror image (strip attestations)
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        TAG_SUFFIX: ${{ inputs.tag-suffix }}
        ENVIRONMENT: ${{ inputs.environment }}
        LATEST: ${{ inputs.latest }}
        DEST_REPO: ${{ inputs.dest-repo }}
        EXTRA_STABLE_TAGS: ${{ inputs.extra-stable-tags }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        src="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SOURCE_TAG}${TAG_SUFFIX}"
        raw=$(docker buildx imagetools inspect "$src" --raw)

        # Per-platform manifest digests. The arch filter naturally excludes the
        # attestation manifests (which report platform unknown/unknown).
        amd64=$(echo "$raw" | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' | head -n1)
        arm64=$(echo "$raw" | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="arm64") | .digest' | head -n1)

        if [[ -z "$amd64" || -z "$arm64" ]]; then
          echo "::error::Could not resolve linux/amd64 + linux/arm64 platform digests from ${SOURCE_TAG}${TAG_SUFFIX}"
          exit 1
        fi

        # Public tag matrix (mirrors the previous docker-build behaviour).
        dest="${DEST_REPO}"
        tags=("${dest}:${TAG_PREFIX}${TAG_SUFFIX}")
        if [[ "$ENVIRONMENT" == "stable" && "${EXTRA_STABLE_TAGS}" == "true" ]]; then
          major=$(echo "$TAG_PREFIX" | cut -d. -f1)
          minor=$(echo "$TAG_PREFIX" | cut -d. -f2)
          tags+=("${dest}:${major}.${minor}${TAG_SUFFIX}" "${dest}:${major}${TAG_SUFFIX}")
        fi
        if [[ "$LATEST" == "true" ]]; then
          tags+=("${dest}:latest${TAG_SUFFIX}")
        fi

        tag_args=()
        for t in "${tags[@]}"; do
          tag_args+=(--tag "$t")
        done

        # Dry run: the source manifests were already inspected above (proving
        # the release image exists in ECR and both platform digests resolve);
        # report the tags that WOULD be created and stop before any push.
        if [[ "${DRY_RUN:-false}" == "true" ]]; then
          echo "[dry-run] Source manifests verified in ECR (amd64 ${amd64}, arm64 ${arm64})."
          echo "[dry-run] Would create: ${tags[*]}"
          exit 0
        fi

        echo "Mirroring ${SOURCE_TAG}${TAG_SUFFIX} -> ${tags[*]}"
        docker buildx imagetools create "${tag_args[@]}" \
          "${ECR_REGISTRY}/${ECR_REPOSITORY}@${amd64}" \
          "${ECR_REGISTRY}/${ECR_REPOSITORY}@${arm64}"

        # Faithful-mirror check: every public tag must resolve to the SAME
        # per-platform digests as the ECR source. (The top-level index digest
        # intentionally differs because the attestation manifests were dropped.)
        for t in "${tags[@]}"; do
          draw=$(docker buildx imagetools inspect "$t" --raw)
          d_amd=$(echo "$draw" | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' | head -n1)
          d_arm=$(echo "$draw" | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="arm64") | .digest' | head -n1)
          if [[ "$d_amd" != "$amd64" || "$d_arm" != "$arm64" ]]; then
            echo "::error::Mirror verification failed for ${t} (amd64 ${d_amd} vs ${amd64}; arm64 ${d_arm} vs ${arm64})"
            exit 1
          fi
          echo "Verified ${t} mirrors the ECR source faithfully"
        done
