name: 'Locate rolling build'
description: >-
  Resolve the requested ref to a concrete released commit and verify its
  rolling artifacts exist (waiting for in-progress builds on versioned
  releases). Extracted verbatim from release.yml; the interface is the ENV
  VARS set on the calling step - EVENT, CHANNEL, ROLLING_BUCKET, AWS_REGION,
  REQUESTED_REF, GH_TOKEN, WAIT_MINUTES - which
  propagate into this composite step's process environment. Needs the repo
  checked out at the workspace root (it resolves refs with git) and AWS
  credentials able to read the rolling bucket.

outputs:
  git-sha:
    description: 'Resolved engine commit to release'
    value: ${{ steps.locate.outputs.git-sha }}
  git-branch:
    description: 'Release-line branch the commit belongs to'
    value: ${{ steps.locate.outputs.git-branch }}
  branch-slug:
    description: 'Slug of the branch (rolling S3 prefix component)'
    value: ${{ steps.locate.outputs.branch-slug }}
  source-name:
    description: 'Rolling build name the artifacts were stored under'
    value: ${{ steps.locate.outputs.source-name }}
  s3-prefix:
    description: 'S3 prefix the rolling artifacts live under'
    value: ${{ steps.locate.outputs.s3-prefix }}
  rolling-source-tag:
    description: 'Rolling Docker source tag for the engine image (engine sha only)'
    value: ${{ steps.locate.outputs.rolling-source-tag }}

runs:
  using: 'composite'
  steps:
    - name: Locate rolling build
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1 || true

        # Shared S3 presence probe. Echoes aws's listing on stdout and returns
        # its exit status, distinguishing the two ways `aws s3 ls` fails:
        #   * genuine ABSENCE (artifact not built yet): non-zero exit, NO stderr.
        #     This is the normal "keep waiting" case and stays quiet.
        #   * real READ FAILURE (credentials, region, network, permissions):
        #     non-zero exit WITH a diagnostic on stderr. Surfaced ONCE as a
        #     warning - an unreadable bucket otherwise looks identical to a
        #     not-yet-built artifact, so the wait would silently burn its whole
        #     timeout and report "not built" for a build that in fact completed.
        s3_read_warned=false
        s3_ls() {
          local out rc=0 errf
          errf="$(mktemp)"
          out="$(aws s3 ls "$1" 2>"${errf}")" || rc=$?
          if [[ ${rc} -ne 0 && -s "${errf}" && "${s3_read_warned}" != "true" ]]; then
            echo "::warning title=Rolling-artifact read failed::aws s3 ls '$1' failed (AWS_REGION=${AWS_REGION:-<unset>}): $(tr '\n' ' ' <"${errf}"). The wait treats an unreadable bucket the same as a not-yet-built artifact, so it will run to the ${WAIT_MINUTES}m timeout unless this is fixed - check this job's AWS credentials, AWS_REGION, and s3:ListBucket/GetObject on the bucket." >&2
            s3_read_warned=true
          fi
          rm -f "${errf}"
          printf '%s' "${out}"
          return ${rc}
        }

        manifest_exists() {
          s3_ls "s3://${ROLLING_BUCKET}/rolling-builds/$1/$2/engine.json" >/dev/null
        }
        # A commit is only engine-promotable if its release BINARIES still exist,
        # not just its engine.json. prune deletes a superseded commit's heavy
        # binaries but KEEPS its manifest, so checking the manifest alone would
        # green-light a commit whose binaries are gone — publish-crates
        # (irreversible) would run and only then promote would fail on the
        # missing binaries, leaving a half-published release. Fail fast here.
        binaries_exist() {
          # Read the listing into a variable, THEN match. Piping `aws s3 ls |
          # grep -q` under `set -o pipefail` is a false-negative trap: `grep -q`
          # exits on the first match and closes the pipe, `aws` (which streams
          # its output object-by-object) then dies with SIGPIPE (141), and
          # pipefail propagates that as the pipeline's status - reporting "no
          # binaries" for a prefix that is full of them. Reading into a variable
          # removes the pipe entirely so only the presence of a match decides.
          local listing
          listing="$(s3_ls "s3://${ROLLING_BUCKET}/rolling-builds/$1/$2/")" || return 1
          printf '%s\n' "${listing}" | grep -qE 'surreal-.*\.(tgz|exe)$'
        }

        # Minutes to wait for an in-progress rolling build (versioned releases
        # only; see wait_for_build). Defaults to 120; guard against a bad input.
        WAIT_MINUTES="${WAIT_MINUTES:-120}"
        [[ "$WAIT_MINUTES" =~ ^[0-9]+$ ]] || WAIT_MINUTES=120

        # Fetch the most recent run of workflow $1 that BUILT commit $2 as
        # {workflow_runs: [...]} JSON on stdout (newest first), in two stages:
        #   1. scan the newest 100 runs and keep those matching head_sha == $2
        #      (push/schedule builds, whose head_sha IS the built commit) OR the
        #      run-name's "@ <$2>" (a build DISPATCHED with a git-sha input, whose
        #      head_sha is the dispatching ref, not the built commit). This picks
        #      the newest run across BOTH match kinds, so a failed push followed by
        #      a dispatched rebuild resolves to the rebuild, not the stale failure.
        #   2. ONLY if the scan finds nothing (no matching run in the newest 100),
        #      fall back to an exact server-side ?head_sha= lookup, which has NO age
        #      limit, to catch an OLD push/schedule build. (A DISPATCHED rebuild
        #      older than 100 runs is the sole residual gap; artifact presence stays
        #      the authoritative success signal.)
        # Scan-first matters: a commit on main almost always has a same-sha push
        # run, so a head_sha-first short-circuit would never reach the dispatch
        # scan and would return the stale push result over a newer rebuild.
        # Exit status encodes API reachability, NOT whether a run exists:
        #   0  -> HTTP 200; body emitted. An empty workflow_runs array is a
        #         legitimate "this commit was never built" and still returns 0.
        #   1  -> any other HTTP status or a transport failure. INDETERMINATE, not
        #         "no run": a diagnostic (with the HTTP code) goes to stderr and
        #         decision-path callers MUST fail closed. Treating an unreadable
        #         API as "no run" is what silently skips a broken build. Requires
        #         the job to grant `actions: read`.
        gh_runs() {
          local tmp http n scanned
          # Stage 1: newest-100 scan; newest matching run across both match kinds.
          tmp="$(mktemp)"
          http="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "${tmp}" -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?per_page=100" 2>/dev/null)" || http="000"
          if [[ "${http}" != "200" ]]; then
            echo "gh_runs: Actions API read failed for $1 (HTTP ${http}); this job needs 'actions: read' and api.github.com must be reachable." >&2
            rm -f "${tmp}"
            return 1
          fi
          # `contains` is a plain substring test (the sha is regex-safe hex); the
          # API returns runs newest-first, so [0] downstream is the latest match.
          scanned="$(jq --arg sha "$2" '{workflow_runs: [.workflow_runs[]
            | select(.head_sha == $sha or ((.display_title // "") | contains($sha)))]}' "${tmp}" 2>/dev/null)"
          rm -f "${tmp}"
          n="$(printf '%s' "$scanned" | jq '.workflow_runs | length' 2>/dev/null || echo 0)"
          if [ "${n:-0}" -gt 0 ]; then
            printf '%s' "$scanned"
            return 0
          fi

          # Stage 2 (fallback): no match in the newest 100 - the commit may still
          # have an OLD push/schedule build. Exact server-side head_sha lookup, no
          # age limit.
          tmp="$(mktemp)"
          http="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "${tmp}" -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?head_sha=$2&per_page=1" 2>/dev/null)" || http="000"
          if [[ "${http}" != "200" ]]; then
            echo "gh_runs: Actions API read failed for $1 (HTTP ${http}); this job needs 'actions: read' and api.github.com must be reachable." >&2
            rm -f "${tmp}"
            return 1
          fi
          cat "${tmp}"
          rm -f "${tmp}"
        }

        # "<status>:<conclusion>" of the most recent run of workflow $1 that built
        # commit $2 (e.g. "in_progress:" or "completed:failure"); empty string when
        # no such run exists. Propagates gh_runs' non-zero exit on an API error (see
        # gh_runs), so decision-path callers can fail closed. Used only to fail fast
        # on a dead build — artifact presence is the success signal.
        run_state() {
          local json
          json="$(gh_runs "$1" "$2")" || return 1
          printf '%s' "$json" | jq -r '
            if (.workflow_runs | length) == 0 then ""
            else (.workflow_runs[0] | (.status // "") + ":" + (.conclusion // "")) end' 2>/dev/null
        }

        # Web URL of the most recent run of workflow $1 that built commit $2 (empty
        # when none exists). Propagates gh_runs' non-zero exit on an API error. Used
        # to point an operator straight at the rolling build whose failure blocks a
        # release, so they read the real error there instead of inferring it from a
        # missing-artifact message.
        run_url() {
          local json
          json="$(gh_runs "$1" "$2")" || return 1
          printf '%s' "$json" | jq -r '.workflow_runs[0].html_url // ""' 2>/dev/null
        }

        # Block until a rolling build's promotable artifacts exist, instead of
        # failing the instant a freshly-pushed tip hasn't finished building. Polls
        # S3 for the artifacts and the Actions API for the build's run state, so a
        # build that already CONCLUDED unsuccessfully errors out immediately
        # (rather than burning the whole window) and a truly-absent build still
        # ends in a clear timeout. Args: <slug> <sha>.
        wait_for_build() {
          local s="$1" c="$2" st warned=false deadline
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            if manifest_exists "$s" "$c" && binaries_exist "$s" "$c"; then
              echo "Engine rolling build present for ${c}."
              return 0
            fi
            if (( $(date +%s) >= deadline )); then
              if [[ "${s3_read_warned}" == "true" ]]; then
                echo "::error::Timed out after ${WAIT_MINUTES}m, but reads of the artifact bucket were FAILING (see the warning above) - this is an S3 access problem in THIS job, not a missing build. The rolling artifacts for ${c} are likely already present; fix the bucket access (AWS credentials / AWS_REGION / s3 permissions) and re-release rather than rebuilding."
              else
                echo "::error::Timed out after ${WAIT_MINUTES}m waiting for the rolling build of ${c} (rolling-builds/${s}/${c}). Re-run rolling-build.yml for this commit, or release a commit that is already built."
              fi
              exit 1
            fi
            # Unlike the one-shot walk-back below, this poll TOLERATES an API
            # error (stderr from gh_runs suppressed, non-zero swallowed): the
            # loop is bounded by ${WAIT_MINUTES} and the authoritative signal is
            # artifact presence (checked above), so a transient failure just
            # means "state unknown this poll" — keep waiting rather than abort.
            st="$(run_state rolling-build.yml "$c" 2>/dev/null || true)"
            if [[ "$st" == completed:* && "$st" != completed:success ]]; then
              echo "::error::The rolling build for ${c} finished as '${st#completed:}' and produced no promotable artifacts. Fix the build and re-run rolling-build.yml for this commit before releasing."
              exit 1
            fi
            if [[ "$warned" != "true" ]]; then
              echo "::warning::The rolling build of ${c} is not ready yet (run state: ${st:-<none found>}). Waiting up to ${WAIT_MINUTES}m for it to finish before promoting."
              warned=true
            fi
            echo "Waiting for the build of ${c}… (state: ${st:-<none>})"
            sleep 45
          done
        }

        if [[ "$EVENT" == "schedule" ]]; then
          # Walk back main history for the newest commit that has a completed
          # rolling build, so a still-building HEAD doesn't fail the nightly.
          chosen="main"
          slug="main"
          sha=""
          # Newest commit that is fully promotable: both the
          # manifest AND the binaries are present (a superseded commit keeps its
          # manifest but not its pruned binaries), so the nightly never picks a
          # commit that would fail at promote time.
          while read -r c; do
            if manifest_exists "$slug" "$c" && binaries_exist "$slug" "$c"; then sha="$c"; break; fi
            # No promotable artifacts for $c. Fail if its build was ATTEMPTED
            # and concluded unsuccessfully rather than silently walking back to
            # an older build, which masks a broken newest build (the confusing
            # "rolling build failed but the nightly passed" case). A
            # completed:success with missing binaries is a SUPERSEDED commit
            # (its binaries were pruned) and is skipped; a not-yet-built or
            # in-progress commit (run state not "completed:*") is skipped too.
            # Fail closed on an API error: an unreadable run state must NOT be
            # mistaken for "not built yet" and skipped: that is the masking
            # that lets a broken newest build be passed over and a stale
            # nightly promoted.
            if ! st="$(run_state rolling-build.yml "$c")"; then
              echo "::error::Tonight's nightly cannot be promoted: could not read the Actions API to check the rolling build of ${c} (see the log line above). Failing closed rather than skipping the check, which could promote a stale nightly while the newest build is broken. Ensure this job has 'actions: read', then re-run."
              exit 1
            fi
            if [[ "$st" == completed:* && "$st" != completed:success ]]; then
              url="$(run_url rolling-build.yml "$c" 2>/dev/null || true)"
              echo "::error::Tonight's nightly cannot be promoted: the newest rolling build on main (commit ${c}) finished as '${st#completed:}' and produced no releasable artifacts. Rather than silently ship an older nightly and hide this breakage, the promotion fails. Open the failed build run for the underlying error, fix it, and re-run the build for this commit${url:+: ${url}}."
              exit 1
            fi
          done < <(git rev-list origin/main | head -n 100)
          if [[ -z "$sha" ]]; then
            echo "::error::No commit in the last 100 on main has a completed rolling build (manifest + binaries) to release."
            exit 1
          fi
          source_name="rolling-${sha}"
        else
          # Resolve the requested ref to the full 40-char SHA the rolling build
          # stored artifacts under. The ref may be:
          #   * empty    -> default to the tip of the highest releases/X.Y line
          #                 (the usual "release the latest release branch" case),
          #   * a branch -> use that branch's tip (e.g. releases/3.2, main),
          #   * a commit  -> canonicalize whatever was supplied (short/cased SHA).
          # origin/* refs are all present from the fetch above, so this holds
          # regardless of which ref `Checkout sources` landed on.
          if [[ -z "$REQUESTED_REF" ]]; then
            if [[ "$CHANNEL" == "nightly" ]]; then
              # A nightly must come from main, so default there.
              target="origin/main"
              echo "No ref supplied; defaulting to the tip of main for a nightly release."
            else
              latest_line=$(git branch -r --format='%(refname:short)' \
                | sed -n 's#^origin/releases/##p' \
                | grep -E '^[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n | tail -n1)
              if [[ -z "$latest_line" ]]; then
                echo "::error::No releases/* branch exists to default to; pass an explicit git-sha (a commit or branch)."
                exit 1
              fi
              target="origin/releases/${latest_line}"
              echo "No ref supplied; defaulting to the tip of the latest release branch (releases/${latest_line})."
            fi
          elif git show-ref --verify --quiet "refs/remotes/origin/${REQUESTED_REF}"; then
            target="origin/${REQUESTED_REF}"
            echo "Resolving branch '${REQUESTED_REF}' to its tip."
          else
            target="$REQUESTED_REF"
          fi
          if ! sha=$(git rev-parse --verify --quiet "${target}^{commit}"); then
            echo "::error::Could not resolve '${REQUESTED_REF:-<latest release branch>}' to a commit."
            exit 1
          fi

          mapfile -t branches < <(git branch -r --contains "$sha" --format='%(refname:short)' 2>/dev/null | sed 's#^origin/##' || true)
          on_main=false
          for b in "${branches[@]}"; do [[ "$b" == "main" ]] && on_main=true && break; done

          if [[ "$CHANNEL" == "nightly" ]]; then
            if [[ "$on_main" != "true" ]]; then
              echo "::error::Commit ${sha} is not on main; a nightly release must come from main."
              exit 1
            fi
            chosen="main"
            slug="main"
            source_name="rolling-${sha}"
          else
            # A versioned release must map to exactly one release line. Fail
            # loudly on ambiguity rather than guessing the wrong branch.
            mapfile -t rel < <(printf '%s\n' "${branches[@]}" | grep -E '^releases/' || true)
            if [[ "${#rel[@]}" -eq 0 ]]; then
              echo "::error::Commit ${sha} is not on any releases/* branch."
              exit 1
            elif [[ "${#rel[@]}" -gt 1 ]]; then
              echo "::error::Commit ${sha} is on multiple release branches (${rel[*]}); cannot determine which line to release."
              exit 1
            fi
            chosen="${rel[0]}"
            slug=$(echo "$chosen" | sed -e 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            source_name="rolling-${sha}"
            # `latest` is decided later (the "Determine latest release pointer"
            # step), from the PUBLISHED stable versions rather than the branch:
            # being the tip of the highest release branch is neither necessary
            # nor sufficient to own `latest`.
          fi

          # A VERSIONED (release-branch) release WAITS for the rolling build of
          # this commit instead of failing the moment a freshly-pushed tip hasn't
          # finished building (this wait is deliberately release-branch only).
          #
          # A nightly (manual) dispatch keeps the original fail-fast.
          if [[ "$CHANNEL" == "versioned" ]]; then
            wait_for_build "$slug" "$sha"
          else
            if ! manifest_exists "$slug" "$sha"; then
              # Manifest ABSENT (not the pruned case: prune keeps engine.json and
              # only removes the binaries — that is the next check). So the
              # rolling build for this commit never finished successfully. Lead
              # with the plain reason and link the build run so the operator can
              # read the real error there.
              # The release cannot proceed either way (manifest absent). Consult
              # the Actions API only to enrich the message: link the failed run
              # if one exists, or say to build the commit if none does. If that
              # read fails, say we couldn't check — never claim "no run exists"
              # on an unreadable API.
              if url="$(run_url rolling-build.yml "$sha")"; then
                if [[ -n "$url" ]]; then
                  echo "::error::This nightly cannot be promoted: the rolling build for commit ${sha} did not succeed, so it produced no releasable engine artifacts. Open the rolling build run for the underlying error, fix it, and re-run the build for this commit, then retry the release: ${url}"
                else
                  echo "::error::This nightly cannot be promoted: no rolling build has produced releasable engine artifacts for commit ${sha} (no rolling-build.yml run was found for it). Run rolling-build.yml for this commit and, once it succeeds, retry the release."
                fi
              else
                echo "::error::This nightly cannot be promoted: no rolling build manifest exists for commit ${sha}, so it was never built successfully. Also could not reach the Actions API to link the specific build run (see the log line above); this job needs 'actions: read'."
              fi
              exit 1
            fi
            if ! binaries_exist "$slug" "$sha"; then
              echo "::error::engine.json exists for ${sha} but its release binaries under rolling-builds/${slug}/${sha}/ are gone (a superseded commit whose binaries were pruned). Refusing to release: crate publishing would succeed but binary promotion would then fail. Re-run the rolling build for this commit to rebuild the binaries."
              exit 1
            fi
          fi
        fi

        echo "Releasing ${sha} from ${chosen} (rolling-builds/${slug}/${sha})"
        {
          echo "git-sha=${sha}"
          echo "source-name=${source_name}"
          echo "git-branch=${chosen}"
          echo "branch-slug=${slug}"
          echo "s3-prefix=rolling-builds/${slug}/${sha}"
          echo "rolling-source-tag=rolling-${slug}-${sha}"
        } >> "$GITHUB_OUTPUT"
