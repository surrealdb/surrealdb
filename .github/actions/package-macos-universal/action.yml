name: 'Package macOS universal binary'
description: 'Create a macOS universal binary from the amd64 and arm64 builds and upload it as an artifact'

inputs:
  name:
    description: 'Build name (e.g., rolling-<sha>)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download amd64 binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: surreal-${{ inputs.name }}.darwin-amd64
        path: amd64

    - name: Download arm64 binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: surreal-${{ inputs.name }}.darwin-arm64
        path: arm64

    - name: Package universal macOS binary
      shell: bash
      env:
        FILE: surreal-${{ inputs.name }}.darwin-universal
      run: |
        set -euo pipefail
        lipo -create -output surreal amd64/surreal arm64/surreal
        chmod +x surreal
        tar -zcvf "$FILE.tgz" surreal
        shasum -a 256 "$FILE.tgz" | cut -f1 -d' ' > "$FILE.txt"

    - name: Upload artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: surreal-${{ inputs.name }}.darwin-universal
        path: |
          surreal-${{ inputs.name }}.darwin-universal.tgz
          surreal-${{ inputs.name }}.darwin-universal.txt
