name: 'Package crates'
description: 'Verify the workspace crates package cleanly for crates.io'

inputs:
  save-cache:
    description: 'Whether to save the cargo cache'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-environment
      with:
        save-cache: ${{ inputs.save-cache }}
        # `cargo package` compiles the whole workspace + deps to verify each crate
        # tarball, which overflows a hosted runner's default disk. Reclaim space
        # (preinstalled Android SDK, .NET, GHC, etc.) before building. No-op on
        # non-Linux / self-hosted runners.
        free-disk-space: 'true'

    - name: Install tools
      uses: ./.github/actions/install-tools

    - name: Package crates
      shell: bash
      run: cargo make ci-package
